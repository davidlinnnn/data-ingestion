# A Processing Profile file that reaches dev is released (ADR-0010). For each released profile
# without them, this pushes the tag profile/<id> and opens the branch release/<id with ->, which
# patches of that version go to (src/kp_canonicalization/profiles/README.md). Which files count
# as released is scripts/check-method-versions' rule, so this job and the pull request check
# cannot disagree. Only the newest version is tagged here: an older one that was missed needs its
# own release commit, which this job cannot know. Building and pushing the image is #137.
name: release-profile

on:
  push:
    branches: [dev]
    paths:
      - src/kp_canonicalization/profiles/**
      - scripts/check-method-versions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"

      - name: Tag released profiles and open their release branches
        run: |
          set -euo pipefail
          have() { git ls-remote --exit-code origin "$1" >/dev/null; }
          ids=$(scripts/check-method-versions --released HEAD | sort -t@ -k2 -n)
          for id in $ids; do
            tag="refs/tags/profile/$id"
            branch="refs/heads/release/${id/@/-}"
            if have "$tag" && have "$branch"; then continue; fi
            if [ "$id" != "$(tail -1 <<<"$ids")" ]; then
              echo "::error::$id lacks its tag or release branch, and dev has moved past it: push them by hand at its release commit"
              exit 1
            fi
            have "$tag" || git push origin "HEAD:$tag"
            have "$branch" || git push origin "HEAD:$branch"
          done
