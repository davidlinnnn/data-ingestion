# Runs ruff, pyright and the whole pytest suite on every pull request, including the tests
# the Codex sandbox cannot run: the S3 contract against tests/s3/compose.yaml (marker `s3`)
# and the local-socket tests (marker `network`, which download the Temporal dev server).
# The docling tests need the pinned weights, fetched once per manifest and verified against it.
# pytest runs in parallel shards (scripts/test-shard): docling on the runner's CPU made one job
# take about 10 minutes.
name: code-checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint, format and type check
        run: scripts/check

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      KP_S3_ENDPOINT: http://127.0.0.1:9100
      KP_S3_BUCKET: kp-dev
      AWS_ACCESS_KEY_ID: kpdev
      AWS_SECRET_ACCESS_KEY: kpdev-secret
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/models/docling
          key: models-${{ hashFiles('src/kp_processing/model-manifest.json') }}

      - name: Fetch model weights
        run: uv run scripts/fetch-models && git diff --exit-code src/kp_processing/model-manifest.json

      - name: Start the S3 stand-in
        run: docker compose -f tests/s3/compose.yaml up -d --wait

      - name: Tests
        run: scripts/test-shard ${{ matrix.shard }}
        env:
          HF_HUB_OFFLINE: "1"
