# Runs ruff, pyright and the whole pytest suite on every pull request that changes more than
# Markdown (docs-checks covers Markdown; no test reads the repo's Markdown), including the tests
# that need Docker or a local socket: the S3 contract against tests/s3/compose.yaml (marker `s3`)
# and the local-socket tests (marker `network`, which download the Temporal dev server).
# The docling tests need the pinned weights, fetched once per manifest and verified against it.
# pytest runs in parallel shards (scripts/test-shard): docling on the runner's CPU made one job
# take about 10 minutes.
name: code-checks

on:
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint, format and type check
        run: scripts/check

  tests:
    runs-on: ubuntu-latest
    # A hung test fails here instead of at GitHub's 6-hour limit; a cold weight cache took 16 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      KP_S3_ENDPOINT: http://127.0.0.1:9100
      KP_S3_BUCKET: kp-dev
      AWS_ACCESS_KEY_ID: kpdev
      AWS_SECRET_ACCESS_KEY: kpdev-secret
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/models/docling
          key: models-${{ hashFiles('src/kp_canonicalization/model-manifest.json') }}

      - name: Fetch model weights
        run: uv run scripts/fetch-models && git diff --exit-code src/kp_canonicalization/model-manifest.json

      - name: Start the S3 stand-in
        run: docker compose -f tests/s3/compose.yaml up -d --wait

      - name: Tests
        run: scripts/test-shard ${{ matrix.shard }} --store-durations --clean-durations
        env:
          HF_HUB_OFFLINE: "1"

      - name: Keep this shard's test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-${{ matrix.shard }}
          path: .test_durations
          include-hidden-files: true
