apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: temporal-data, namespace: pdf-checkpoint-prototype}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: temporal, namespace: pdf-checkpoint-prototype}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pdf-temporal}
  template:
    metadata:
      labels: {app: pdf-temporal}
    spec:
      nodeSelector:
        kubernetes.io/hostname: internal-a2a-vs6-local-worker2
      containers:
      - name: temporal
        image: temporalio/temporal@sha256:cea463d98a8d6def4420f903ea5c3fcd0d85c8d10fbcc2770a50c12fff2eb26d
        imagePullPolicy: IfNotPresent
        args: [server, start-dev, --ip, 0.0.0.0, --db-filename, /data/temporal.db, --headless]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: temporal-data}
---
apiVersion: v1
kind: Service
metadata: {name: temporal, namespace: pdf-checkpoint-prototype}
spec:
  selector: {app: pdf-temporal}
  ports:
  - {port: 7233, targetPort: 7233}
