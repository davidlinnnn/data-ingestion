apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-data
  namespace: pdf-checkpoint-prototype
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: objects
  namespace: pdf-checkpoint-prototype
spec:
  replicas: 1
  selector:
    matchLabels: {app: pdf-objects}
  template:
    metadata:
      labels: {app: pdf-objects}
    spec:
      nodeSelector:
        kubernetes.io/hostname: internal-a2a-vs6-local-worker2
      containers:
      - name: minio
        image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        imagePullPolicy: IfNotPresent
        args: [server, /data]
        env:
        - {name: MINIO_ROOT_USER, value: prototype-local}
        - {name: MINIO_ROOT_PASSWORD, value: prototype-local-only-password}
        ports:
        - {containerPort: 9000}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: object-data}
---
apiVersion: v1
kind: Service
metadata:
  name: objects
  namespace: pdf-checkpoint-prototype
spec:
  selector: {app: pdf-objects}
  ports:
  - {port: 9000, targetPort: 9000}
