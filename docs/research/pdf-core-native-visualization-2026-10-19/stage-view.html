<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docling 各階段檢視</title>
<style>
  :root { color-scheme:light; font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif; color:#182534; background:#f3f5f7; }
  * { box-sizing:border-box; }
  body { margin:0; }
  button,a { -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:#005e9f; overflow-wrap:anywhere; }
  button:focus-visible,a:focus-visible { outline:3px solid #1583cd; outline-offset:3px; }
  header { background:#fff; border-bottom:1px solid #dce2e8; padding:24px max(20px,calc((100vw - 1600px)/2)); }
  h1 { font-size:clamp(1.4rem,2.2vw,2rem); line-height:1.3; margin:0 0 8px; }
  h2 { font-size:1.3rem; margin:0 0 8px; }
  h3 { font-size:1rem; margin:0 0 10px; }
  p { margin:0 0 12px; }
  .muted { color:#586775; }
  .notice { background:#fff7df; border-left:4px solid #bf8618; padding:10px 14px; margin-top:12px; overflow-wrap:anywhere; }
  .shell { display:grid; grid-template-columns:238px minmax(0,1fr); gap:20px; max-width:1640px; margin:auto; padding:20px; align-items:start; }
  nav { min-width:0; position:sticky; top:16px; background:#fff; border:1px solid #dce2e8; border-radius:10px; padding:12px; }
  .nav-title { font-size:.85rem; margin:0 7px 10px; font-weight:700; color:#586775; }
  .mobile-label,#stage-select { display:none; }
  .stage-button { display:block; width:100%; text-align:left; background:none; border:1px solid transparent; border-radius:7px; padding:10px; margin:3px 0; line-height:1.35; overflow-wrap:anywhere; }
  .stage-button:hover { background:#f1f6fa; }
  .stage-button[aria-current=step] { background:#e7f2fb; border-color:#83b8de; color:#064f86; }
  .stage-button small { display:block; color:#647382; margin-top:5px; font-size:.75rem; }
  main { min-width:0; }
  .panel { border:1px solid #dce2e8; border-radius:10px; background:#fff; padding:18px; min-width:0; }
  .stage-head { margin-bottom:16px; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 10px; }
  .tag { font-size:.78rem; padding:3px 8px; border-radius:4px; border:1px solid #d3dde6; background:#f1f5f8; overflow-wrap:anywhere; }
  .source { font-size:.88rem; color:#586775; overflow-wrap:anywhere; }
  .columns { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr); gap:16px; align-items:start; }
  .visuals,.evidence { min-width:0; }
  figure { margin:0 0 16px; min-width:0; }
  .image-link { display:flex; justify-content:center; align-items:center; min-height:80px; border:1px solid #dce2e8; border-radius:6px; background:#f7f8fa; padding:6px; }
  .image-link img { display:block; max-width:100%; width:auto; height:auto; max-height:85vh; object-fit:contain; }
  figcaption { display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; font-size:.82rem; margin-top:6px; color:#586775; overflow-wrap:anywhere; }
  .empty { border:1px dashed #bdcbd7; padding:18px; border-radius:6px; color:#586775; }
  .evidence section + section { margin-top:18px; }
  pre { font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; margin:0; background:#f4f6f8; border:1px solid #e0e6eb; border-radius:6px; padding:12px; max-height:60vh; overflow-y:auto; }
  .items { max-height:290px; overflow-y:auto; padding:2px; }
  .item-button { display:block; text-align:left; width:100%; border:1px solid #dce2e8; background:#fff; padding:9px 10px; border-radius:5px; margin:0 0 6px; overflow-wrap:anywhere; }
  .item-button[aria-pressed=true] { border-color:#1479ba; background:#eaf4fc; }
  .item-button small { display:block; color:#586775; font-size:.75rem; white-space:pre-wrap; margin-top:4px; }
  .selected-item { margin-top:12px; }
  .selected-item pre { max-height:260px; margin-bottom:12px; }
  .links { display:flex; flex-wrap:wrap; gap:8px 16px; }
  ul { margin:8px 0 0; padding-left:20px; }
  li { margin:6px 0; overflow-wrap:anywhere; }
  footer { max-width:1640px; margin:auto; padding:0 20px 24px; color:#586775; font-size:.8rem; }
  @media(min-width:1450px) { .columns { grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr); } }
  @media(max-width:1050px) { .columns { grid-template-columns:minmax(0,1fr); } .image-link img { max-height:none; } }
  @media(max-width:680px) { header { padding:20px 16px; } .shell { grid-template-columns:minmax(0,1fr); gap:14px; padding:14px; } nav { position:sticky; top:0; z-index:2; padding:10px; } .stage-list,.nav-title { display:none; } .mobile-label { display:block; font-size:.8rem; font-weight:700; margin-bottom:5px; color:#586775; } #stage-select { display:block; width:100%; min-width:0; max-width:100%; font:inherit; padding:8px; border:1px solid #a6bbcb; border-radius:5px; background:#fff; color:inherit; } .panel { padding:14px; } .tags { gap:5px; } footer { padding:0 16px 20px; } }
</style>
<header>
  <h1 id="title">Docling 各階段檢視</h1>
  <p id="subtitle" class="muted">載入保存的實驗資料…</p>
  <div id="notices"></div>
</header>
<div class="shell">
  <nav aria-label="解析階段">
    <p class="nav-title">選擇階段</p>
    <label class="mobile-label" for="stage-select">選擇解析階段</label>
    <select id="stage-select" disabled aria-label="選擇解析階段"><option>載入中…</option></select>
    <div id="stage-list" class="stage-list"></div>
  </nav>
  <main id="main" aria-live="polite"><div class="panel empty">載入中…</div></main>
</div>
<footer>本機靜態證據檢視頁。圖片、文字與順序依保存資料呈現，不會執行模型、修字或重排段落。點圖片可開啟原尺寸檔案。</footer>
<script>
  'use strict';
  const $ = id => document.getElementById(id);
  const list = value => Array.isArray(value) ? value : [];
  const text = value => value == null ? '' : typeof value === 'string' ? value : JSON.stringify(value, null, 2);
  function el(tag, className, value) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = text(value);
    return node;
  }
  function localUrl(value) {
    if (typeof value !== 'string' || !value.trim()) return null;
    try {
      const url = new URL(value, location.href);
      const allowed = url.origin === location.origin && ['http:', 'https:', 'file:'].includes(url.protocol);
      return allowed ? url.href : null;
    } catch { return null; }
  }
  function picture(info) {
    const figure = el('figure');
    const url = localUrl(info && info.src);
    if (!url) { figure.append(el('div', 'empty', '未提供可用的本機圖片。')); return figure; }
    const anchor = el('a', 'image-link');
    anchor.href = url; anchor.target = '_blank'; anchor.rel = 'noopener';
    const img = el('img'); img.src = url; img.alt = text(info.alt || info.label || '保存的階段影像'); img.loading = 'lazy';
    img.addEventListener('error', () => { anchor.replaceWith(el('div', 'empty', '圖片無法載入：' + info.src)); });
    anchor.append(img); figure.append(anchor);
    const caption = el('figcaption');
    caption.append(el('span', '', info.label || info.alt || '保存的影像'));
    const original = el('a', '', '開啟原尺寸 ↗'); original.href = url; original.target = '_blank'; original.rel = 'noopener';
    caption.append(original); figure.append(caption);
    return figure;
  }
  function section(title) {
    const node = el('section'); node.append(el('h3', '', title)); return node;
  }
  function linkList(values) {
    const node = el('div', 'links');
    for (const info of list(values)) {
      const url = localUrl(info && info.href);
      if (!url) continue;
      const a = el('a', '', info.label || info.href); a.href = url; a.target = '_blank'; a.rel = 'noopener'; node.append(a);
    }
    return node;
  }
  function showStage(stage, index) {
    $('stage-select').value = String(index);
    for (const [i, button] of Array.from($('stage-list').children).entries()) {
      if (i === index) button.setAttribute('aria-current', 'step'); else button.removeAttribute('aria-current');
    }
    const main = $('main'); main.replaceChildren();
    const head = el('div', 'panel stage-head'); head.append(el('h2', '', `${index + 1}. ${stage.title || stage.id || '未命名階段'}`));
    const tags = el('div', 'tags');
    for (const value of [stage.kind, stage.status]) if (value) tags.append(el('span', 'tag', value));
    if (tags.childElementCount) head.append(tags);
    if (stage.summary) head.append(el('p', '', stage.summary));
    head.append(el('div', 'source', '證據來源：' + text(stage.source || '資料未標示，請參閱原始紀錄。')));
    main.append(head);
    const columns = el('div', 'columns');
    const visuals = el('div', 'panel visuals'); visuals.append(el('h3', '', '此階段的影像與框線'));
    const images = [...(stage.image ? [stage.image] : []), ...list(stage.images)];
    if (images.length) for (const info of images) visuals.append(picture(info));
    else visuals.append(el('div', 'empty', '此階段沒有保存圖片；右側／下方顯示保存文字與證據。'));
    const evidence = el('div', 'panel evidence');
    if (stage.text !== undefined && stage.text !== null) {
      const content = section('保存的文字／輸出'); content.append(el('pre', '', stage.text)); evidence.append(content);
    }
    const items = list(stage.items).filter(item => item && typeof item === 'object');
    if (items.length) {
      const content = section(`選擇項目（${items.length}）`);
      const buttons = el('div', 'items'); const selected = el('div', 'selected-item');
      function selectItem(item, index) {
        for (const [i, button] of Array.from(buttons.children).entries()) button.setAttribute('aria-pressed', String(i === index));
        selected.replaceChildren(el('h3', '', item.label || `項目 ${index + 1}`));
        if (item.text !== undefined) selected.append(el('pre', '', item.text));
        if (item.details !== undefined) selected.append(el('pre', '', item.details));
        if (item.image) selected.append(picture(item.image));
        for (const info of list(item.images)) selected.append(picture(info));
        if (item.text === undefined && item.details === undefined && !item.image && !list(item.images).length) selected.append(el('p', 'muted', '此項目沒有額外保存文字或裁圖。'));
      }
      items.forEach((item, i) => {
        const button = el('button', 'item-button', item.label || `項目 ${i + 1}`); button.type = 'button';
        const preview = text(item.text);
        if (preview) button.append(el('small', '', preview.length > 100 ? preview.slice(0, 100) + '…' : preview));
        button.addEventListener('click', () => selectItem(item, i)); buttons.append(button);
      });
      content.append(buttons, selected); evidence.append(content); selectItem(items[0], 0);
    }
    if (list(stage.notes).length) {
      const content = section('如何解讀'); const notes = el('ul');
      for (const note of stage.notes) notes.append(el('li', '', note)); content.append(notes); evidence.append(content);
    }
    if (list(stage.links).length) { const content = section('原始檔案'); content.append(linkList(stage.links)); evidence.append(content); }
    if (!evidence.childElementCount) evidence.append(el('p', 'muted', '此階段沒有額外保存文字。'));
    columns.append(visuals, evidence); main.append(columns);
    const hash = '#' + encodeURIComponent(stage.id || String(index));
    if (location.hash !== hash) history.replaceState(null, '', hash);
  }
  async function start() {
    try {
      const response = await fetch('./data.json', { cache:'no-store' });
      if (!response.ok) throw new Error(`data.json 回傳 HTTP ${response.status}`);
      const data = await response.json();
      const stages = list(data && data.stages).filter(stage => stage && typeof stage === 'object');
      if (!stages.length) throw new Error('data.json 沒有可呈現的 stages。');
      if (data.title) $('title').textContent = text(data.title);
      document.title = text(data.title || 'Docling 各階段檢視');
      $('subtitle').textContent = text(data.subtitle || '依序查看同一個 testcase 的保存證據；原始模型輸出與自訂顯示會分別標示。');
      for (const notice of list(data.notices)) $('notices').append(el('div', 'notice', notice));
      $('stage-select').replaceChildren();
      stages.forEach((stage, i) => {
        const button = el('button', 'stage-button', `${i + 1}. ${stage.title || stage.id || '未命名階段'}`); button.type = 'button';
        if (stage.status) button.append(el('small', '', stage.status));
        button.addEventListener('click', () => showStage(stage, i)); $('stage-list').append(button);
        const option = el('option', '', `${i + 1}. ${stage.title || stage.id || '未命名階段'}`); option.value = String(i); $('stage-select').append(option);
      });
      $('stage-select').disabled = false;
      $('stage-select').addEventListener('change', event => { const i = Number(event.target.value); if (stages[i]) showStage(stages[i], i); });
      let requested = ''; try { requested = decodeURIComponent(location.hash.slice(1)); } catch { /* malformed fragment uses the first stage */ }
      const index = stages.findIndex((stage, i) => (stage.id || String(i)) === requested);
      showStage(stages[index < 0 ? 0 : index], index < 0 ? 0 : index);
    } catch (error) {
      $('subtitle').textContent = '資料未能載入；沒有執行任何模型。';
      const box = el('div', 'panel'); box.append(el('h2', '', '無法顯示保存證據'), el('p', '', error.message), el('p', 'muted', '請透過本機 HTTP 頁面開啟，並確認同目錄有 data.json。'));
      $('main').replaceChildren(box);
    }
  }
  start();
</script>
</html>
