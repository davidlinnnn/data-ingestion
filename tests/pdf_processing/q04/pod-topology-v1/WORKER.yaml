      "data": {
        "worker.py": "\"\"\"Qualification-only multi-queue host for unchanged production Activities.\n\nEach queue has one immutable profile. A single WarmParser is shared serially,\nallowing the six fixed inputs to exercise the same child lifetime. Never deploy\nthis harness as the production worker package.\n\"\"\"\nimport argparse\nimport asyncio\nfrom contextlib import AsyncExitStack\nfrom datetime import timedelta\nimport json\nimport os\nfrom pathlib import Path\nimport signal\nimport sys\nimport time\n\nfrom consumer import require, sha\nfrom telemetry import sample\n\n\nasync def cleanup_owned_work(parser, scratch):\n    \"\"\"Remove scratch only after every owned process has confirmed exit.\"\"\"\n    from pdf_processing.execution import stop_owned_children\n    await stop_owned_children(parser)\n    import shutil\n    shutil.rmtree(scratch, ignore_errors=True)\n\n\nasync def run(config_path, out, generation):\n    import psutil\n    import boto3\n    from temporalio.client import Client\n    from temporalio.worker import Worker\n    from pdf_processing.object_store import Store\n    from pdf_processing.processing import Processing\n    from pdf_processing.supervision import WarmParser\n\n    config = json.loads(config_path.read_text())\n    import pdf_processing\n    actual = {p.name: sha(p.read_bytes()) for p in Path(pdf_processing.__file__).parent.glob('*.py')}\n    require(actual == config['producer'], 'worker producer drift')\n    out.mkdir(parents=True, exist_ok=False)\n    identity = {'pid': os.getpid(), 'created': psutil.Process().create_time(), 'generation': generation, 'config_sha256': sha(config_path.read_bytes())}\n    (out/'ownership.json').write_text(json.dumps(identity))\n    stop = asyncio.Event()\n    loop = asyncio.get_running_loop()\n    for sig in (signal.SIGINT, signal.SIGTERM):\n        loop.add_signal_handler(sig, stop.set)\n    client = await Client.connect(config['temporal'])\n    s3 = boto3.client('s3', endpoint_url=config['endpoint'])\n    store = Store(s3, config['bucket'], config['prefix'])\n    parser = WarmParser(**config['parser_budgets'])\n    scratch = (Path('/scratch')/config['run_id']/str(generation)) if config.get('pod_namespace') else out/'scratch'\n    workers = []\n    sampler_error = []\n\n    async def observe():\n        try:\n            with (out/'samples.jsonl').open('x', buffering=1) as stream:\n                while not stop.is_set():\n                    if (out/'stop-sampling').exists():\n                        return\n                    row = sample()\n                    row.update(worker_pid=os.getpid(), generation=generation,\n                        parser=dict(parser.observation), parser_count=parser.count)\n                    stream.write(json.dumps(row)+'\\n')\n                    await asyncio.sleep(.5)\n                stream.write(json.dumps({**sample(), 'worker_pid': os.getpid(), 'generation': generation, 'parser': dict(parser.observation), 'parser_count': parser.count})+'\\n')\n        except BaseException as error:\n            sampler_error.append(type(error).__name__)\n            stop.set()\n\n    sampler = asyncio.create_task(observe())\n    try:\n        async with AsyncExitStack() as stack:\n            for key, profile in config['profiles'].items():\n                processing = Processing(store, scratch/key, config['model_cache'], profile,\n                    config['limits'], child_runner=parser)\n                worker = Worker(client, task_queue=config['queues'][key], activities=[processing.run],\n                    max_concurrent_activities=1, graceful_shutdown_timeout=timedelta(seconds=config['drain_seconds']))\n                await stack.enter_async_context(worker)\n                workers.append(worker)\n            (out/'ready.tmp').write_text(json.dumps({**identity, 'time': time.time()}))\n            (out/'ready.tmp').replace(out/'ready.json')\n            await stop.wait()\n    finally:\n        stop.set()\n        cleanup_error = None\n        try:\n            await cleanup_owned_work(parser, scratch)\n        except BaseException as error:\n            cleanup_error = error\n        await asyncio.gather(sampler, return_exceptions=True)\n        (out/'stopped.json').write_text(json.dumps({'pid': os.getpid(), 'time': time.time(),\n            'generation': generation, 'parser_absent': parser.process is None,\n            'scratch_absent': not scratch.exists(), 'sampler_errors': sampler_error}))\n        if cleanup_error is not None:\n            raise cleanup_error\n    require(not sampler_error, 'sampler failed')\n\n\nif __name__ == '__main__':\n    cli = argparse.ArgumentParser(description=__doc__)\n    cli.add_argument('--config', type=Path, required=True)\n    cli.add_argument('--out', type=Path, required=True)\n    cli.add_argument('--generation', type=int, required=True)\n    args = cli.parse_args()\n    # The coordinator is the authority for runtime admission. Worker requires its\n    # exact config plus a live, externally approved window and an owned queue set.\n    config = json.loads(args.config.read_text())\n    require(config['window']['starts_at'] <= time.time() < config['window']['ends_at'], 'outside capacity window')\n    try:\n        asyncio.run(asyncio.wait_for(run(args.config, args.out, args.generation),\n            timeout=config['window']['ends_at']-time.time()))\n    except BaseException:\n        import traceback\n        traceback.print_exc()\n        sys.exit(1)\n",
        "consumer.py": "\"\"\"Independent Q04 consumer checks over checked durable outputs, never production rules.\"\"\"\nfrom collections import Counter\nfrom io import BytesIO\nimport copy\nimport hashlib\nimport json\nfrom pathlib import Path\nimport sys\nfrom typing import Any\n\nROOT = Path(__file__).resolve().parents[3]\n\n\ndef require(ok, reason):\n    if not ok:\n        raise ValueError(reason)\n\n\ndef sha(raw):\n    return hashlib.sha256(raw).hexdigest()\n\n\ndef canonical(value):\n    return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False)\n\n\ndef ref(value):\n    return value.get('$ref', value.get('cref'))\n\n\ndef references(value):\n    if isinstance(value, dict):\n        if '$ref' in value or 'cref' in value:\n            yield ref(value)\n        for child in value.values():\n            yield from references(child)\n    elif isinstance(value, list):\n        for child in value:\n            yield from references(child)\n\n\ndef check_graph(document, report):\n    \"\"\"Account for every collection, source region and graph edge, not only body text.\"\"\"\n    nodes = [document[k] for k in ('body', 'furniture') if document.get(k)]\n    for key in ('groups', 'texts', 'pictures', 'tables', 'key_value_items', 'form_items'):\n        nodes.extend(document.get(key, []))\n    index = {n['self_ref']: n for n in nodes}\n    records = {n['ref']: n for n in report['items']}\n    require(len(index) == len(nodes), 'duplicate document ref')\n    require(len(records) == len(report['items']) and records.keys() == index.keys(), 'incomplete typed graph')\n    require(all(r in index for r in references(nodes)), 'dangling graph edge')\n    visiting, visited = set(), set()\n\n    def visit(key):\n        require(key not in visiting, 'cyclic children')\n        if key in visited:\n            return\n        visiting.add(key)\n        children = [ref(x) for x in index[key].get('children', [])]\n        require(len(children) == len(set(children)), 'duplicate child')\n        for child in children:\n            require(ref(index[child].get('parent', {})) == key, 'child parent mismatch')\n            visit(child)\n        visiting.remove(key)\n        visited.add(key)\n\n    for key, node in index.items():\n        visit(key)\n        item = records[key]\n        require(item['actual_type'] == node.get('label', 'group') and item['text'] == node.get('text'), 'typed content changed')\n        require(item['collection'] == key.split('/')[1], 'wrong collection')\n        require(ref(item.get('parent') or {}) == ref(node.get('parent') or {}), 'parent lost')\n        for field in ('children', 'captions'):\n            require([ref(x) for x in item.get(field, [])] == [ref(x) for x in node.get(field, [])], field + ' lost')\n        require([r['provenance'] for r in item['regions']] == node.get('prov', []), 'provenance changed')\n        for region in item['regions']:\n            page = report['pages'][str(region['page'])]\n            require(region['page'] == region['provenance']['page_no'], 'wrong source page')\n            require(region['page_artifact'] == page['artifact'] and region['page_sha256'] == page['sha256'], 'source region binding')\n            box = region['provenance']['bbox']\n            height = page['size_points'][1]\n            expected = [box['l'], box['t'], box['r'], box['b']] if box['coord_origin'] == 'TOPLEFT' else [box['l'], height-box['t'], box['r'], height-box['b']]\n            require(region['bbox_top_left_points'] == expected, 'source geometry changed')\n    for table in document.get('tables', []):\n        data = table['data']\n        occupied = set()\n        for cell in data['table_cells']:\n            r, c = cell['start_row_offset_idx'], cell['start_col_offset_idx']\n            end_r, end_c = cell['end_row_offset_idx'], cell['end_col_offset_idx']\n            require(0 <= r < end_r <= data['num_rows'] and 0 <= c < end_c <= data['num_cols'], 'table cell bounds')\n            require(end_r-r == cell['row_span'] and end_c-c == cell['col_span'], 'table cell span')\n            cells = {(row, col) for row in range(r, end_r) for col in range(c, end_c)}\n            require(not occupied.intersection(cells), 'overlapping table cells')\n            occupied.update(cells)\n    return {'items': len(nodes), 'tables': len(document.get('tables', [])),\n            'pictures': len(document.get('pictures', [])), 'types': dict(Counter(r['actual_type'] for r in records.values()))}\n\n\ndef source_signature(document):\n    \"\"\"Ref-independent, lossless multiset for discovering collateral changes; no normalization.\"\"\"\n    parts = []\n    for collection in ('texts', 'pictures', 'tables', 'groups'):\n        for node in document.get(collection, []):\n            for prov in node.get('prov', []):\n                text = node.get('text')\n                if text is not None:\n                    text = text[slice(*prov['charspan'])]\n                parts.append(canonical([collection, node.get('label'), prov['page_no'], prov['bbox'], text]))\n    return Counter(parts)\n\n\ndef graph_projection(document):\n    def clean(value) -> Any:\n        if isinstance(value, dict):\n            return {('$ref' if k == 'cref' else k): clean(v) for k, v in value.items() if v is not None}\n        if isinstance(value, list):\n            return [clean(v) for v in value]\n        return value\n    return clean({k: document.get(k, [] if k not in ('body', 'furniture', 'pages') else {})\n        for k in ('body', 'furniture', 'groups', 'texts', 'pictures', 'tables', 'key_value_items', 'form_items', 'pages')})\n\n\ndef check_reference(document, reference, out):\n    before, after = graph_projection(reference), graph_projection(document)\n    if before != after:\n        old, new = source_signature(reference), source_signature(document)\n        (out/'graph-delta.json').write_text(json.dumps({'status': 'SOURCE_REVIEW_REQUIRED',\n            'expected_graph_sha256': sha(canonical(before).encode()), 'actual_graph_sha256': sha(canonical(after).encode()),\n            'removed_source_segments': list((old-new).elements()), 'added_source_segments': list((new-old).elements()),\n            'changed_collections': [k for k in before if before[k] != after[k]]}, indent=2))\n        raise ValueError('unreviewed full graph delta; retain output and source-review before acceptance')\n    return sha(canonical(after).encode())\n\n\ndef check_fixture(sid, document, report, relationship_report, policy, oracles):\n    checks = check_graph(document, report)\n    norm = lambda text: ' '.join(text.split())\n    typed = {n['ref']: n for n in report['items']}\n    if sid in ('06', '07'):\n        expected = json.loads((oracles/(sid+'-table-full-audit.json')).read_text())\n        tables = [t for t in document['tables'] if t['data']['num_rows'] == (26 if sid == '06' else 15)]\n        require(len(tables) == 1, 'ambiguous source-audited table')\n        cells = {(c['start_row_offset_idx'], c['start_col_offset_idx']): c for c in tables[0]['data']['table_cells']}\n        require(set(cells) == {(e['row'], e['col']) for e in expected}, 'table audit coverage')\n        for entry in expected:\n            cell = cells[entry['row'], entry['col']]\n            source = entry['parsed_text'] if sid == '07' and '\\x02' in entry['source_text'] else entry['source_text']\n            require(norm(cell['text']) == norm(source) and cell['row_span'] == entry['rowspan'], 'source-audited cell changed')\n        checks['audited_cells'] = len(expected)\n    elif sid == '08':\n        sys.path.insert(0, str(ROOT/'tests/pdf_processing/q02'))\n        from oracle.score import score\n        candidate = copy.deepcopy(relationship_report['candidates'])\n        candidate['relationships'] = [{**r, 'disposition': 'candidate'} for r in relationship_report['resolved']]\n        verdicts = score(document, candidate)\n        require(len(verdicts) == 4 and all(v['structure_pass'] for v in verdicts), 'four algorithm oracle')\n        # Exact source-reviewed Q01 element segments identify the accepted edges,\n        # independently of new Docling item numbering.\n        expected = json.loads((oracles/'continuation-oracle.json').read_text())\n        memberships = {}\n        for name, anchor in expected['anchors'].items():\n            box = anchor['bbox']\n            matches = []\n            for item in document['texts']:\n                for prov in item['prov']:\n                    b = dict(prov['bbox'])\n                    if b['coord_origin'] != box['coord_origin']:\n                        height = document['pages'][str(prov['page_no'])]['size']['height']\n                        b.update(t=height-b['t'], b=height-b['b'], coord_origin=box['coord_origin'])\n                    if (prov['page_no'] == anchor['page']\n                            and b['l']-.01 <= box['l'] <= box['r'] <= b['r']+.01\n                            and min(b['t'], b['b'])-.01 <= min(box['t'], box['b'])\n                            and max(box['t'], box['b']) <= max(b['t'], b['b'])+.01\n                            and anchor['text'] in item['text'][slice(*prov['charspan'])]):\n                        matches.append(item['self_ref'])\n            require(len(set(matches)) == 1, 'Q01 source anchor absent or ambiguous')\n            memberships[name] = matches[0]\n        for edge in expected['edges']:\n            a, b = edge['members']\n            require((memberships[a] == memberships[b]) is edge['joined'], 'Q01 source-reviewed continuation edge')\n        require(len(relationship_report['resolved']) == 4 and not relationship_report['unresolved'], 'required relationships incomplete')\n        require(policy['representation'] == json.loads((ROOT/'tests/pdf_processing/q03/reviewed-representation.json').read_text()), 'representation disposition drift')\n        checks.update(algorithms=4, continuation_edges=len(expected['edges']))\n    elif sid == '09':\n        equations = [x for x in report['formula_occurrences'] if x.get('review_id', '').startswith('eq')]\n        require(len(equations) == 6 and {x['review_id'] for x in equations} == {f'eq{i}' for i in range(1, 7)}, 'six ACL equations')\n        require(any(typed[r]['actual_type'] == 'text' for e in equations if e['review_id'] == 'eq2' for r in e['refs']), 'eq2 actual type')\n        require(bool(report['representation_observations']), 'ACL uncertainty evidence')\n        expected = json.loads((oracles/'quality-oracle.json').read_text())\n        for page in [p for p in expected['pages'] if p['source_id'] == '09']:\n            actual = [n for n in report['items'] if any(r['page'] == page['processed_page'] for r in n['regions'])]\n            require(len(actual) == len(page['items']), 'ACL full typed coverage')\n            for node, old in zip(actual, page['items']):\n                h = lambda text: sha(json.dumps(text, ensure_ascii=False).encode())\n                require(node['actual_type'] == old['type'] and h(node['text']) == old['text_sha256'], 'ACL typed text')\n                require([h(typed[ref(c)]['text']) for c in node['captions']] == old['caption_text_hashes'], 'ACL real captions')\n        checks['equations'] = 6\n    elif sid == '10':\n        expected = next(x['regions'] for x in json.loads((oracles/'new-source-oracle.json').read_text()) if x['source_id'] == '10')\n        require(len(expected) == 27, 'Keynote oracle coverage')\n        for region in expected:\n            l, t, r, b = region['bbox']\n            pieces = []\n            for node in report['items']:\n                if not node.get('text'):\n                    continue\n                for geometry in node['regions']:\n                    x1, y1, x2, y2 = geometry['bbox_top_left_points']\n                    if geometry['page'] == 1 and l <= (x1+x2)/2 <= r and t <= (y1+y2)/2 <= b:\n                        pieces.append((y1, x1, node['text']))\n                        break\n            require(norm(region['expected_text']) == norm(' '.join(x[2] for x in sorted(pieces))), 'Keynote textbox')\n        checks['textboxes'] = 27\n    else:\n        require(sid == 'native', 'unsupported fixture')\n    return checks\n\n\nclass Consumer:\n    \"\"\"Read and audit the complete result through the same checked Store as consumers.\"\"\"\n    def __init__(self, store, out):\n        self.store, self.out = store, out\n        self.inventory = {}\n\n    def artifact(self, identity, name):\n        registration = self.store.resolve(identity)\n        require(registration is not None, 'required registration missing')\n        self.inventory[identity] = registration\n        files = [f for f in registration['files'] if f['name'] == name]\n        require(len(files) == 1, 'required artifact missing')\n        return self.store.read_artifact(files[0])\n\n    def json(self, identity, name):\n        return json.loads(self.artifact(identity, name))\n\n    def verify(self, result, request, profile, fixture, oracles):\n        from pdf_processing.relationships import validate\n        from PIL import Image\n        require(result['status'] == 'complete' and result['processing_complete'], 'workflow incomplete')\n        final = self.json(result['processing_result'], 'processing-result.json')\n        require(final['processing_complete'] and final['quality_accepted'] is False and final['canonical_accepted'] is False, 'invalid completion claim')\n        require(final['source'] == request, 'final source attribution')\n        plan = self.json(final['plan'], 'plan.json')\n        require(plan['request'] == request and plan['profile'] == profile, 'accepted plan changed')\n        producer = {p.name: sha(p.read_bytes()) for p in (ROOT/'src/pdf_processing').glob('*.py')}\n        require(plan['producer'] == producer and final['provenance'] == {'profile': profile, 'producer': producer}, 'producer attribution')\n        parsed = self.json(final['parsed_result'], 'parsed-result.json')\n        require(parsed['plan'] == final['plan'] and parsed['source'] == request and parsed['assembly'] == final['assembly'], 'parsed-result attribution')\n        require(len(parsed['page_groups']) == len(plan['groups']), 'checkpoint group count')\n        for group, (start, end) in zip(parsed['page_groups'], plan['groups']):\n            checkpoint = self.json(group, 'complete.json')\n            require(checkpoint['source_sha256'] == fixture['sha256'], 'checkpoint source attribution')\n            numbers = [self.json(group, 'checkpoints/'+entry['file'])['page_no'] for entry in checkpoint['pages']]\n            require(numbers == list(range(start, end+1)), 'checkpoint page coverage')\n        raw = self.artifact(final['assembly'], 'document.json')\n        document = json.loads(raw)\n        evidence = self.json(final['content_evidence'], 'content-evidence.json')\n        require(evidence['source'] == request and evidence['assembly'] == final['assembly'] and evidence['parsed_result'] == final['parsed_result'] and evidence['document_sha256'] == sha(raw), 'content attribution')\n        require(sha(self.artifact(final['content_evidence'], 'source.pdf')) == fixture['sha256'], 'source changed')\n        require(sha(self.artifact(final['content_evidence'], 'original-source.pdf')) == fixture['original_sha256'], 'original source changed')\n        require(set(evidence['pages']) == set(document['pages']) == {str(i+1) for i in range(len(fixture['original_pages']))}, 'page coverage')\n        for key, page in evidence['pages'].items():\n            require(page['physical_page'] == int(key) and page['original_physical_page'] == fixture['original_pages'][int(key)-1], 'original page mapping')\n            page_bytes = self.artifact(final['content_evidence'], page['artifact'])\n            require(sha(page_bytes) == page['sha256'], 'unreadable page evidence')\n            with Image.open(BytesIO(page_bytes)) as image:\n                require(list(image.size) == page['pixel_dimensions'], 'page image dimensions')\n                image.verify()\n        binding = self.json(final['relationships'], 'relationships.json')\n        require(binding['content_evidence'] == final['content_evidence'], 'relationship evidence binding')\n        relations = binding['relationships']\n        validate(relations, document, request, final['parsed_result'], final['assembly'], profile['content_evidence']['relationships'])\n        selection = self.json(final['selection'], 'selection.json')\n        require(selection['plan'] == final['plan'] and selection['source'] == request and selection['assembly'] == final['assembly'] and selection['parsed_result'] == final['parsed_result'], 'selection attribution')\n        require(final['required_work'] == {'pages': len(fixture['original_pages']), 'components': len(final['enrichments']), 'ocr': 'complete' if final['enrichments'] else 'not_applicable', 'relationships': 'finished'}, 'required-work completion contract')\n        pictures = sorted(n['self_ref'] for n in document['pictures'])\n        require(sorted(selection['selected']) == pictures == sorted(e['component'] for e in final['enrichments']), 'missing required OCR')\n        for entry in final['enrichments']:\n            ocr = self.json(entry['operation'], 'ocr.json')\n            require(ocr['component'] == entry['component'] and ocr['source'] == request\n                and ocr['selection'] == final['selection'] and ocr['parsed_result'] == final['parsed_result']\n                and ocr['method'] == selection['ocr_method']\n                and ocr['outcome'] == entry['outcome'] and ocr['outcome'] in ('text_detected', 'no_text_detected'), 'OCR component attribution')\n            crop = self.artifact(entry['operation'], 'figure.png')\n            require(sha(crop) == ocr['crop_sha256'], 'OCR crop attribution')\n            with Image.open(BytesIO(crop)) as image:\n                image.verify()\n        for step in result['steps']:\n            registration = self.store.resolve(step['operation'])\n            require(registration is not None, 'missing intermediate work')\n            self.inventory[step['operation']] = registration\n        self.out.mkdir(exist_ok=True)\n        (self.out/'document.json').write_bytes(raw)\n        reference = json.loads((oracles.parent/'references'/(fixture['id']+'.json')).read_text())\n        graph_sha = check_reference(document, reference, self.out)\n        checks = check_fixture(fixture['id'], document, evidence, relations, profile['content_evidence']['relationships'], oracles)\n        self.out.mkdir(exist_ok=True)\n        (self.out/'document.json').write_bytes(raw)\n        checks['full_reference_graph_sha256'] = graph_sha\n        for name, value in [('content-evidence', evidence), ('relationships', binding), ('registrations', self.inventory), ('checks', checks)]:\n            (self.out/(name+'.json')).write_text(json.dumps(value, indent=2))\n        return {'final': final, 'document_sha256': sha(raw), 'checks': checks}\n",
        "telemetry.py": "\"\"\"Linux VM/cgroup observation and fail-closed guards; no inferred sizing limits.\"\"\"\nimport json\nfrom pathlib import Path\nimport time\n\nfrom consumer import require\n\n\ndef sample(proc=Path('/proc'), cgroup=Path('/sys/fs/cgroup')):\n    def fields(path):\n        return {line.split()[0].rstrip(':'): int(line.split()[1]) for line in path.read_text().splitlines()}\n    pressure = (proc/'pressure/memory').read_text()\n    full = next(line for line in pressure.splitlines() if line.startswith('full '))\n    return {'time': time.time(), 'available': fields(proc/'meminfo')['MemAvailable']*1024,\n        'vm_oom_kill': fields(proc/'vmstat')['oom_kill'],\n        'memory_current': int((cgroup/'memory.current').read_text()),\n        'memory_events': fields(cgroup/'memory.events'),\n        'psi_full_avg10': float(dict(v.split('=') for v in full.split()[1:])['avg10'])}\n\n\ndef check_sample(row, initial, limits):\n    if 'expected_vm_oom_kill' in limits:\n        require(initial['vm_oom_kill'] == limits['expected_vm_oom_kill'], 'VM OOM baseline changed')\n    if 'expected_cgroup_oom_kill' in limits:\n        require(initial['memory_events'].get('oom_kill', 0) == limits['expected_cgroup_oom_kill'], 'cgroup OOM baseline changed')\n    require(row['available'] >= limits['min_available_bytes'], 'VM memory pressure')\n    require(row['psi_full_avg10'] <= limits['max_full_psi'], 'VM PSI pressure')\n    require(row['vm_oom_kill'] == initial['vm_oom_kill'], 'new VM OOM')\n    require(row['memory_events'].get('oom_kill', 0) == initial['memory_events'].get('oom_kill', 0), 'new cgroup OOM')\n    require(row['memory_current'] <= limits['max_cgroup_bytes'], 'cgroup budget exceeded')\n\n\ndef check_coverage(rows, started, finished, maximum_gap):\n    require(len(rows) >= 2 and rows[0]['time'] <= started and rows[-1]['time'] >= finished, 'incomplete resource coverage')\n    gaps = [b['time']-a['time'] for a, b in zip(rows, rows[1:])]\n    require(all(0 < gap <= maximum_gap for gap in gaps), 'resource telemetry gap')\n    return {'samples': len(rows), 'max_gap': max(gaps),\n        'min_available_bytes': min(r['available'] for r in rows),\n        'max_cgroup_bytes': max(r['memory_current'] for r in rows)}\n\n\ndef read_rows(path):\n    return [json.loads(line) for line in path.read_text().splitlines(keepends=True) if line.endswith('\\n')]\n",
        "acl_resource_telemetry.py": "\"\"\"Qualification-only cgroup and owned-process attribution telemetry.\n\nThe existing Q04 worker telemetry remains the fail-closed resource guard. This\nmodule records auxiliary attribution evidence and never converts a missing PSS or\noptional cgroup field into a memory-limit violation.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport threading\nimport time\nfrom typing import Callable\n\n\nMEMORY_STAT_FIELDS = (\n    \"anon\",\n    \"file\",\n    \"shmem\",\n    \"file_mapped\",\n    \"inactive_file\",\n    \"slab\",\n    \"kernel\",\n)\n\n\ndef _fields(text: str, *, kib: bool = False) -> dict[str, int]:\n    result = {}\n    for line in text.splitlines():\n        parts = line.rstrip(\":\").split()\n        if len(parts) < 2:\n            continue\n        try:\n            value = int(parts[1])\n        except ValueError:\n            continue\n        result[parts[0].rstrip(\":\")] = value * 1024 if kib else value\n    return result\n\n\ndef _proc_stat(text: str) -> dict[str, int | str]:\n    closing = text.rfind(\")\")\n    if closing < 0:\n        raise ValueError(\"process stat has no closing comm delimiter\")\n    fields = text[closing + 1 :].split()\n    if len(fields) <= 19:\n        raise ValueError(\"process stat is incomplete\")\n    return {\n        \"state\": fields[0],\n        \"ppid\": int(fields[1]),\n        \"minor_faults\": int(fields[7]),\n        \"major_faults\": int(fields[9]),\n        \"user_cpu_ticks\": int(fields[11]),\n        \"system_cpu_ticks\": int(fields[12]),\n        \"start_ticks\": int(fields[19]),\n    }\n\n\ndef cgroup_identity(\n    proc_root: Path = Path(\"/proc\"),\n    cgroup_root: Path = Path(\"/sys/fs/cgroup\"),\n    *,\n    read_text: Callable[[Path], str] | None = None,\n) -> dict:\n    \"\"\"Resolve the cgroup-v2 observation directory without changing counters.\"\"\"\n    reader = read_text or (lambda path: path.read_text())\n    lines = reader(proc_root / \"self/cgroup\").splitlines()\n    unified = [line for line in lines if line.startswith(\"0::\")]\n    if len(unified) != 1:\n        raise ValueError(\"exactly one unified cgroup membership is required\")\n    unified_path = unified[0].split(\"::\", 1)[1]\n    mount_rows = [\n        line\n        for line in reader(proc_root / \"self/mountinfo\").splitlines()\n        if \" - cgroup2 \" in line\n    ]\n    if len(mount_rows) != 1:\n        raise ValueError(\"exactly one cgroup-v2 mount is required\")\n    before = mount_rows[0].split(\" - \", 1)[0].split()\n    if len(before) < 5:\n        raise ValueError(\"cgroup-v2 mountinfo is incomplete\")\n    identity = cgroup_root.stat()\n    return {\n        \"proc_cgroup\": unified[0],\n        \"unified_path\": unified_path,\n        \"mount_root\": before[3],\n        \"mount_point\": before[4],\n        \"observed_directory\": str(cgroup_root),\n        \"device\": identity.st_dev,\n        \"inode\": identity.st_ino,\n    }\n\n\ndef _read_optional_text(\n    path: Path,\n    issues: list[dict],\n    reader: Callable[[Path], str],\n) -> str | None:\n    try:\n        return reader(path)\n    except (FileNotFoundError, PermissionError, ProcessLookupError) as error:\n        issues.append(\n            {\"field\": path.name, \"reason\": type(error).__name__, \"optional\": True}\n        )\n        return None\n\n\ndef _command_class(payload: bytes) -> str:\n    text = payload.replace(b\"\\0\", b\" \").decode(errors=\"replace\")\n    if \"acl_fresh_measure.py\" in text:\n        return \"controller\"\n    if \"q04/worker.py\" in text or text.rstrip().endswith(\"worker.py\"):\n        return \"worker\"\n    if \"pdf_processing.warm_child\" in text:\n        return \"parser\"\n    return \"owned_descendant\"\n\n\ndef _collect_process(\n    pid: int,\n    proc_root: Path,\n    initial: dict[str, int | str],\n    *,\n    read_text: Callable[[Path], str],\n    read_bytes: Callable[[Path], bytes],\n) -> dict:\n    root = proc_root / str(pid)\n    issues: list[dict] = []\n    try:\n        current = _proc_stat(read_text(root / \"stat\"))\n    except (FileNotFoundError, PermissionError, ProcessLookupError):\n        return {\n            \"pid\": pid,\n            \"ppid\": initial[\"ppid\"],\n            \"start_ticks\": initial[\"start_ticks\"],\n            \"status\": \"exited_during_sample\",\n            \"attribution_complete\": False,\n        }\n    if current[\"start_ticks\"] != initial[\"start_ticks\"]:\n        return {\n            \"pid\": pid,\n            \"ppid\": current[\"ppid\"],\n            \"start_ticks\": current[\"start_ticks\"],\n            \"status\": \"identity_changed_during_sample\",\n            \"attribution_complete\": False,\n        }\n\n    try:\n        command = read_bytes(root / \"cmdline\")\n        command_sha256 = hashlib.sha256(command).hexdigest()\n        command_class = _command_class(command)\n    except (FileNotFoundError, PermissionError, ProcessLookupError) as error:\n        issues.append(\n            {\"field\": \"cmdline\", \"reason\": type(error).__name__, \"optional\": True}\n        )\n        command_sha256 = None\n        command_class = \"unknown_owned\"\n\n    status_text = _read_optional_text(root / \"status\", issues, read_text)\n    smaps_text = _read_optional_text(root / \"smaps_rollup\", issues, read_text)\n    status = _fields(status_text or \"\", kib=True)\n    smaps = _fields(smaps_text or \"\", kib=True)\n    pss = smaps.get(\"Pss\")\n    requested = {\n        \"Rss\": smaps.get(\"Rss\"),\n        \"Pss\": pss,\n        \"RssAnon\": status.get(\"RssAnon\"),\n        \"RssFile\": status.get(\"RssFile\"),\n        \"RssShmem\": status.get(\"RssShmem\"),\n    }\n    for name, value in requested.items():\n        if value is None:\n            issues.append({\"field\": name, \"reason\": \"missing\", \"optional\": True})\n    return {\n        \"pid\": pid,\n        \"ppid\": current[\"ppid\"],\n        \"start_ticks\": current[\"start_ticks\"],\n        \"state\": current[\"state\"],\n        \"status\": \"ok\",\n        \"command_class\": command_class,\n        \"command_sha256\": command_sha256,\n        \"rss_bytes\": smaps.get(\"Rss\"),\n        \"pss_bytes\": pss,\n        \"rss_anon_bytes\": status.get(\"RssAnon\"),\n        \"rss_file_bytes\": status.get(\"RssFile\"),\n        \"rss_shmem_bytes\": status.get(\"RssShmem\"),\n        \"minor_faults\": current[\"minor_faults\"],\n        \"major_faults\": current[\"major_faults\"],\n        \"user_cpu_ticks\": current[\"user_cpu_ticks\"],\n        \"system_cpu_ticks\": current[\"system_cpu_ticks\"],\n        \"issues\": issues,\n        \"attribution_complete\": command_sha256 is not None\n        and all(value is not None for value in requested.values()),\n    }\n\n\ndef _owned_identities(\n    proc_root: Path,\n    root_pid: int,\n    read_text: Callable[[Path], str],\n) -> dict[int, dict[str, int | str]]:\n    identities = {}\n    for path in proc_root.iterdir():\n        if not path.name.isdigit():\n            continue\n        try:\n            identities[int(path.name)] = _proc_stat(read_text(path / \"stat\"))\n        except (FileNotFoundError, PermissionError, ProcessLookupError, ValueError):\n            continue\n    if root_pid not in identities:\n        raise ProcessLookupError(\"collector root process identity disappeared\")\n\n    owned = {root_pid}\n    changed = True\n    while changed:\n        changed = False\n        for pid, identity in identities.items():\n            if pid not in owned and identity[\"ppid\"] in owned:\n                owned.add(pid)\n                changed = True\n    return {pid: identities[pid] for pid in sorted(owned)}\n\n\ndef attribution_sample(\n    *,\n    root_pid: int,\n    expected_cgroup: dict,\n    proc_root: Path = Path(\"/proc\"),\n    cgroup_root: Path = Path(\"/sys/fs/cgroup\"),\n    wall_time: Callable[[], float] = time.time,\n    monotonic: Callable[[], float] = time.monotonic,\n    read_text: Callable[[Path], str] | None = None,\n    read_bytes: Callable[[Path], bytes] | None = None,\n) -> dict:\n    \"\"\"Take one diagnostic sample; only cgroup identity/current/events are required.\"\"\"\n    started = monotonic()\n    text_reader = read_text or (lambda path: path.read_text())\n    bytes_reader = read_bytes or (lambda path: path.read_bytes())\n    actual_cgroup = cgroup_identity(\n        proc_root, cgroup_root, read_text=text_reader\n    )\n    if actual_cgroup != expected_cgroup:\n        raise ValueError(\"cgroup observation identity changed\")\n    memory_current = int(text_reader(cgroup_root / \"memory.current\").strip())\n    memory_events = _fields(text_reader(cgroup_root / \"memory.events\"))\n    if \"oom_kill\" not in memory_events:\n        raise ValueError(\"required cgroup OOM counter is missing\")\n\n    auxiliary_issues: list[dict] = []\n    stat_text = _read_optional_text(\n        cgroup_root / \"memory.stat\", auxiliary_issues, text_reader\n    )\n    peak_text = _read_optional_text(\n        cgroup_root / \"memory.peak\", auxiliary_issues, text_reader\n    )\n    memory_stat = _fields(stat_text or \"\")\n    memory_stat = {name: memory_stat.get(name) for name in MEMORY_STAT_FIELDS}\n    for name, value in memory_stat.items():\n        if value is None:\n            auxiliary_issues.append(\n                {\"field\": \"memory.stat:\" + name, \"reason\": \"missing\", \"optional\": True}\n            )\n    memory_peak = None\n    if peak_text is not None:\n        try:\n            memory_peak = int(peak_text.strip())\n        except ValueError:\n            auxiliary_issues.append(\n                {\"field\": \"memory.peak\", \"reason\": \"invalid\", \"optional\": True}\n            )\n\n    identities = _owned_identities(proc_root, root_pid, text_reader)\n    processes = [\n        _collect_process(\n            pid,\n            proc_root,\n            identity,\n            read_text=text_reader,\n            read_bytes=bytes_reader,\n        )\n        for pid, identity in identities.items()\n    ]\n    pss_values = [\n        row[\"pss_bytes\"]\n        for row in processes\n        if row.get(\"status\") == \"ok\" and row.get(\"pss_bytes\") is not None\n    ]\n    attribution_complete = not auxiliary_issues and all(\n        row.get(\"attribution_complete\") for row in processes\n    )\n    pss_total = sum(pss_values)\n    finished = monotonic()\n    return {\n        \"time\": wall_time(),\n        \"monotonic\": finished,\n        \"sample_duration_seconds\": finished - started,\n        \"cgroup\": actual_cgroup,\n        \"memory_current\": memory_current,\n        \"memory_events\": memory_events,\n        \"memory_stat\": memory_stat,\n        \"memory_peak\": memory_peak,\n        \"memory_peak_scope\": \"shared_cgroup_lifetime_high_water_mark\",\n        \"memory_peak_reset\": False,\n        \"owned_root_pid\": root_pid,\n        \"processes\": processes,\n        \"owned_pss_total_bytes\": pss_total,\n        \"cgroup_minus_owned_pss_bytes\": memory_current - pss_total,\n        \"residual_is_diagnostic_only\": True,\n        \"attribution_complete\": attribution_complete,\n        \"auxiliary_issues\": auxiliary_issues,\n    }\n\n\n@dataclass(frozen=True)\nclass CollectorOutcome:\n    samples: int\n    maximum_gap_seconds: float\n    attribution_complete: bool\n    errors: tuple[str, ...]\n\n\nclass ResourceCollector:\n    \"\"\"Deep module for periodic attribution evidence with bounded cleanup.\"\"\"\n\n    def __init__(\n        self,\n        output: Path,\n        summary: Path,\n        *,\n        root_pid: int | None = None,\n        interval_seconds: float = 0.25,\n        attribution_gap_seconds: float = 1.0,\n        shutdown_timeout_seconds: float = 2.0,\n        proc_root: Path = Path(\"/proc\"),\n        cgroup_root: Path = Path(\"/sys/fs/cgroup\"),\n        sampler=attribution_sample,\n    ):\n        if (\n            interval_seconds <= 0\n            or attribution_gap_seconds <= 0\n            or shutdown_timeout_seconds <= 0\n        ):\n            raise ValueError(\"collector intervals must be positive\")\n        self.output = output\n        self.summary = summary\n        self.root_pid = root_pid or os.getpid()\n        self.interval_seconds = interval_seconds\n        self.attribution_gap_seconds = attribution_gap_seconds\n        self.shutdown_timeout_seconds = shutdown_timeout_seconds\n        self.proc_root = proc_root\n        self.cgroup_root = cgroup_root\n        self.sampler = sampler\n        self.identity: dict | None = None\n        self._stop = threading.Event()\n        self._ready = threading.Event()\n        self._state_lock = threading.Lock()\n        self._thread: threading.Thread | None = None\n        self._stream = None\n        self._rows: list[dict] = []\n        self._errors: list[str] = []\n        self._pending_markers: list[str] = []\n        self._last_completed_monotonic: float | None = None\n\n    @property\n    def started(self) -> bool:\n        return self._stream is not None\n\n    def _capture(self, marker: str | None = None):\n        assert self.identity is not None and self._stream is not None\n        row = self.sampler(\n            root_pid=self.root_pid,\n            expected_cgroup=self.identity,\n            proc_root=self.proc_root,\n            cgroup_root=self.cgroup_root,\n        )\n        with self._state_lock:\n            markers = self._pending_markers\n            self._pending_markers = []\n        if marker is not None:\n            markers.insert(0, marker)\n        if markers:\n            row[\"marker\"] = markers[0]\n            if len(markers) > 1:\n                row[\"markers\"] = markers\n        payload = json.dumps(row, sort_keys=True, separators=(\",\", \":\")) + \"\\n\"\n        written = self._stream.write(payload)\n        if written is not None and written != len(payload):\n            raise OSError(\"short resource-attribution write\")\n        self._stream.flush()\n        completed = time.monotonic()\n        with self._state_lock:\n            if (\n                self._last_completed_monotonic is not None\n                and completed - self._last_completed_monotonic\n                > self.attribution_gap_seconds\n            ):\n                self._errors.append(\n                    \"resource attribution sample gap exceeded: \"\n                    + f\"{completed - self._last_completed_monotonic:.6f}s\"\n                )\n            self._rows.append(row)\n            self._last_completed_monotonic = completed\n\n    def _record_error(self, error: BaseException | str):\n        message = (\n            error\n            if isinstance(error, str)\n            else type(error).__name__ + \": \" + str(error)\n        )\n        with self._state_lock:\n            self._errors.append(message)\n\n    def _queue_marker(self, label: str):\n        with self._state_lock:\n            self._pending_markers.append(label)\n\n    def _run(self):\n        try:\n            self._ready.set()\n            while True:\n                if self._stop.wait(self.interval_seconds):\n                    self._capture(\"collector_stopped_after_cleanup\")\n                    return\n                self._capture()\n        except BaseException as error:\n            self._record_error(error)\n            self._stop.set()\n            self._ready.set()\n        finally:\n            if self._stream is not None:\n                self._stream.close()\n\n    def start(self):\n        self.identity = cgroup_identity(self.proc_root, self.cgroup_root)\n        self._stream = self.output.open(\"x\", buffering=1)\n        self._capture(\"collector_started_before_worker\")\n        self._thread = threading.Thread(\n            target=self._run, name=\"acl-resource-attribution\", daemon=True\n        )\n        self._thread.start()\n        if not self._ready.wait(timeout=2):\n            raise RuntimeError(\"resource collector did not become ready\")\n        self.require_healthy()\n\n    def mark(self, label: str):\n        self.require_healthy()\n        self._queue_marker(label)\n\n    def require_healthy(self):\n        with self._state_lock:\n            errors = tuple(self._errors)\n            last_completed = self._last_completed_monotonic\n        if errors:\n            raise RuntimeError(\"resource attribution failed: \" + \"; \".join(errors))\n        if self._thread is not None and not self._thread.is_alive() and not self._stop.is_set():\n            raise RuntimeError(\"resource attribution stopped unexpectedly\")\n        if (\n            self._thread is not None\n            and last_completed is not None\n            and time.monotonic() - last_completed > self.attribution_gap_seconds\n        ):\n            raise RuntimeError(\"resource attribution sample gap exceeded\")\n\n    def stop(self) -> CollectorOutcome:\n        if self._stream is None:\n            raise RuntimeError(\"resource collector was not started\")\n        self._queue_marker(\"cleanup_stop_requested\")\n        self._stop.set()\n        if self._thread is None:\n            self._stream.close()\n        else:\n            self._thread.join(timeout=self.shutdown_timeout_seconds)\n            if self._thread.is_alive():\n                self._record_error(\"collector thread did not stop within shutdown timeout\")\n            else:\n                self._stream.close()\n        with self._state_lock:\n            rows = list(self._rows)\n            errors = tuple(self._errors)\n        times = [row[\"monotonic\"] for row in rows]\n        gaps = [b - a for a, b in zip(times, times[1:])]\n        max_gap = max(gaps, default=0.0)\n        attribution_complete = (\n            bool(rows)\n            and not errors\n            and all(row[\"attribution_complete\"] for row in rows)\n            and max_gap <= self.attribution_gap_seconds\n            and self._thread is not None\n            and not self._thread.is_alive()\n        )\n        outcome = CollectorOutcome(\n            samples=len(rows),\n            maximum_gap_seconds=max_gap,\n            attribution_complete=attribution_complete,\n            errors=errors,\n        )\n        payload = {\n            \"samples\": outcome.samples,\n            \"maximum_gap_seconds\": outcome.maximum_gap_seconds,\n            \"attribution_gap_seconds\": self.attribution_gap_seconds,\n            \"attribution_complete\": outcome.attribution_complete,\n            \"errors\": list(outcome.errors),\n            \"auxiliary_attribution_only\": True,\n            \"qualification_guard_source\": \"worker samples.jsonl via telemetry.check_sample\",\n            \"memory_peak_scope\": \"shared_cgroup_lifetime_high_water_mark\",\n            \"memory_peak_reset\": False,\n            \"residual_is_diagnostic_only\": True,\n        }\n        with self.summary.open(\"x\") as stream:\n            stream.write(json.dumps(payload, indent=2, sort_keys=True) + \"\\n\")\n        return outcome\n",
        "yolo_reviewed_attribution_telemetry.py": "\"\"\"Strict, qualification-only attribution telemetry for YOLO calibration.\n\nThis module reuses the verified ACL cgroup/proc parsers, but tightens process\ncoverage semantics for a diagnostic run.  A missing process value is ``None``\nand makes that sample incomplete; it is never folded into a zero PSS total.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport threading\nimport time\nfrom typing import Callable\n\ntry:\n    from .acl_resource_telemetry import MEMORY_STAT_FIELDS, _fields, _proc_stat, cgroup_identity\nexcept ImportError:\n    from acl_resource_telemetry import MEMORY_STAT_FIELDS, _fields, _proc_stat, cgroup_identity\n\n\ndef _command_class(payload: bytes) -> str:\n    text = payload.replace(b\"\\0\", b\" \").decode(errors=\"replace\")\n    if \"yolo_fresh_measure.py\" in text or \"yolo_candidate_window.py\" in text:\n        return \"controller\"\n    if \"q04/worker.py\" in text or text.rstrip().endswith(\"worker.py\"):\n        return \"worker\"\n    if \"pdf_processing.warm_child\" in text:\n        return \"warm_parser\"\n    if \"-m pdf_processing.parse\" in text:\n        return \"fresh_parse_child\"\n    if \"-m pdf_processing.\" in text:\n        return \"fresh_owned_child\"\n    return \"owned_descendant\"\n\n\nclass ProcessLifecycle:\n    \"\"\"Track birth, exit, and PID reuse from identity-fenced snapshots.\"\"\"\n\n    def __init__(self):\n        self._previous: dict[int, dict] = {}\n\n    def update(self, processes: list[dict]) -> list[dict]:\n        current = {\n            int(row[\"pid\"]): row\n            for row in processes\n            if row.get(\"start_ticks\") is not None\n        }\n        events = []\n        for pid, row in sorted(current.items()):\n            before = self._previous.get(pid)\n            if before is None:\n                events.append({\n                    \"event\": \"birth_observed\",\n                    \"pid\": pid,\n                    \"start_ticks\": row[\"start_ticks\"],\n                    \"command_class\": row.get(\"command_class\", \"unknown_owned\"),\n                })\n            elif before[\"start_ticks\"] != row[\"start_ticks\"]:\n                events.append({\n                    \"event\": \"pid_reuse_observed\",\n                    \"pid\": pid,\n                    \"prior_start_ticks\": before[\"start_ticks\"],\n                    \"start_ticks\": row[\"start_ticks\"],\n                    \"command_class\": row.get(\"command_class\", \"unknown_owned\"),\n                })\n        for pid, row in sorted(self._previous.items()):\n            if pid not in current:\n                events.append({\n                    \"event\": \"exit_observed\",\n                    \"pid\": pid,\n                    \"start_ticks\": row[\"start_ticks\"],\n                    \"command_class\": row.get(\"command_class\", \"unknown_owned\"),\n                })\n        self._previous = current\n        return events\n\n\ndef _scan_identities(\n    proc_root: Path,\n    read_text: Callable[[Path], str],\n    expected_membership: str,\n) -> tuple[dict[int, dict], list[dict]]:\n    identities = {}\n    issues = []\n    try:\n        paths = list(proc_root.iterdir())\n    except (FileNotFoundError, PermissionError, ProcessLookupError) as error:\n        return {}, [{\"scope\": \"proc_enumeration\", \"reason\": type(error).__name__}]\n    for path in paths:\n        if not path.name.isdigit():\n            continue\n        try:\n            row = _proc_stat(read_text(path / \"stat\"))\n            memberships = [line for line in read_text(path / \"cgroup\").splitlines() if line]\n            if expected_membership not in memberships:\n                continue\n            row[\"pid\"] = int(path.name)\n            identities[row[\"pid\"]] = row\n        except (FileNotFoundError, PermissionError, ProcessLookupError, ValueError) as error:\n            issues.append({\n                \"scope\": \"proc_identity\",\n                \"pid\": int(path.name),\n                \"reason\": type(error).__name__,\n            })\n    return identities, issues\n\n\ndef _owned(identities: dict[int, dict], root_pid: int) -> dict[int, dict]:\n    if root_pid not in identities:\n        return {}\n    result = {root_pid}\n    changed = True\n    while changed:\n        changed = False\n        for pid, row in identities.items():\n            if pid not in result and row[\"ppid\"] in result:\n                result.add(pid)\n                changed = True\n    return {pid: identities[pid] for pid in sorted(result)}\n\n\ndef _read_process(\n    proc_root: Path,\n    initial: dict,\n    read_text: Callable[[Path], str],\n    read_bytes: Callable[[Path], bytes],\n    owned: bool,\n) -> dict:\n    pid = initial[\"pid\"]\n    root = proc_root / str(pid)\n    base = {\n        \"pid\": pid,\n        \"ppid\": initial[\"ppid\"],\n        \"start_ticks\": initial[\"start_ticks\"],\n        \"ownership\": \"owned\" if owned else \"shared_cgroup_other\",\n    }\n    try:\n        current = _proc_stat(read_text(root / \"stat\"))\n    except (FileNotFoundError, PermissionError, ProcessLookupError, ValueError) as error:\n        return {**base, \"status\": \"unknown\", \"reason\": type(error).__name__,\n                \"command_class\": \"unknown_owned\", \"pss_bytes\": None}\n    if current[\"start_ticks\"] != initial[\"start_ticks\"]:\n        return {\n            **base,\n            \"status\": \"identity_changed_during_sample\",\n            \"observed_start_ticks\": current[\"start_ticks\"],\n            \"command_class\": \"unknown_owned\",\n            \"pss_bytes\": None,\n        }\n    try:\n        command = read_bytes(root / \"cmdline\")\n        command_hash = hashlib.sha256(command).hexdigest()\n        command_class = _command_class(command)\n    except (FileNotFoundError, PermissionError, ProcessLookupError) as error:\n        return {**base, \"status\": \"unknown\", \"reason\": type(error).__name__,\n                \"command_class\": \"unknown_owned\", \"pss_bytes\": None}\n    try:\n        status = _fields(read_text(root / \"status\"), kib=True)\n        smaps = _fields(read_text(root / \"smaps_rollup\"), kib=True)\n    except (FileNotFoundError, PermissionError, ProcessLookupError) as error:\n        return {\n            **base,\n            \"status\": \"unknown\",\n            \"reason\": type(error).__name__,\n            \"command_class\": command_class,\n            \"command_sha256\": command_hash,\n            \"pss_bytes\": None,\n        }\n    required = {\n        \"rss_bytes\": smaps.get(\"Rss\"),\n        \"pss_bytes\": smaps.get(\"Pss\"),\n        \"rss_anon_bytes\": status.get(\"RssAnon\"),\n        \"rss_file_bytes\": status.get(\"RssFile\"),\n        \"rss_shmem_bytes\": status.get(\"RssShmem\"),\n    }\n    missing = sorted(name for name, value in required.items() if value is None)\n    return {\n        **base,\n        \"state\": current[\"state\"],\n        \"status\": \"complete\" if not missing else \"incomplete\",\n        \"command_class\": command_class,\n        \"command_sha256\": command_hash,\n        **required,\n        \"minor_faults\": current[\"minor_faults\"],\n        \"major_faults\": current[\"major_faults\"],\n        \"user_cpu_ticks\": current[\"user_cpu_ticks\"],\n        \"system_cpu_ticks\": current[\"system_cpu_ticks\"],\n        \"missing_fields\": missing,\n    }\n\n\ndef _read_required(path: Path, reader: Callable[[Path], str], issues: list[dict]) -> str | None:\n    try:\n        return reader(path)\n    except (FileNotFoundError, PermissionError, ProcessLookupError) as error:\n        issues.append({\"scope\": \"cgroup\", \"field\": path.name, \"reason\": type(error).__name__})\n        return None\n\n\ndef observed_runtime_markers(root: Path) -> tuple[list[dict], list[dict]]:\n    \"\"\"Report only externally observable files; labels never assert stage start.\"\"\"\n    markers = []\n    issues = []\n    if not root.exists():\n        return markers, issues\n    patterns = (\n        (\"workflow-intent.json\", \"workflow_intent_file_observed\", \"intent_not_submission\"),\n        (\"workflow.json\", \"workflow_record_file_observed\", \"submission_record_not_activity_start\"),\n        (\"cancel-outcome.json\", \"cancel_outcome_file_observed\", \"retained_cleanup_record\"),\n    )\n    for filename, label, meaning in patterns:\n        try:\n            for path in root.rglob(filename):\n                markers.append({\"key\": str(path.relative_to(root)), \"label\": label, \"meaning\": meaning})\n        except (FileNotFoundError, PermissionError, OSError) as error:\n            issues.append({\"scope\": \"runtime_files\", \"field\": filename, \"reason\": type(error).__name__})\n    try:\n        for path in root.rglob(\"progress.jsonl\"):\n            rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]\n            if rows and rows[-1].get(\"progress\", {}).get(\"status\") == \"assembling\":\n                markers.append({\n                    \"key\": str(path.relative_to(root)) + \":assembling\",\n                    \"label\": \"workflow_progress_assembling_observed\",\n                    \"meaning\": \"workflow_query_state_not_activity_start\",\n                })\n    except (FileNotFoundError, PermissionError, OSError, ValueError, TypeError) as error:\n        issues.append({\"scope\": \"runtime_progress\", \"reason\": type(error).__name__})\n    try:\n        for path in root.rglob(\"samples.jsonl\"):\n            rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]\n            handoff = next(\n                (\n                    row.get(\"parser\", {})\n                    for row in rows\n                    if row.get(\"parser\", {}).get(\"handoffs\", 0) > 0\n                    and row.get(\"parser\", {}).get(\"termination_reason\")\n                    == \"fresh_child_handoff\"\n                ),\n                None,\n            )\n            if handoff is not None:\n                markers.append({\n                    \"key\": str(path.relative_to(root)) + \":parser_handoff\",\n                    \"label\": \"warm_handoff_observed\",\n                    \"meaning\": \"worker_supervision_sample_after_warm_reap\",\n                    \"handoffs\": handoff[\"handoffs\"],\n                })\n    except (FileNotFoundError, PermissionError, OSError, ValueError, TypeError) as error:\n        issues.append({\"scope\": \"worker_samples\", \"reason\": type(error).__name__})\n    try:\n        for path in root.rglob(\"merged\"):\n            if path.is_dir():\n                markers.append({\n                    \"key\": str(path.relative_to(root)),\n                    \"label\": \"merged_directory_observed\",\n                    \"meaning\": \"filesystem_presence_not_materialization_start\",\n                })\n    except (FileNotFoundError, PermissionError, OSError) as error:\n        issues.append({\"scope\": \"runtime_files\", \"field\": \"merged\", \"reason\": type(error).__name__})\n    return markers, issues\n\n\ndef _process_identity(row: dict) -> tuple[int, int] | None:\n    pid, start_ticks = row.get(\"pid\"), row.get(\"start_ticks\")\n    if type(pid) is not int or type(start_ticks) is not int:\n        return None\n    return pid, start_ticks\n\n\ndef _cgroup_reading_complete(row: dict) -> bool:\n    events = row.get(\"memory_events\")\n    stat = row.get(\"memory_stat\")\n    pressure = row.get(\"memory_pressure_raw\")\n    return (\n        type(row.get(\"memory_current\")) is int\n        and isinstance(row.get(\"cgroup\"), dict)\n        and isinstance(events, dict)\n        and all(type(events.get(key)) is int for key in (\"oom\", \"oom_kill\", \"oom_group_kill\"))\n        and isinstance(stat, dict)\n        and all(type(stat.get(key)) is int for key in MEMORY_STAT_FIELDS)\n        and isinstance(pressure, str)\n        and any(line.startswith(\"full \") and \"avg10=\" in line for line in pressure.splitlines())\n    )\n\n\ndef classify_confirmed_exit_transition(\n    rows: list[dict], index: int, *, attribution_gap_seconds: float, peak_index: int\n) -> dict:\n    \"\"\"Classify one PSS-unknown sample without rewriting its raw facts.\n\n    Qualification may retain continuous cgroup evidence across a proven process\n    exit.  The process PSS remains unknown and attribution_complete remains\n    false.  PID reuse, read denial, unknown identities and an unattributed peak\n    all fail closed.\n    \"\"\"\n    failure = lambda reason: {\"status\": \"unclassified\", \"index\": index, \"reason\": reason}\n    if index <= 0 or index + 1 >= len(rows):\n        return failure(\"transition_not_bounded\")\n    before, current, after = rows[index - 1], rows[index], rows[index + 1]\n    if current.get(\"attribution_complete\") is not False:\n        return failure(\"sample_not_process_incomplete\")\n    if index == peak_index:\n        return failure(\"peak_process_attribution_incomplete\")\n    if not all(_cgroup_reading_complete(row) for row in (before, current, after)):\n        return failure(\"cgroup_reading_incomplete\")\n    if not (before[\"cgroup\"] == current[\"cgroup\"] == after[\"cgroup\"]):\n        return failure(\"cgroup_identity_changed\")\n    if any(\n        row.get(\"attribution_complete\") is not True\n        or row.get(\"process_coverage\", {}).get(\"status\") != \"complete\"\n        for row in (before, after)\n    ):\n        return failure(\"adjacent_process_enumeration_incomplete\")\n    if (\n        current[\"monotonic\"] - before[\"monotonic\"] > attribution_gap_seconds\n        or after[\"monotonic\"] - current[\"monotonic\"] > attribution_gap_seconds\n    ):\n        return failure(\"transition_gap_exceeded\")\n    unknown_reasons = current.get(\"process_coverage\", {}).get(\"unknown\")\n    if unknown_reasons != [\n        {\"scope\": \"process_coverage\", \"reason\": \"cgroup_process_read_incomplete\"}\n    ]:\n        return failure(\"unexpected_process_coverage_reason\")\n    unknown = [row for row in current.get(\"processes\", []) if row.get(\"status\") != \"complete\"]\n    if len(unknown) != 1:\n        return failure(\"expected_one_exiting_process\")\n    exiting = unknown[0]\n    identity = _process_identity(exiting)\n    if identity is None:\n        return failure(\"exiting_process_identity_missing\")\n    if exiting.get(\"reason\") not in (\"FileNotFoundError\", \"ProcessLookupError\"):\n        return failure(\"exit_read_was_not_process_absence\")\n    prior = [row for row in before.get(\"processes\", []) if _process_identity(row) == identity]\n    if len(prior) != 1 or prior[0].get(\"status\") != \"complete\":\n        return failure(\"prior_process_identity_not_complete\")\n    if any(_process_identity(row) == identity for row in after.get(\"processes\", [])):\n        return failure(\"exiting_identity_still_present\")\n    events = current.get(\"process_events\", []) + after.get(\"process_events\", [])\n    if any(\n        event.get(\"event\") == \"pid_reuse_observed\" and event.get(\"pid\") == identity[0]\n        for event in events\n    ):\n        return failure(\"pid_reuse_observed\")\n    exits = [\n        event\n        for event in events\n        if event.get(\"event\") == \"exit_observed\"\n        and (event.get(\"pid\"), event.get(\"start_ticks\")) == identity\n    ]\n    if len(exits) != 1:\n        return failure(\"matching_exit_not_confirmed\")\n    return {\n        \"status\": \"classified_confirmed_exit\",\n        \"index\": index,\n        \"pid\": identity[0],\n        \"start_ticks\": identity[1],\n        \"prior_command_class\": prior[0].get(\"command_class\"),\n        \"pss_bytes\": None,\n        \"process_attribution_complete\": False,\n        \"cgroup_readings_complete\": True,\n    }\n\n\ndef evaluate_parser_lifecycle_contract(\n    rows: list[dict], observation_root: Path | None, *, require_recycle_exit: bool\n) -> dict:\n    if not require_recycle_exit:\n        return {\"status\": \"not_required\", \"complete\": True}\n    if observation_root is None:\n        return {\"status\": \"incomplete\", \"complete\": False, \"reason\": \"observation_root_missing\"}\n    accepted_path = observation_root / \"fresh-07/accepted.json\"\n    try:\n        accepted = json.loads(accepted_path.read_text())\n    except (FileNotFoundError, PermissionError, OSError, ValueError, TypeError) as error:\n        return {\"status\": \"incomplete\", \"complete\": False, \"reason\": type(error).__name__}\n    groups = [step for step in accepted.get(\"result\", {}).get(\"steps\", []) if step.get(\"stage\") == \"group\"]\n    parsers = [step.get(\"parser\") for step in groups if step.get(\"reused\") is False]\n    if len(groups) != 3 or len(parsers) != 3 or any(not isinstance(row, dict) for row in parsers):\n        return {\"status\": \"incomplete\", \"complete\": False, \"reason\": \"fresh_group_parser_records_missing\"}\n    if any(\n        row.get(\"termination_reason\") != \"request_recycle\"\n        or row.get(\"ready\") is not False\n        or type(row.get(\"pid\")) is not int\n        for row in parsers\n    ):\n        return {\"status\": \"incomplete\", \"complete\": False, \"reason\": \"request_recycle_record_invalid\"}\n    pids = [row[\"pid\"] for row in parsers]\n    if len(set(pids)) != len(pids):\n        return {\"status\": \"incomplete\", \"complete\": False, \"reason\": \"parser_pid_reused_across_groups\"}\n    assembly_indexes = [\n        index\n        for index, row in enumerate(rows)\n        if \"workflow_progress_assembling_observed\" in row.get(\"observation_labels\", [])\n    ]\n    if len(assembly_indexes) != 1:\n        return {\"status\": \"incomplete\", \"complete\": False, \"reason\": \"assembly_observation_ambiguous\"}\n    assembly_index = assembly_indexes[0]\n    identities = {}\n    for pid in pids:\n        seen = {\n            _process_identity(process)\n            for row in rows[: assembly_index + 1]\n            for process in row.get(\"processes\", [])\n            if process.get(\"pid\") == pid\n            and process.get(\"command_class\") == \"warm_parser\"\n            and process.get(\"status\") == \"complete\"\n        }\n        seen.discard(None)\n        if len(seen) != 1:\n            return {\"status\": \"incomplete\", \"complete\": False, \"reason\": \"parser_identity_not_uniquely_observed\", \"pid\": pid}\n        identities[pid] = next(iter(seen))\n    all_events = [event for row in rows for event in row.get(\"process_events\", [])]\n    exits = []\n    for pid, identity in identities.items():\n        if any(event.get(\"event\") == \"pid_reuse_observed\" and event.get(\"pid\") == pid for event in all_events):\n            return {\"status\": \"incomplete\", \"complete\": False, \"reason\": \"parser_pid_reuse_observed\", \"pid\": pid}\n        matching = [\n            (index, event)\n            for index, row in enumerate(rows)\n            for event in row.get(\"process_events\", [])\n            if event.get(\"event\") == \"exit_observed\"\n            and (event.get(\"pid\"), event.get(\"start_ticks\")) == identity\n        ]\n        if len(matching) != 1 or matching[0][0] >= assembly_index:\n            return {\"status\": \"incomplete\", \"complete\": False, \"reason\": \"parser_exit_not_confirmed_before_assembly\", \"pid\": pid}\n        exits.append({\"pid\": pid, \"start_ticks\": identity[1], \"sample_index\": matching[0][0]})\n    if any(row.get(\"warm_parser_present\") for row in rows[assembly_index:]):\n        return {\"status\": \"incomplete\", \"complete\": False, \"reason\": \"warm_parser_present_at_or_after_assembly\"}\n    return {\n        \"status\": \"complete_request_recycle_exit\",\n        \"complete\": True,\n        \"assembly_sample_index\": assembly_index,\n        \"parser_exits\": exits,\n        \"handoff_required\": False,\n    }\n\n\ndef strict_attribution_sample(\n    *,\n    root_pid: int,\n    expected_cgroup: dict,\n    proc_root: Path = Path(\"/proc\"),\n    cgroup_root: Path = Path(\"/sys/fs/cgroup\"),\n    observation_root: Path | None = None,\n    wall_time: Callable[[], float] = time.time,\n    monotonic: Callable[[], float] = time.monotonic,\n    thread_time: Callable[[], float] = time.thread_time,\n    read_text: Callable[[Path], str] | None = None,\n    read_bytes: Callable[[Path], bytes] | None = None,\n) -> dict:\n    \"\"\"Capture one fenced sample; unavailable attribution remains unknown.\"\"\"\n    started = monotonic()\n    cpu_started = thread_time()\n    text_reader = read_text or (lambda path: path.read_text())\n    bytes_reader = read_bytes or (lambda path: path.read_bytes())\n    actual_cgroup = cgroup_identity(proc_root, cgroup_root, read_text=text_reader)\n    if actual_cgroup != expected_cgroup:\n        raise ValueError(\"cgroup observation identity changed\")\n\n    issues = []\n    current_text = _read_required(cgroup_root / \"memory.current\", text_reader, issues)\n    events_text = _read_required(cgroup_root / \"memory.events\", text_reader, issues)\n    stat_text = _read_required(cgroup_root / \"memory.stat\", text_reader, issues)\n    pressure_text = _read_required(cgroup_root / \"memory.pressure\", text_reader, issues)\n    memory_current = None\n    try:\n        memory_current = int(current_text.strip()) if current_text is not None else None\n    except ValueError:\n        issues.append({\"scope\": \"cgroup\", \"field\": \"memory.current\", \"reason\": \"invalid\"})\n    memory_events = _fields(events_text or \"\")\n    if \"oom_kill\" not in memory_events:\n        issues.append({\"scope\": \"cgroup\", \"field\": \"memory.events:oom_kill\", \"reason\": \"missing\"})\n    raw_stat = _fields(stat_text or \"\")\n    memory_stat = {name: raw_stat.get(name) for name in MEMORY_STAT_FIELDS}\n    for name, value in memory_stat.items():\n        if value is None:\n            issues.append({\"scope\": \"cgroup\", \"field\": \"memory.stat:\" + name, \"reason\": \"missing\"})\n\n    before, before_issues = _scan_identities(\n        proc_root, text_reader, expected_cgroup[\"proc_cgroup\"]\n    )\n    issues.extend(before_issues)\n    owned = _owned(before, root_pid)\n    if not owned:\n        issues.append({\"scope\": \"process_coverage\", \"reason\": \"owned_root_unknown\", \"pid\": root_pid})\n    processes = [\n        _read_process(\n            proc_root,\n            row,\n            text_reader,\n            bytes_reader,\n            owned=pid in owned,\n        )\n        for pid, row in sorted(before.items())\n    ]\n    after, after_issues = _scan_identities(\n        proc_root, text_reader, expected_cgroup[\"proc_cgroup\"]\n    )\n    issues.extend(after_issues)\n    before_keys = sorted((pid, row[\"start_ticks\"], row[\"ppid\"]) for pid, row in before.items())\n    after_keys = sorted((pid, row[\"start_ticks\"], row[\"ppid\"]) for pid, row in after.items())\n    process_set_changed = before_keys != after_keys\n    if process_set_changed:\n        issues.append({\"scope\": \"process_coverage\", \"reason\": \"process_set_changed_during_sample\"})\n    if any(row[\"status\"] != \"complete\" for row in processes):\n        issues.append({\n            \"scope\": \"process_coverage\",\n            \"reason\": (\n                \"process_transition_read_incomplete\"\n                if process_set_changed\n                else \"cgroup_process_read_incomplete\"\n            ),\n        })\n\n    runtime_markers, runtime_issues = observed_runtime_markers(observation_root) if observation_root else ([], [])\n    issues.extend(runtime_issues)\n    complete = not issues and memory_current is not None and bool(processes)\n    cgroup_pss_total = sum(row[\"pss_bytes\"] for row in processes) if complete else None\n    owned_pss_total = (\n        sum(row[\"pss_bytes\"] for row in processes if row[\"ownership\"] == \"owned\")\n        if complete\n        else None\n    )\n    unattributed = memory_current - cgroup_pss_total if complete else None\n    finished = monotonic()\n    cpu_finished = thread_time()\n    return {\n        \"time\": wall_time(),\n        \"monotonic\": finished,\n        \"sample_duration_seconds\": finished - started,\n        \"collector_thread_cpu_seconds\": cpu_finished - cpu_started,\n        \"cgroup\": actual_cgroup,\n        \"memory_current\": memory_current,\n        \"memory_events\": memory_events,\n        \"memory_stat\": memory_stat,\n        \"memory_pressure_raw\": pressure_text,\n        \"owned_root_pid\": root_pid,\n        \"processes\": processes,\n        \"process_coverage\": {\n            \"status\": \"complete\" if complete else \"incomplete\",\n            \"enumerated_before\": len(before),\n            \"enumerated_after\": len(after),\n            \"owned_before\": len(owned),\n            \"shared_cgroup_other_before\": len(before) - len(owned),\n            \"unknown\": issues,\n        },\n        \"owned_pss_total_bytes\": owned_pss_total,\n        \"shared_cgroup_process_pss_total_bytes\": cgroup_pss_total,\n        \"diagnostic_unattributed_bytes\": unattributed,\n        \"diagnostic_unattributed_includes\": \"file/cache, kernel and other non-process cgroup charges, plus sequential-read timing skew\",\n        \"diagnostic_unattributed_is_cache\": False,\n        \"attribution_complete\": complete,\n        \"runtime_observations\": runtime_markers,\n    }\n\n\n@dataclass(frozen=True)\nclass CollectorOutcome:\n    samples: int\n    maximum_gap_seconds: float\n    attribution_complete: bool\n    qualification_complete: bool\n    cgroup_resource_complete: bool\n    status: str\n    errors: tuple[str, ...]\n    incomplete_samples: int\n\n\nclass StrictAttributionCollector:\n    \"\"\"Own sampling, lifecycle, observational markers, cost, and cleanup evidence.\"\"\"\n\n    def __init__(\n        self,\n        output: Path,\n        summary: Path,\n        *,\n        root_pid: int | None = None,\n        observation_root: Path | None = None,\n        interval_seconds: float = 0.25,\n        attribution_gap_seconds: float = 1.0,\n        shutdown_timeout_seconds: float = 2.0,\n        proc_root: Path = Path(\"/proc\"),\n        cgroup_root: Path = Path(\"/sys/fs/cgroup\"),\n        sampler=strict_attribution_sample,\n        stream_factory=None,\n    ):\n        if min(interval_seconds, attribution_gap_seconds, shutdown_timeout_seconds) <= 0:\n            raise ValueError(\"collector intervals must be positive\")\n        self.output = output\n        self.spool = output.with_name(output.name + \".inflight\")\n        self.summary = summary\n        self.root_pid = root_pid or os.getpid()\n        self.observation_root = observation_root\n        self.interval_seconds = interval_seconds\n        self.attribution_gap_seconds = attribution_gap_seconds\n        self.shutdown_timeout_seconds = shutdown_timeout_seconds\n        self.proc_root = proc_root\n        self.cgroup_root = cgroup_root\n        self.sampler = sampler\n        self.stream_factory = stream_factory or (\n            lambda output: output.open(\"x\", buffering=1)\n        )\n        self.identity = None\n        self._stop = threading.Event()\n        self._ready = threading.Event()\n        self._lock = threading.Lock()\n        self._capture_lock = threading.Lock()\n        self._thread = None\n        self._stream = None\n        self._final_stream = None\n        self._committed_bytes = 0\n        self._rows = []\n        self._errors = []\n        self._pending = []\n        self._seen_runtime = set()\n        self._last_completed = None\n        self._lifecycle = ProcessLifecycle()\n        self._abandoned = threading.Event()\n\n    @property\n    def started(self) -> bool:\n        return self._stream is not None\n\n    def observe(self, label: str, *, source: str, meaning: str):\n        if not label or not source or not meaning:\n            raise ValueError(\"observable marker fields are required\")\n        with self._lock:\n            self._pending.append({\n                \"label\": label,\n                \"source\": source,\n                \"meaning\": meaning,\n                \"observed_at\": time.time(),\n            })\n\n    def _capture(self, terminal: bool = False):\n        with self._capture_lock:\n            if self.identity is None or self._stream is None:\n                raise RuntimeError(\"collector is not initialized\")\n            if self._abandoned.is_set():\n                return\n            row = self.sampler(\n                root_pid=self.root_pid,\n                expected_cgroup=self.identity,\n                proc_root=self.proc_root,\n                cgroup_root=self.cgroup_root,\n                observation_root=self.observation_root,\n            )\n            row[\"process_events\"] = self._lifecycle.update(row[\"processes\"])\n            fresh_events = [\n                {\n                    \"label\": \"fresh_parse_process_birth_observed\",\n                    \"source\": \"identity_fenced_process_table\",\n                    \"meaning\": \"process_birth_observed_operation_input_not_visible\",\n                    \"observed_at\": row[\"time\"],\n                }\n                for event in row[\"process_events\"]\n                if event[\"event\"] in (\"birth_observed\", \"pid_reuse_observed\")\n                and event.get(\"command_class\") == \"fresh_parse_child\"\n            ]\n            runtime = []\n            for event in row.pop(\"runtime_observations\"):\n                if event[\"key\"] not in self._seen_runtime:\n                    self._seen_runtime.add(event[\"key\"])\n                    runtime.append({\n                        \"label\": event[\"label\"],\n                        \"source\": \"external_runtime_files\",\n                        \"meaning\": event[\"meaning\"],\n                        \"observed_at\": row[\"time\"],\n                    })\n            controller_pss = next(\n                (\n                    process[\"pss_bytes\"]\n                    for process in row[\"processes\"]\n                    if process[\"pid\"] == self.root_pid\n                    and process.get(\"pss_bytes\") is not None\n                ),\n                None,\n            )\n            completed = time.monotonic()\n            with self._lock:\n                if self._abandoned.is_set():\n                    return\n                markers = self._pending\n                self._pending = []\n                row[\"observations\"] = markers + fresh_events + runtime\n                if terminal:\n                    row[\"observations\"].append({\n                        \"label\": \"post_cleanup_sample\",\n                        \"source\": \"collector_lifecycle\",\n                        \"meaning\": \"sample_after_owned_cleanup_callback\",\n                        \"observed_at\": row[\"time\"],\n                    })\n                summary_row = {\n                    \"monotonic\": row[\"monotonic\"],\n                    \"cgroup\": row[\"cgroup\"],\n                    \"attribution_complete\": row[\"attribution_complete\"],\n                    \"process_coverage\": row[\"process_coverage\"],\n                    \"processes\": [\n                        {\n                            key: process.get(key)\n                            for key in (\n                                \"pid\", \"ppid\", \"start_ticks\", \"ownership\",\n                                \"status\", \"reason\", \"command_class\", \"pss_bytes\",\n                            )\n                        }\n                        for process in row[\"processes\"]\n                    ],\n                    \"process_events\": row[\"process_events\"],\n                    \"memory_current\": row[\"memory_current\"],\n                    \"memory_events\": row[\"memory_events\"],\n                    \"memory_stat\": row[\"memory_stat\"],\n                    \"memory_pressure_raw\": row[\"memory_pressure_raw\"],\n                    \"sample_duration_seconds\": row[\"sample_duration_seconds\"],\n                    \"collector_thread_cpu_seconds\": row[\"collector_thread_cpu_seconds\"],\n                    \"controller_pss_bytes\": controller_pss,\n                    \"warm_parser_present\": any(\n                        process.get(\"ownership\") == \"owned\"\n                        and process.get(\"command_class\") == \"warm_parser\"\n                        for process in row[\"processes\"]\n                    ),\n                    \"fresh_parse_present\": any(\n                        process.get(\"ownership\") == \"owned\"\n                        and process.get(\"command_class\") == \"fresh_parse_child\"\n                        for process in row[\"processes\"]\n                    ),\n                    \"observation_labels\": [\n                        observation[\"label\"] for observation in row[\"observations\"]\n                    ],\n                }\n            payload = json.dumps(row, sort_keys=True, separators=(\",\", \":\")) + \"\\n\"\n            try:\n                self._stream.write(payload)\n                self._stream.flush()\n                committed_bytes = self._stream.tell()\n            except BaseException:\n                self._abandoned.set()\n                raise\n            with self._lock:\n                if self._abandoned.is_set():\n                    return\n                if self._last_completed is not None:\n                    gap = completed - self._last_completed\n                    if gap > self.attribution_gap_seconds:\n                        self._errors.append(f\"collector gap exceeded: {gap:.6f}s\")\n                self._last_completed = completed\n                self._rows.append(summary_row)\n                self._committed_bytes = committed_bytes\n\n    def _run(self):\n        try:\n            self._ready.set()\n            while not self._stop.wait(self.interval_seconds):\n                self._capture()\n        except BaseException as error:\n            with self._lock:\n                self._errors.append(type(error).__name__ + \": \" + str(error))\n            self._stop.set()\n            self._ready.set()\n        finally:\n            if self._abandoned.is_set() and self._stream is not None:\n                self._stream.close()\n\n    def start(self):\n        self.identity = cgroup_identity(self.proc_root, self.cgroup_root)\n        self._final_stream = self.output.open(\"xb\")\n        self._stream = self.stream_factory(self.spool)\n        self.observe(\n            \"baseline_before_worker\",\n            source=\"collector_lifecycle\",\n            meaning=\"sample_before_worker_start_callback\",\n        )\n        try:\n            self._capture()\n        except BaseException as error:\n            with self._lock:\n                self._errors.append(type(error).__name__ + \": \" + str(error))\n            raise\n        self._thread = threading.Thread(target=self._run, name=\"yolo-attribution\", daemon=True)\n        self._thread.start()\n        if not self._ready.wait(2):\n            raise RuntimeError(\"collector did not become ready\")\n        self.require_healthy()\n\n    def require_healthy(self):\n        with self._lock:\n            errors = tuple(self._errors)\n            last = self._last_completed\n        if errors:\n            raise RuntimeError(\"attribution collector failed: \" + \"; \".join(errors))\n        if self._thread is not None and not self._thread.is_alive() and not self._stop.is_set():\n            raise RuntimeError(\"attribution collector stopped unexpectedly\")\n        if last is not None and time.monotonic() - last > self.attribution_gap_seconds:\n            raise RuntimeError(\"attribution collector gap exceeded\")\n\n    def stop(\n        self,\n        *,\n        expect_cancel: bool = True,\n        require_handoff: bool = False,\n        require_recycle_exit: bool = False,\n        require_no_warm_fresh_overlap: bool = False,\n    ) -> CollectorOutcome:\n        if self._stream is None:\n            raise RuntimeError(\"collector was not started\")\n        self._stop.set()\n        if self._thread is not None:\n            self._thread.join(self.shutdown_timeout_seconds)\n            if self._thread.is_alive():\n                self._abandoned.set()\n                with self._lock:\n                    self._errors.append(\"collector thread did not stop within cleanup timeout\")\n        if self._thread is None or not self._thread.is_alive():\n            try:\n                self._capture(terminal=True)\n            except BaseException as error:\n                with self._lock:\n                    self._errors.append(type(error).__name__ + \": \" + str(error))\n        with self._lock:\n            rows = list(self._rows)\n            errors = tuple(self._errors)\n            committed_bytes = self._committed_bytes\n        thread_alive = self._thread is not None and self._thread.is_alive()\n        if self._stream is not None and not thread_alive:\n            self._stream.close()\n        if self._final_stream is None:\n            raise RuntimeError(\"collector output was not reserved\")\n        with self.spool.open(\"rb\") as spool:\n            retained = spool.read(committed_bytes)\n        if len(retained) != committed_bytes:\n            errors = errors + (\"committed collector spool was truncated\",)\n        self._final_stream.write(retained)\n        self._final_stream.flush()\n        self._final_stream.close()\n        gaps = [b[\"monotonic\"] - a[\"monotonic\"] for a, b in zip(rows, rows[1:])]\n        incomplete = sum(not row[\"attribution_complete\"] for row in rows)\n        hard_incomplete = [\n            index for index, row in enumerate(rows)\n            if not row[\"attribution_complete\"]\n        ]\n        transition_spans = []\n        unbounded_transition = False\n        index = 0\n        while index < len(rows):\n            if rows[index][\"attribution_complete\"]:\n                index += 1\n                continue\n            start = index\n            while index + 1 < len(rows) and not rows[index + 1][\"attribution_complete\"]:\n                index += 1\n            end = index\n            if start == 0 or end + 1 == len(rows):\n                unbounded_transition = True\n            else:\n                transition_spans.append(\n                    rows[end + 1][\"monotonic\"] - rows[start - 1][\"monotonic\"]\n                )\n            index += 1\n        peak_index = max(\n            range(len(rows)),\n            key=lambda item: rows[item][\"memory_current\"]\n            if type(rows[item][\"memory_current\"]) is int\n            else -1,\n            default=None,\n        )\n        peak_row = None if peak_index is None else rows[peak_index]\n        transition_classifications = []\n        if require_recycle_exit and peak_index is not None:\n            transition_classifications = [\n                classify_confirmed_exit_transition(\n                    rows,\n                    item,\n                    attribution_gap_seconds=self.attribution_gap_seconds,\n                    peak_index=peak_index,\n                )\n                for item in hard_incomplete\n            ]\n        classified_transition_indexes = [\n            item[\"index\"]\n            for item in transition_classifications\n            if item[\"status\"] == \"classified_confirmed_exit\"\n        ]\n        unclassified_incomplete = sorted(\n            set(hard_incomplete) - set(classified_transition_indexes)\n        )\n        observation_sequence = [\n            label for row in rows for label in row[\"observation_labels\"]\n        ]\n        observed_labels = set(observation_sequence)\n        required_label_sequence = [\"baseline_before_worker\"]\n        required_label_sequence.append(\"workflow_progress_assembling_observed\")\n        if require_handoff:\n            required_label_sequence.append(\"warm_handoff_observed\")\n        if expect_cancel:\n            required_label_sequence.append(\"cancel_requested\")\n        required_label_sequence.append(\"post_cleanup_sample\")\n        missing_required_labels = sorted(\n            set(required_label_sequence) - observed_labels\n        )\n        required_markers_in_order = False\n        if not missing_required_labels:\n            cursor = -1\n            required_markers_in_order = True\n            for label in required_label_sequence:\n                try:\n                    cursor = observation_sequence.index(label, cursor + 1)\n                except ValueError:\n                    required_markers_in_order = False\n                    break\n        overlap_sample_indexes = [\n            index\n            for index, row in enumerate(rows)\n            if row[\"warm_parser_present\"] and row[\"fresh_parse_present\"]\n        ]\n        no_warm_fresh_overlap = not overlap_sample_indexes\n        parser_lifecycle = evaluate_parser_lifecycle_contract(\n            rows,\n            self.observation_root,\n            require_recycle_exit=require_recycle_exit,\n        )\n        process_attribution_complete = not hard_incomplete\n        cgroup_resource_complete = (\n            bool(rows)\n            and all(_cgroup_reading_complete(row) for row in rows)\n            and not unclassified_incomplete\n            and max(gaps, default=0) <= self.attribution_gap_seconds\n        )\n        qualification_complete = (\n            bool(rows)\n            and not errors\n            and cgroup_resource_complete\n            and not missing_required_labels\n            and required_markers_in_order\n            and peak_row is not None\n            and peak_row[\"attribution_complete\"]\n            and parser_lifecycle[\"complete\"]\n            and (no_warm_fresh_overlap or not require_no_warm_fresh_overlap)\n        )\n        attribution_complete = qualification_complete and process_attribution_complete\n        status = (\n            \"complete\"\n            if attribution_complete\n            else \"qualification_complete_process_attribution_incomplete\"\n            if qualification_complete\n            else \"incomplete\"\n        )\n        outcome = CollectorOutcome(\n            samples=len(rows),\n            maximum_gap_seconds=max(gaps, default=0.0),\n            attribution_complete=attribution_complete,\n            qualification_complete=qualification_complete,\n            cgroup_resource_complete=cgroup_resource_complete,\n            status=status,\n            errors=errors,\n            incomplete_samples=incomplete,\n        )\n        controller_pss = [row[\"controller_pss_bytes\"] for row in rows]\n        known_controller_pss = [value for value in controller_pss if value is not None]\n        payload = {\n            \"samples\": outcome.samples,\n            \"maximum_gap_seconds\": outcome.maximum_gap_seconds,\n            \"attribution_gap_seconds\": self.attribution_gap_seconds,\n            \"attribution_complete\": outcome.attribution_complete,\n            \"process_attribution_complete\": process_attribution_complete,\n            \"qualification_complete\": outcome.qualification_complete,\n            \"cgroup_resource_complete\": outcome.cgroup_resource_complete,\n            \"status\": outcome.status,\n            \"incomplete_samples\": outcome.incomplete_samples,\n            \"hard_incomplete_sample_indexes\": hard_incomplete,\n            \"classified_cgroup_transition_sample_indexes\": classified_transition_indexes,\n            \"unclassified_incomplete_sample_indexes\": unclassified_incomplete,\n            \"transition_classifications\": transition_classifications,\n            \"required_observation_sequence\": required_label_sequence,\n            \"observed_observation_labels\": sorted(observed_labels),\n            \"missing_required_observation_labels\": missing_required_labels,\n            \"required_observations_in_order\": required_markers_in_order,\n            \"measurement_contract\": \"guard_failure\" if expect_cancel else \"successful_workload\",\n            \"cancel_observation_required\": expect_cancel,\n            \"handoff_observation_required\": require_handoff,\n            \"request_recycle_exit_required\": require_recycle_exit,\n            \"parser_lifecycle_contract\": parser_lifecycle,\n            \"no_warm_fresh_overlap_required\": require_no_warm_fresh_overlap,\n            \"no_warm_fresh_overlap\": no_warm_fresh_overlap,\n            \"warm_fresh_overlap_sample_indexes\": overlap_sample_indexes,\n            \"maximum_transition_span_seconds\": max(transition_spans, default=0),\n            \"unbounded_transition\": unbounded_transition,\n            \"peak_sample_attribution_complete\": bool(\n                peak_row and peak_row[\"attribution_complete\"]\n            ),\n            \"errors\": list(outcome.errors),\n            \"collector_total_sample_wall_seconds\": sum(row[\"sample_duration_seconds\"] for row in rows),\n            \"collector_total_thread_cpu_seconds\": sum(row[\"collector_thread_cpu_seconds\"] for row in rows),\n            \"collector_max_sample_wall_seconds\": max((row[\"sample_duration_seconds\"] for row in rows), default=0),\n            \"collector_output_bytes\": self.output.stat().st_size,\n            \"collector_committed_spool_bytes\": committed_bytes,\n            \"collector_commit_protocol\": \"flushed spool prefix sealed at stop\",\n            \"collector_retains_compact_in_memory_summary_only\": True,\n            \"controller_pss_baseline_bytes\": controller_pss[0] if controller_pss else None,\n            \"controller_pss_maximum_bytes\": max(known_controller_pss, default=None),\n            \"collector_memory_cost_isolated\": False,\n            \"collector_inprocess_memory_included_in_controller_pss\": True,\n            \"collector_memory_cost_limit\": \"controller PSS also includes driver allocations\",\n            \"pss_collected_within_sample_window\": True,\n            \"pss_reading_is_atomic\": False,\n            \"pss_class_maxima_are_not_additive\": True,\n            \"diagnostic_unattributed_is_cache\": False,\n            \"guard_source\": \"unchanged q04 worker telemetry\",\n        }\n        with self.summary.open(\"x\") as stream:\n            json.dump(payload, stream, indent=2, sort_keys=True)\n            stream.write(\"\\n\")\n        return outcome\n"
      }
