        "__init__.py": "\"\"\"Internal PDF execution seams; no canonical delivery contract is implied.\"\"\"\n",
        "compatibility.py": "\"\"\"Internal v2 dependency contract. Full observed provenance is never projected away.\n\nUnknown runtime dependencies stay conservative. Only dependencies known to be\ninactive in native parsing or confined to transport/tooling are omitted.\n\"\"\"\nimport copy\n\nCONTRACT = 'pdf-stage-dependencies-v2'\n_TRANSPORT = {'boto3', 'botocore', 's3transfer', 'temporalio', 'pytest', 'pyright', 'pip', 'uv'}\n_NATIVE_INACTIVE = {'rapidocr', 'onnxruntime', 'coloredlogs', 'humanfriendly', 'pyclipper'}\n_NATIVE_ONLY = {'docling', 'docling-core', 'docling-parse', 'docling-ibm-models',\n                'torch', 'torchvision', 'transformers', 'safetensors', 'tokenizers'}\n_FILES = {\n    'group': ('continuation.py', 'parse.py', 'execution.py', 'compatibility.py', 'supervision.py', 'warm_child.py'),\n    'assembly': ('continuation.py', 'parse.py', 'execution.py', 'compatibility.py', 'supervision.py'),\n    'selection': ('enrichment.py', 'processing.py', 'compatibility.py'),\n    'ocr': ('ocr.py', 'enrichment.py', 'processing.py', 'execution.py', 'compatibility.py'),\n    'evidence': ('relationships.py', 'relationship_method.py', 'evidence.py', 'enrichment.py', 'processing.py', 'execution.py', 'compatibility.py'),\n    'finalize': ('relationships.py', 'relationship_method.py', 'evidence.py', 'enrichment.py', 'processing.py', 'compatibility.py'),\n}\n\n\ndef parsing_method(method):\n    value = copy.deepcopy(method)\n    if value['format'] != 'PROTOTYPE-page-v1':\n        raise ValueError('unsupported_checkpoint_format')\n    ignored = set(_TRANSPORT)\n    if value['options']['do_ocr'] is False:\n        ignored.update(_NATIVE_INACTIVE)\n        value['model_artifacts'] = {k: v for k, v in value['model_artifacts'].items()\n                                    if not k.startswith('rapidocr/')}\n        value['options'].pop('ocr_options', None)\n        value['option_types'].pop('ocr_options', None)\n    value['packages'] = {k: v for k, v in value['packages'].items()\n                         if k.lower().replace('_', '-') not in ignored}\n    return value\n\n\ndef enrichment_runtime(method, ocr):\n    # Both children consume serialized JSON, not Docling models. OCR is fixed to\n    # ONNX; evidence only renders regions. Unknown packages remain conservative.\n    ignored = _TRANSPORT | _NATIVE_ONLY | (set() if ocr else _NATIVE_INACTIVE)\n    return {'python': method['python'], 'platform': method['platform'],\n            'packages': {k: v for k, v in method['packages'].items()\n                         if k.lower().replace('_', '-') not in ignored},\n            'model_artifacts': {k: v for k, v in method['model_artifacts'].items()\n                                if ocr and k.startswith('rapidocr/')}}\n\n\ndef methods_match(saved, current, scoped=False):\n    return parsing_method(saved) == parsing_method(current) if scoped else saved == current\n\n\ndef dependencies(stage, profile, producer):\n    \"\"\"Closed stage vocabulary; new output-affecting code belongs in this contract.\"\"\"\n    result = {'contract': CONTRACT, 'stage': stage,\n              'producer': {name: producer[name] for name in _FILES[stage] if name in producer}}\n    if stage in ('group', 'assembly'):\n        result['method'] = parsing_method(profile['method'])\n    elif stage == 'selection':\n        result['policy'] = 'all-picture-items-v1'\n    elif stage == 'ocr':\n        result['method'] = enrichment_runtime(profile['method'], True)\n        result['policy'] = profile.get('picture_ocr', {'render_scale': 3})\n    elif stage == 'evidence':\n        result['method'] = enrichment_runtime(profile['method'], False)\n        result['policy'] = profile.get('content_evidence', {'version': 'typed-source-evidence-v1', 'reviews': {}})\n    elif stage == 'finalize':\n        result['policy'] = 'required-work-barrier-v3'\n        if profile.get('content_evidence', {}).get('version') == 'typed-source-relationships-v2':\n            result['policy'] = {'version': 'required-relationships-barrier-v1',\n                                'evidence': profile['content_evidence']}\n    return result\n",
        "continuation.py": "\"\"\"Versioned, bounded continuation policy; no upstream package mutation.\n\nConservative column-edge continuation, not general paragraph discovery. Thresholds\nare explicit bounded policy, not trained/qualified universal document geometry.\n\"\"\"\nimport re\nfrom collections import Counter\nfrom docling_core.types.doc import CoordOrigin\nfrom docling_ibm_models.reading_order.reading_order_rb import ReadingOrderPredictor\n\nMETHOD = 'column-edge-continuation-v1'\n\n\ndef geometry(e):\n    if e.coord_origin != CoordOrigin.BOTTOMLEFT:\n        raise ValueError('continuation_requires_bottom_left_coordinates')\n    w, h = e.page_size.width, e.page_size.height\n    if w <= 0 or h <= 0:\n        raise ValueError('invalid_page_size')\n    return e.l / w, 1 - e.t / h, e.r / w, 1 - e.b / h\n\n\ndef boundary_pair(a, b):\n    al, at, ar, ab = geometry(a)\n    bl, bt, br, bb = geometry(b)\n    aw, bw = ar - al, br - bl\n    if min(aw, bw) < .2 or min(aw, bw) / max(aw, bw) < .65:\n        return False\n    if ab < .8 or bt > .25:\n        return False\n    if b.page_no == a.page_no + 1:\n        return abs(al - bl) <= .06 and abs(ar - br) <= .06\n    return b.page_no == a.page_no and ar < bl\n\n\ndef predict_merges(ordered):\n    \"\"\"Return disjoint ordered chains; preserve input elements, labels and text.\n\n    A non-text first item at a column entrance blocks continuation. Margin-sized\n    items cannot win a body-column match. Ambiguous targets/owners yield no edge.\n    \"\"\"\n    edges = {}\n    for a in ordered:\n        if a.label != 'text' or not re.fullmatch(r'.+([a-z,\\-\\u00AD])\\s*', a.text):\n            continue\n        al, _, ar, ab = geometry(a)\n        if any(c.page_no == a.page_no and c.cid != a.cid\n               and c.label not in ('page_header', 'page_footer', 'footnote')\n               and geometry(c)[3] > ab\n               and min(geometry(c)[2], ar)-max(geometry(c)[0], al) > .5*(ar-al)\n               for c in ordered):\n            continue\n        candidates = [b for b in ordered if b.cid != a.cid and boundary_pair(a, b)\n                      and b.label not in ('page_header', 'page_footer', 'footnote')]\n        # Select the first geometric column entrance, regardless of text label.\n        if not candidates:\n            continue\n        rank = lambda b: (b.page_no, geometry(b)[0] if b.page_no == a.page_no else 0, geometry(b)[1])\n        candidates.sort(key=rank)\n        b = candidates[0]\n        if len(candidates) > 1 and rank(b) == rank(candidates[1]):\n            continue\n        # A wider/narrower header or container above the selected text is a barrier.\n        bl, bt, br, bb = geometry(b)\n        if any(c.page_no == b.page_no\n               and min(br, geometry(c)[2]) > max(bl, geometry(c)[0])\n               and min(bb, geometry(c)[3]) > max(bt, geometry(c)[1])\n               for c in candidates[1:]):\n            continue\n        blockers = [c for c in ordered if c.page_no == b.page_no and c.cid != b.cid\n                    and c.label not in ('page_header', 'page_footer', 'footnote')\n                    and geometry(c)[1] <= bt\n                    and min(geometry(c)[2], br)-max(geometry(c)[0], bl) > .5*(br-bl)]\n        if blockers:\n            continue\n        if b.label == 'text' and re.fullmatch(r'\\s*[a-zA-Z\\u00C0-\\u024F].+', b.text):\n            edges[a.cid] = b.cid\n    # Retain upstream inline joins. Only page/column transitions are replaced.\n    by_id = {e.cid: e for e in ordered}\n    for root, members in ReadingOrderPredictor().predict_merges(ordered).items():\n        for left, right in zip([root, *members], members):\n            a, b = by_id[left], by_id[right]\n            if (a.page_no == b.page_no and a.r < b.l\n                    and min(a.t, b.t) > max(a.b, b.b)):\n                edges[left] = right\n    owners = Counter(edges.values())\n    edges = {a: b for a, b in edges.items() if owners[b] == 1}\n    targets = set(edges.values())\n    chains = {}\n    for a in edges.keys() - targets:\n        chain = []\n        b = a\n        while b in edges:\n            b = edges[b]\n            chain.append(b)\n        chains[a] = chain\n    return chains\n\n\nclass ContinuationPredictor(ReadingOrderPredictor):\n    \"\"\"Instance-scoped adapter retaining upstream order, captions and footnotes.\"\"\"\n\n    def predict_merges(self, sorted_elements):\n        return predict_merges(sorted_elements)\n",
        "enrichment.py": "\"\"\"Persisted required PictureItem OCR and complete processing-result validation.\n\nThis internal contract does not grant canonical acceptance or downstream delivery.\n\"\"\"\nimport asyncio\nimport json\nfrom pathlib import Path\nimport tempfile\n\nfrom .object_store import digest\nfrom .compatibility import dependencies\n\n\ndef validate_coverage(selected, outcomes):\n    actual = [item['component'] for item in outcomes]\n    if len(actual) != len(set(actual)) or set(actual) != set(selected):\n        raise ValueError('incomplete_required_components')\n    return 'complete' if selected else 'not_applicable'\n\n\nclass Enrichment:\n    def __init__(self, processing):\n        self.processing = processing\n        self.store = processing.store\n\n    def read(self, identity, name):\n        from .processing import reject\n        manifest = self.store.resolve(identity)\n        if manifest is None:\n            reject('required_registration_missing', 'integrity')\n        entries = [item for item in manifest['files'] if item['name'] == name]\n        if len(entries) != 1:\n            reject('required_artifact_missing', 'integrity')\n        data = self.store.read_artifact(entries[0])\n        return json.loads(data)\n\n    async def run(self, value):\n        from .processing import encoded, observed, reject\n        from .execution import Execution, SourceRequest\n        plan = await asyncio.to_thread(self.processing.load_plan, value['plan'])\n        stage = value['stage']\n        if stage == 'select':\n            parsed_id = value['parsed_result']\n            parsed = await asyncio.to_thread(self.read, parsed_id, 'parsed-result.json')\n            if parsed['plan'] != value['plan'] or parsed['source'] != plan['request']:\n                reject('parsed_source_mismatch', 'integrity')\n            document = await asyncio.to_thread(self.read, parsed['assembly'], 'document.json')\n            candidates = []\n            for picture in document.get('pictures', []):\n                # Even unsupported geometry is selected and must fail explicitly at crop validation.\n                candidates.append({'component': picture['self_ref'], 'selected': True,\n                                   'reason': 'required_picture_v1', 'provenance': picture.get('prov', [])})\n            selected = [c['component'] for c in candidates if c['selected']]\n            if len(selected) != len(set(selected)):\n                reject('duplicate_component', 'integrity')\n            selection = {'version': 1, 'rule': 'all-picture-items-v1', 'plan': value['plan'],\n                'parsed_result': parsed_id, 'assembly': parsed['assembly'], 'source': plan['request'],\n                'parsed_sha256': digest(encoded(document)), 'candidates': candidates, 'selected': selected,\n                'excluded': [{'kind': 'page_render', 'reason': 'not_a_picture_item'}],\n                'dependencies': dependencies('selection', plan['profile'], plan['producer']),\n                'ocr_method': dependencies('ocr', plan['profile'], plan['producer']), 'concurrency': 1}\n            identity = 'pdf-selection-v1:' + digest(encoded(selection))\n            await asyncio.to_thread(self.store.publish, identity, {'selection.json': encoded(selection)})\n            return {'operation': identity, 'selected': selected, 'observed_at': observed()}\n        selection = await asyncio.to_thread(self.read, value['selection'], 'selection.json')\n        if selection['plan'] != value['plan'] or selection['source'] != plan['request']:\n            reject('selection_source_mismatch', 'integrity')\n        if stage == 'component_ocr':\n            component = value['component']\n            if component not in selection['selected']:\n                reject('component_outside_selection', 'integrity')\n            identity = 'pdf-component-v1:' + digest(encoded({'selection': value['selection'], 'component': component}))\n            reused = await asyncio.to_thread(self.store.resolve, identity) is not None\n            if not reused:\n                with tempfile.TemporaryDirectory(prefix='ocr-', dir=self.processing.scratch) as tmp:\n                    root = Path(tmp)\n                    request = plan['request']\n                    pdf = root/request['artifact']['name']\n                    await asyncio.to_thread(self.processing.read_source, request, pdf)\n                    source = SourceRequest(pdf, request['source_revision'], request['artifact']['sha256'],\n                                           plan['profile']['method'], self.processing.model_cache)\n                    execution = Execution(source, self.store, root, child_timeout=plan['limits']['child_seconds'])\n                    await asyncio.to_thread(execution.materialize, selection['assembly'], root/'parsed')\n                    await execution.child('pdf_processing.ocr', {'parsed': str(root/'parsed'/'document.json'),\n                        'pdf': str(pdf), 'out': str(root/'result'), 'component': component,\n                        'max_render_pixels': plan['limits']['max_page_pixels'],\n                        'allow_cropbox': request['version'] == 3,\n                        'scale': plan['profile'].get('picture_ocr', {'render_scale': 3})['render_scale']}, root)\n                    report = json.loads((root/'result'/'ocr.json').read_text())\n                    if (report['source_sha256'] != request['artifact']['sha256'] or report['component'] != component\n                            or report['parsed_result_sha256'] != digest((root/'parsed'/'document.json').read_bytes())):\n                        reject('ocr_source_mismatch', 'integrity')\n                    expected_models = {k.split('/')[-1]: v for k, v in plan['profile']['method']['model_artifacts'].items() if k.startswith('rapidocr/')}\n                    producer = report['producer']\n                    if (producer['model_sha256'] != expected_models\n                            or producer['version'] != plan['profile']['method']['packages']['rapidocr']\n                            or producer['backend'] != 'onnxruntime '+plan['profile']['method']['packages']['onnxruntime']):\n                        reject('ocr_method_mismatch', 'method')\n                    candidate = next(c for c in selection['candidates'] if c['component'] == component)\n                    if candidate['provenance'] != [report['provenance']]:\n                        reject('ocr_region_mismatch', 'integrity')\n                    report.update(version=1, selection=value['selection'], parsed_result=selection['parsed_result'],\n                        assembly=selection['assembly'], source=request, method=selection['ocr_method'],\n                        outcome='text_detected' if report['texts'] else 'no_text_detected',\n                        quality_accepted=False)\n                    (root/'result'/'ocr.json').write_bytes(encoded(report))\n                    await asyncio.to_thread(self.store.publish, identity,\n                        {p.name: p.read_bytes() for p in (root/'result').iterdir() if p.is_file()})\n            report = await asyncio.to_thread(self.read, identity, 'ocr.json')\n            return {'operation': identity, 'component': component, 'outcome': report['outcome'],\n                    'stage': 'component_ocr', 'reused': reused, 'observed_at': observed()}\n        outcomes = []\n        for identity in value['outcomes']:\n            report = await asyncio.to_thread(self.read, identity, 'ocr.json')\n            if (report['selection'] != value['selection'] or report['source'] != plan['request']\n                    or report['method'] != selection['ocr_method'] or report['parsed_result'] != selection['parsed_result']\n                    or report['outcome'] not in ('text_detected', 'no_text_detected')):\n                reject('ocr_attribution_mismatch', 'integrity')\n            registration = await asyncio.to_thread(self.store.resolve, identity)\n            crops = [f for f in registration['files'] if f['name'] == 'figure.png']\n            if len(crops) != 1 or crops[0]['sha256'] != report['crop_sha256']:\n                reject('ocr_crop_reference_invalid', 'integrity')\n            outcomes.append({'component': report['component'], 'operation': identity, 'outcome': report['outcome']})\n        try:\n            coverage = validate_coverage(selection['selected'], outcomes)\n        except ValueError:\n            reject('incomplete_required_components', 'integrity')\n        parsed = await asyncio.to_thread(self.read, selection['parsed_result'], 'parsed-result.json')\n        document = await asyncio.to_thread(self.read, selection['assembly'], 'document.json')\n        if digest(encoded(document)) != selection['parsed_sha256']:\n            reject('selection_parsed_version_mismatch', 'integrity')\n        if sorted(int(n) for n in document['pages']) != list(range(1, plan['pages']+1)):\n            reject('incomplete_page_coverage', 'integrity')\n        if parsed['plan'] != value['plan'] or parsed['source'] != plan['request'] or len(parsed['page_groups']) != len(plan['groups']):\n            reject('parsed_plan_mismatch', 'integrity')\n        for group, (start, end) in zip(parsed['page_groups'], plan['groups']):\n            complete = await asyncio.to_thread(self.read, group, 'complete.json')\n            checkpoints = [await asyncio.to_thread(self.read, group, 'checkpoints/'+p['file']) for p in complete['pages']]\n            if (complete['source_sha256'] != plan['request']['artifact']['sha256']\n                    or [p['page_no'] for p in checkpoints] != list(range(start, end+1))):\n                reject('page_group_coverage_mismatch', 'integrity')\n        final = {'version': 1, 'status': 'complete', 'processing_complete': True, 'canonical_accepted': False,\n            'plan': value['plan'], 'source': plan['request'], 'parsed_result': selection['parsed_result'],\n            'assembly': selection['assembly'], 'selection': value['selection'], 'enrichments': outcomes,\n            'required_work': {'pages': plan['pages'], 'components': len(outcomes), 'ocr': coverage},\n            'quality_accepted': False,\n            'dependencies': dependencies('finalize', plan['profile'], plan['producer']),\n            'provenance': {'profile': plan['profile'], 'producer': plan['producer']}}\n        if plan['request']['version'] == 3:\n            final['version'] = 2\n            final['content_evidence'] = await self.content_evidence(plan, selection, document)\n            if plan['profile'].get('content_evidence', {}).get('version') == 'typed-source-relationships-v2':\n                final['relationships'] = await self.relationship_evidence(plan, selection, document, final['content_evidence'])\n                final['required_work']['relationships'] = 'finished'\n        identity = 'pdf-complete-v1:' + digest(encoded(final))\n        await asyncio.to_thread(self.store.publish, identity, {'processing-result.json': encoded(final)})\n        return {'operation': identity, 'stage': 'finalize', 'observed_at': observed()}\n\n    async def content_evidence(self, plan, selection, document):\n        from .processing import encoded\n        from .execution import Execution, SourceRequest\n        policy = plan['profile'].get('content_evidence', {'version': 'typed-source-evidence-v1', 'reviews': {}})\n        request = plan['request']\n        review = policy.get('reviews', {}).get(request['artifact']['sha256'], {})\n        identity = 'pdf-evidence-v1:' + digest(encoded({'assembly': selection['assembly'],\n            'parsed_result': selection['parsed_result'], 'source': request, 'policy': policy,\n            'dependencies': dependencies('evidence', plan['profile'], plan['producer'])}))\n        if await asyncio.to_thread(self.store.resolve, identity) is not None:\n            return identity\n        with tempfile.TemporaryDirectory(prefix='activity-evidence-', dir=self.processing.scratch) as tmp:\n            root = Path(tmp)\n            # Separate fixed scratch paths: a client filename such as original.pdf\n            # must not alias the retained original source during derivative checks.\n            pdf = root/'source.pdf'\n            await asyncio.to_thread(self.processing.read_source, request, pdf)\n            original = review.get('original_source')\n            original_path = root/'original.pdf'\n            if original:\n                await asyncio.to_thread(self.processing.read_source, original, original_path)\n            parsed_path = root/'document.json'\n            registration = await asyncio.to_thread(self.store.resolve, selection['assembly'])\n            entry = next(f for f in registration['files'] if f['name'] == 'document.json')\n            parsed_path.write_bytes(await asyncio.to_thread(self.store.read_artifact, entry))\n            source = SourceRequest(pdf, request['source_revision'], request['artifact']['sha256'],\n                                   plan['profile']['method'], self.processing.model_cache)\n            execution = Execution(source, self.store, root, child_timeout=plan['limits']['child_seconds'])\n            await execution.child('pdf_processing.evidence', {'pdf': str(pdf), 'parsed': str(parsed_path),\n                'out': str(root/'result'), 'source': request, 'parsed_result': selection['parsed_result'],\n                'assembly': selection['assembly'], 'review': review, 'policy': policy['version'],\n                'relationships': policy.get('relationships'),\n                'original_pdf': str(original_path) if original else None,\n                'renderer_version': plan['profile']['method']['packages']['pypdfium2'],\n                'max_render_pixels': plan['limits']['max_page_pixels']}, root)\n            files = {p.name: p.read_bytes() for p in (root/'result').iterdir() if p.is_file()}\n            files['source.pdf'] = pdf.read_bytes()\n            if original:\n                files['original-source.pdf'] = original_path.read_bytes()\n            await asyncio.to_thread(self.store.publish, identity, files)\n        await asyncio.to_thread(self.store.resolve, identity)\n        return identity\n\n\n    async def relationship_evidence(self, plan, selection, document, evidence_id):\n        from .processing import encoded, reject\n        from .relationships import validate\n        policy = plan['profile']['content_evidence']['relationships']\n        report = await asyncio.to_thread(self.read, evidence_id, 'relationships.json')\n        content = await asyncio.to_thread(self.read, evidence_id, 'content-evidence.json')\n        try:\n            assembly = await asyncio.to_thread(self.store.resolve, selection['assembly'])\n            documents = [f for f in assembly['files'] if f['name'] == 'document.json']\n            if len(documents) != 1:\n                raise ValueError('relationship_assembly_document_missing')\n            # Evidence hashes the retained serialized artifact, not a re-encoding.\n            if (content['source'] != plan['request'] or content['parsed_result'] != selection['parsed_result']\n                    or content['assembly'] != selection['assembly']\n                    or content['policy'] != plan['profile']['content_evidence']['version']\n                    or content['document_sha256'] != documents[0]['sha256']):\n                raise ValueError('relationship_evidence_attribution_mismatch')\n            validate(report, document, plan['request'], selection['parsed_result'], selection['assembly'], policy)\n            # Store.resolve verifies every retained page/source byte, including reuse.\n            registration = await asyncio.to_thread(self.store.resolve, evidence_id)\n            files = {f['name']: f for f in registration['files']}\n            if files['source.pdf']['sha256'] != plan['request']['artifact']['sha256']:\n                raise ValueError('relationship_retained_source_mismatch')\n            if set(content['pages']) != set(document['pages']):\n                raise ValueError('relationship_page_evidence_missing')\n            for page in content['pages'].values():\n                if files[page['artifact']]['sha256'] != page['sha256']:\n                    raise ValueError('relationship_page_evidence_mismatch')\n            representation_evidence = None\n            if 'representation' in policy:\n                representation_evidence = await asyncio.to_thread(\n                    self.representation_evidence, report, content, files, document)\n        except (ValueError, KeyError, TypeError, IndexError) as error:\n            reject(str(error), 'integrity')\n        binding = {'version': 1, 'content_evidence': evidence_id, 'relationships': report,\n                   'dependencies': dependencies('evidence', plan['profile'], plan['producer'])}\n        if representation_evidence is not None:\n            binding['representation_evidence'] = representation_evidence\n        identity = 'pdf-relationships-v1:' + digest(encoded(binding))\n        await asyncio.to_thread(self.store.publish, identity, {'relationships.json': encoded(binding)})\n        # Resolve the authoritative winner, even after a concurrent publication.\n        accepted = await asyncio.to_thread(self.read, identity, 'relationships.json')\n        if accepted != binding:\n            reject('relationship_registration_conflict', 'integrity')\n        return identity\n\n    def representation_evidence(self, report, content, files, document):\n        \"\"\"Readable local source views; isolated glyphs only get full-page context.\"\"\"\n        import io\n        import math\n        from PIL import Image\n        checked = set()\n        result = []\n        for relation in report['resolved']:\n            representation = relation['representation']\n            locators = [representation['evidence']] + [s['evidence'] for s in representation['isolated_symbols']]\n            views = []\n            for locator in locators:\n                number = locator['page']\n                page = content['pages'][str(number)]\n                size = document['pages'][str(number)]['size']\n                expected_size = [math.ceil(size['width']*3), math.ceil(size['height']*3)]\n                if (type(page['physical_page']) is not int or page['physical_page'] != number\n                        or page['size_points'] != [size['width'], size['height']]\n                        or page['pixel_dimensions'] != expected_size or page['renderer']['scale'] != 3):\n                    raise ValueError('representation_page_attribution_mismatch')\n                if number not in checked:\n                    data = self.store.read_artifact(files[page['artifact']])\n                    try:\n                        with Image.open(io.BytesIO(data)) as image:\n                            if image.format != 'PNG' or list(image.size) != expected_size:\n                                raise ValueError('representation_page_geometry_mismatch')\n                            image.verify()\n                        # PNG.verify checks chunk integrity, not pixel decoding.\n                        with Image.open(io.BytesIO(data)) as image:\n                            image.load()\n                    except (OSError, SyntaxError) as error:\n                        raise ValueError('representation_source_evidence_unreadable') from error\n                    checked.add(number)\n                views.append({**locator, 'page_artifact': page['artifact'], 'page_sha256': page['sha256'],\n                              'crop_recipe': {'scale': 3, 'box_pixels': [x*3 for x in locator['box']]}})\n            result.append({'relationship': relation['id'], 'review_id': representation['review_id'], 'views': views})\n        return result\n",
        "evidence.py": "\"\"\"Source-backed typed content; no text rewriting or formula interpretation.\n\nExecuted in a bounded fresh child. The original document remains the authority\nfor typed content; this manifest adds traversal, region evidence and reviewed\nobservations without making traversal order into a reading-order guarantee.\n\"\"\"\nimport hashlib\nimport json\nimport math\nfrom pathlib import Path\nimport sys\nimport unicodedata\n\n\ndef graph_items(document):\n    nodes = {}\n    for key in ('body', 'furniture'):\n        if document.get(key):\n            node = document[key]\n            nodes[node['self_ref']] = node\n    for key in ('groups', 'texts', 'pictures', 'tables', 'key_value_items', 'form_items'):\n        for node in document.get(key, []):\n            if node['self_ref'] in nodes:\n                raise ValueError('duplicate_typed_reference')\n            nodes[node['self_ref']] = node\n    ordered, visited, active = [], set(), set()\n    def visit(ref):\n        if ref in active:\n            raise ValueError('cyclic_typed_children')\n        if ref in visited:\n            return\n        if ref not in nodes:\n            raise ValueError('missing_typed_reference')\n        active.add(ref)\n        node = nodes[ref]\n        for key in ('parent',):\n            if node.get(key) and node[key]['$ref'] not in nodes:\n                raise ValueError('missing_typed_reference')\n        for caption in node.get('captions', []):\n            if caption['$ref'] not in nodes:\n                raise ValueError('missing_caption_reference')\n        ordered.append(node)\n        for child in node.get('children', []):\n            visit(child['$ref'])\n        active.remove(ref)\n        visited.add(ref)\n    for root in ('body', 'furniture'):\n        if document.get(root):\n            visit(document[root]['self_ref'])\n    # Preserve unlinked typed content as well; do not silently hide it from callers.\n    for ref in nodes:\n        visit(ref)\n    return ordered\n\n\ndef top_left(box, width, height, *, allow_zero_width=False):\n    if box['coord_origin'] == 'BOTTOMLEFT':\n        result = [box['l'], height-box['t'], box['r'], height-box['b']]\n    elif box['coord_origin'] == 'TOPLEFT':\n        result = [box['l'], box['t'], box['r'], box['b']]\n    else:\n        raise ValueError('unknown_coordinate_origin')\n    if not all(math.isfinite(x) for x in result):\n        raise ValueError('invalid_region')\n    horizontal = 0 <= result[0] < result[2] <= width\n    if allow_zero_width and 0 <= result[0] == result[2] <= width:\n        horizontal = True\n    if not (horizontal and 0 <= result[1] < result[3] <= height):\n        raise ValueError('region_outside_page')\n    return result\n\n\ndef overlap(a, b):\n    area = max(0, min(a[2], b[2])-max(a[0], b[0])) * max(0, min(a[3], b[3])-max(a[1], b[1]))\n    source_area = (a[2]-a[0])*(a[3]-a[1])\n    return area / source_area if source_area > 0 else 0\n\n\ndef execute(request):\n    import pypdfium2 as pdfium\n    from .execution import ChildFailure\n    from .processing import encoded\n    out = Path(request['out'])\n    out.mkdir(parents=True, exist_ok=True)\n    try:\n        parsed_path = Path(request['parsed'])\n        document = json.loads(parsed_path.read_text())\n        items = graph_items(document)\n        from .relationships import POLICY, build\n        if request['policy'] not in ('typed-source-evidence-v1', POLICY):\n            raise ValueError('unsupported_evidence_policy')\n        review = request['review']\n        if review and review['source_sha256'] != request['source']['artifact']['sha256']:\n            raise ValueError('review_source_mismatch')\n        pages, records, geometry_observations = {}, [], []\n        with pdfium.PdfDocument(request['pdf']) as pdf:\n            for number in sorted(int(n) for n in document['pages']):\n                page = pdf[number-1]\n                try:\n                    width, height = page.get_size()\n                    if page.get_rotation() != 0:\n                        raise ValueError('unsupported_evidence_rotation')\n                    size = document['pages'][str(number)]['size']\n                    if abs(width-size['width']) > .01 or abs(height-size['height']) > .01:\n                        raise ValueError('evidence_page_size_mismatch')\n                    scale = 3\n                    if math.ceil(width*scale)*math.ceil(height*scale) > request['max_render_pixels']:\n                        raise ValueError('evidence_pixel_limit')\n                    bitmap = page.render(scale=scale)\n                    image = bitmap.to_pil().copy()\n                    bitmap.close()\n                    if request.get('original_pdf'):\n                        original_number = review['original_pages'][str(number)]\n                        with pdfium.PdfDocument(request['original_pdf']) as original_pdf:\n                            if type(original_number) is not int or not 1 <= original_number <= len(original_pdf):\n                                raise ValueError('invalid_original_page_number')\n                            original_page = original_pdf[original_number-1]\n                            try:\n                                ow, oh = original_page.get_size()\n                                if (not all(math.isfinite(v) and v > 0 for v in (ow, oh)) or\n                                        math.ceil(ow*scale)*math.ceil(oh*scale) > request['max_render_pixels']):\n                                    raise ValueError('original_evidence_pixel_limit')\n                                if original_page.get_rotation() != 0 or abs(ow-width) > .01 or abs(oh-height) > .01:\n                                    raise ValueError('original_page_geometry_mismatch')\n                                original_bitmap = original_page.render(scale=scale)\n                                try:\n                                    original_image = original_bitmap.to_pil()\n                                    if original_image.size != image.size or original_image.tobytes() != image.tobytes():\n                                        raise ValueError('original_page_mapping_mismatch')\n                                finally:\n                                    original_bitmap.close()\n                            finally:\n                                original_page.close()\n                    filename = f'page-{number}.png'\n                    image.save(out/filename)\n                    pages[str(number)] = {'artifact': filename, 'sha256': hashlib.sha256((out/filename).read_bytes()).hexdigest(),\n                        'physical_page': number, 'original_physical_page': review.get('original_pages', {}).get(str(number), number),\n                        'size_points': [width, height], 'pixel_dimensions': list(image.size), 'rotation': 0,\n                        'pdf_effective_box': list(page.get_bbox()), 'cropbox': list(page.get_cropbox() or page.get_bbox()),\n                        'renderer': {'engine': 'pypdfium2', 'version': request['renderer_version'],\n                                     'scale': scale, 'coordinate_space': 'page-local TOPLEFT PDF points'}}\n                    image.close()\n                finally:\n                    page.close()\n        for node in items:\n            record = {'ref': node['self_ref'], 'actual_type': node.get('label', 'group'),\n                'collection': node['self_ref'].split('/')[1], 'text': node.get('text'), 'parent': node.get('parent'), 'children': node.get('children', []),\n                'captions': node.get('captions', []), 'regions': [],\n                'representation': 'not_independently_validated', 'text_empty': node.get('text') == ''}\n            for prov in node.get('prov', []):\n                page = pages[str(prov['page_no'])]\n                # Some PDF fonts expose a combining slash as a separate zero-width\n                # TextItem. Preserve it; never turn the neighboring '=' into '≠'.\n                text = node.get('text')\n                combining = (record['actual_type'] == 'text' and isinstance(text, str)\n                             and bool(text) and all(unicodedata.combining(c) for c in text))\n                box = top_left(prov['bbox'], *page['size_points'], allow_zero_width=combining)\n                region = {'page': prov['page_no'], 'provenance': prov,\n                    'bbox_top_left_points': box, 'page_artifact': page['artifact'],\n                    'page_sha256': page['sha256'], 'crop_recipe': {'scale': 3, 'box_pixels': [x*3 for x in box]}}\n                if box[0] == box[2]:\n                    # The reported line is not a usable crop. Full-page evidence\n                    # avoids inventing a glyph width or associating it to a neighbor.\n                    width, height = page['size_points']\n                    region['geometry_status'] = 'zero_width_combining_mark'\n                    region['crop_recipe'] = {'scale': 3, 'box_pixels': [0, 0, width*3, height*3],\n                                             'scope': 'full_page_context'}\n                    geometry_observations.append({'origin': 'parser_zero_width_combining_mark',\n                        'refs': [node['self_ref']], 'regions': [region],\n                        'status': 'textual_or_mathematical_representation_unconfirmed',\n                        'reason': 'Isolated combining mark has zero-width parser provenance; precise localization and glyph association are unconfirmed. Full-page source context retained.',\n                        'text_rewritten': False})\n                record['regions'].append(region)\n            records.append(record)\n        if any(r['actual_type'] == 'formula' and not r['regions'] for r in records):\n            raise ValueError('formula_evidence_missing')\n        review_ids = [a['id'] for a in review.get('regions', [])]\n        if len(review_ids) != len(set(review_ids)):\n            raise ValueError('duplicate_review_id')\n        formulas = [{'refs': [r['ref']], 'classification': 'parser_formula_label', 'regions': r['regions'],\n                     'interpretation': 'not_performed'} for r in records if r['actual_type'] == 'formula']\n        observations = geometry_observations\n        for annotation in review.get('regions', []):\n            page = pages[str(annotation['page'])]\n            box = top_left(annotation['bbox'], *page['size_points'])\n            refs = [r['ref'] for r in records if any(g['page'] == annotation['page'] and\n                    (overlap(box, g['bbox_top_left_points']) >= .5 or\n                     (annotation['kind'] == 'representation' and overlap(g['bbox_top_left_points'], box) >= .5))\n                    for g in r['regions'])]\n            if not refs:\n                raise ValueError('review_region_has_no_typed_content')\n            evidence = {'page': annotation['page'], 'bbox_top_left_points': box,\n                        'page_artifact': page['artifact'], 'page_sha256': page['sha256'],\n                        'crop_recipe': {'scale': 3, 'box_pixels': [x*3 for x in box]}}\n            if annotation['kind'] == 'formula':\n                formulas = [f for f in formulas if f['classification'] != 'parser_formula_label' or not (set(f['refs']) & set(refs))]\n                formulas.append({'review_id': annotation['id'], 'refs': refs, 'classification': 'source_reviewed_occurrence',\n                    'regions': [evidence], 'interpretation': 'not_performed', 'actual_types_preserved': True})\n            elif annotation['kind'] == 'representation':\n                observations.append({'review_id': annotation['id'], 'refs': refs, 'regions': [evidence],\n                    'status': 'textual_or_mathematical_representation_unconfirmed', 'reason': annotation['reason'],\n                    'text_rewritten': False})\n            else:\n                raise ValueError('unsupported_review_kind')\n        expected_formula_ids = {a['id'] for a in review.get('regions', []) if a['kind'] == 'formula'}\n        if {f['review_id'] for f in formulas if 'review_id' in f} != expected_formula_ids:\n            raise ValueError('incomplete_reviewed_formula_coverage')\n        manifest = {'version': 1, 'source': request['source'], 'parsed_result': request['parsed_result'],\n            'assembly': request['assembly'], 'document_sha256': hashlib.sha256(parsed_path.read_bytes()).hexdigest(),\n            'policy': request['policy'], 'source_review': review,\n            'retained_source': {'artifact': 'source.pdf', 'sha256': request['source']['artifact']['sha256']},\n            'retained_original': {'artifact': 'original-source.pdf', 'source': review['original_source']} if request.get('original_pdf') else None,\n            'pages': pages, 'items': records,\n            'formula_occurrences': formulas, 'formula_coverage': 'source_reviewed_regions' if review else 'unreviewed',\n            'representation_observations': observations, 'reading_order': 'source-backed; traversal_is_not_reading_order',\n            'note_associations': 'parser_links_only; other_associations_unconfirmed', 'canonical_accepted': False}\n        (out/'content-evidence.json').write_bytes(encoded(manifest))\n        if request['policy'] == POLICY:\n            relationships = build(document, request['source'], request['parsed_result'],\n                                  request['assembly'], request['relationships'])\n            (out/'relationships.json').write_bytes(encoded(relationships))\n    except (ValueError, KeyError, TypeError, IndexError) as error:\n        (out/'failure.json').write_text(json.dumps({'category': 'integrity', 'code': str(error)}))\n        raise ChildFailure('integrity', str(error)) from error\n\nif __name__ == '__main__':\n    execute(json.load(sys.stdin))\n",
        "execution.py": "\"\"\"Request-driven operations over shared artifacts, with fresh child processes.\n\nNo source, client, remote method or storage namespace is bound at import time.\nThis is the T01 seam, not the T02 ingestion workflow or canonical schema.\n\"\"\"\nimport asyncio\nfrom dataclasses import dataclass\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport signal\nimport sys\nimport tempfile\n\nfrom .compatibility import CONTRACT, methods_match\nfrom .object_store import Store, StoreFailure, digest\n\n\n# Owned by this worker's event loop; fresh OCR/preflight/assembly are also children.\n_fresh_children = set()\n\n\nasync def _stop_children(children):\n    first_error = None\n    for process in tuple(children):\n        try:\n            os.killpg(process.pid, signal.SIGKILL)\n        except ProcessLookupError:\n            pass\n        try:\n            await asyncio.wait_for(process.wait(), 5)\n        except TimeoutError as error:\n            if first_error is None:\n                first_error = FreshChildReapFailure('fresh_child_reap_failed')\n                first_error.__cause__ = error\n        else:\n            children.discard(process)\n            _fresh_children.discard(process)\n    if first_error is not None:\n        raise first_error\n\n\nasync def stop_fresh_children():\n    \"\"\"Worker-shutdown backstop for every fresh child in this event loop.\"\"\"\n    await _stop_children(_fresh_children)\n\n\nasync def stop_owned_children(parser, reason='worker_shutdown'):\n    \"\"\"Settle warm and fresh cleanup before propagating the first failure.\"\"\"\n    tasks = []\n    if parser is not None:\n        tasks.append(asyncio.create_task(parser.close(reason)))\n    tasks.append(asyncio.create_task(stop_fresh_children()))\n    settling = asyncio.gather(*tasks, return_exceptions=True)\n    cancelled = None\n    try:\n        results = await asyncio.shield(settling)\n    except asyncio.CancelledError as error:\n        cancelled = error\n        results = await settling\n    for result in results:\n        if isinstance(result, BaseException):\n            raise result\n    if cancelled is not None:\n        raise cancelled\n\n\nclass ChildFailure(RuntimeError):\n    def __init__(self, category, code):\n        super().__init__(code)\n        self.category, self.code = category, code\n\n\nclass FreshChildReapFailure(RuntimeError):\n    \"\"\"A killed fresh child still has not produced a confirmed exit.\"\"\"\n\n\n@dataclass(frozen=True)\nclass SourceRequest:\n    pdf: Path\n    source_revision: str\n    source_sha256: str\n    method: dict\n    model_cache: Path\n    scan: bool = False\n\n\nclass Execution:\n    def __init__(self, source: SourceRequest, store: Store, scratch: Path,\n                 heartbeat=lambda detail: None, child_timeout=540, child_runner=None):\n        self.source, self.store, self.scratch = source, store, scratch\n        self.heartbeat = heartbeat\n        self.child_timeout = child_timeout\n        self.observation = {}\n        self.child_runner = child_runner\n        self.fresh_children = set()\n\n    async def child(self, module, request, out):\n        \"\"\"One request per interpreter; S1 explores safe process reuse separately.\"\"\"\n        if self.child_runner is not None and module == 'pdf_processing.parse' and request.get('mode') == 'capture':\n            self.observation['parser'] = await self.child_runner.run(request, out, self.heartbeat, self.child_timeout)\n            return\n        if self.child_runner is not None and module == 'pdf_processing.parse' and request.get('mode') == 'restore':\n            # The runner owns serialization across every profile queue. Keep\n            # that ownership until the fresh process has exited, not merely\n            # until the previous warm process has been reaped.\n            async with self.child_runner.fresh_child_handoff() as observation:\n                self.observation['parser_handoff'] = observation\n                try:\n                    await self.fresh_child(module, request, out)\n                except FreshChildReapFailure:\n                    # Still inside the shared handoff lock: prevent a later\n                    # profile queue from rebuilding warm capacity around an\n                    # owned fresh process whose exit was not confirmed.\n                    self.child_runner.fail_closed('fresh_child_reap_failed')\n                    raise\n            return\n        await self.fresh_child(module, request, out)\n\n    async def fresh_child(self, module, request, out):\n        with (out/'process.log').open('wb') as log:\n            spawning = asyncio.create_task(asyncio.create_subprocess_exec(\n                sys.executable, '-m', module, stdin=asyncio.subprocess.PIPE,\n                stdout=log, stderr=log, start_new_session=True))\n            try:\n                process = await asyncio.shield(spawning)\n            except asyncio.CancelledError:\n                process = await spawning\n                self.fresh_children.add(process)\n                _fresh_children.add(process)\n                await _stop_children(self.fresh_children)\n                raise\n            self.fresh_children.add(process)\n            _fresh_children.add(process)\n            communication = asyncio.create_task(process.communicate(json.dumps(request).encode()))\n            try:\n                async with asyncio.timeout(self.child_timeout):\n                    while not communication.done():\n                        self.heartbeat({'pid': process.pid, 'durable_completion': False})\n                        await asyncio.wait({communication}, timeout=1)\n                    await communication\n                if process.returncode:\n                    failure = Path(request['out'])/'failure.json'\n                    if failure.is_file():\n                        detail = json.loads(failure.read_text())\n                        raise ChildFailure(detail['category'], detail['code'])\n                    raise RuntimeError('child_process_failed')\n            finally:\n                try:\n                    os.killpg(process.pid, signal.SIGKILL)\n                except ProcessLookupError:\n                    pass\n                try:\n                    await asyncio.wait_for(process.wait(), 5)\n                except TimeoutError as error:\n                    # Retain ownership for worker-shutdown cleanup. Callers\n                    # that coordinate warm capacity must fail closed before\n                    # releasing their handoff lock.\n                    raise FreshChildReapFailure('fresh_child_reap_failed') from error\n                else:\n                    self.fresh_children.discard(process)\n                    _fresh_children.discard(process)\n                finally:\n                    if not communication.done():\n                        communication.cancel()\n                        await asyncio.gather(communication, return_exceptions=True)\n\n    def materialize(self, operation, out):\n        manifest = self.store.resolve(operation)\n        if manifest is None:\n            raise ValueError('Required input operation has not been registered')\n        for item in manifest['files']:\n            name = item['name']\n            if name.startswith('/') or '..' in name.split('/'):\n                raise ValueError('Invalid artifact path')\n            data = self.store.read_artifact(item)\n            path = out/name\n            path.parent.mkdir(parents=True, exist_ok=True)\n            path.write_bytes(data)\n        return manifest\n\n    def verify_group(self, out, start, end, compatibility=None):\n        try:\n            manifest = json.loads((out/'complete.json').read_text())\n            if (manifest['format'] != 'PROTOTYPE-document-v1' or manifest['status'] != 'success'\n                    or manifest['source_sha256'] != self.source.source_sha256\n                    or not methods_match(json.loads((out/'method.json').read_text()), self.source.method, compatibility is not None)\n                    or manifest['method_sha256'] != digest((out/'method.json').read_bytes())):\n                raise ValueError()\n            if compatibility is not None and json.loads((out/'compatibility.json').read_text()) != compatibility:\n                raise ValueError()\n            pages, evidence = [], set()\n            for entry in manifest['pages']:\n                if Path(entry['file']).name != entry['file']:\n                    raise ValueError()\n                path = out/'checkpoints'/entry['file']\n                if digest(path.read_bytes()) != entry['sha256']:\n                    raise ValueError()\n                page = json.loads(path.read_text())\n                visual = page['visual']['file']\n                if (page['format'] != 'PROTOTYPE-page-v1'\n                        or page['method_sha256'] != manifest['method_sha256']\n                        or page['source_sha256'] != manifest['source_sha256']\n                        or Path(visual).name != visual or visual in evidence\n                        or digest((path.parent/visual).read_bytes()) != page['visual']['sha256']\n                        or set(page['assembled']) != {'elements', 'headers', 'body'}\n                        or any(not isinstance(v, list) for v in page['assembled'].values())\n                        or page['size']['width'] <= 0 or page['size']['height'] <= 0):\n                    raise ValueError()\n                evidence.add(visual)\n                pages.append(page['page_no'])\n            if pages != list(range(start, end+1)):\n                raise ValueError()\n            return manifest\n        except (ValueError, KeyError, TypeError, OSError):\n            raise StoreFailure('integrity', 'checkpoint_coverage_invalid') from None\n\n    async def produce(self, operation):\n        source = self.source\n        assert digest(source.pdf.read_bytes()) == source.source_sha256\n        producer = {p.name: digest(p.read_bytes()) for p in Path(__file__).parent.glob('*.py')}\n        identity = digest(json.dumps({'operation': operation, 'source': source.source_sha256,\n            'source_revision': source.source_revision, 'method': source.method, 'producer': producer}, sort_keys=True).encode())\n        scoped = operation.get('contract') == CONTRACT\n        checkpoint = operation['dependencies']['checkpoint'] if scoped else None\n        if scoped:\n            identity = digest(json.dumps(operation, sort_keys=True).encode())\n        if await asyncio.to_thread(self.store.resolve, identity):\n            if scoped:\n                with tempfile.TemporaryDirectory(prefix='reuse-', dir=self.scratch) as tmp:\n                    saved = Path(tmp)\n                    await asyncio.to_thread(self.materialize, identity, saved)\n                    attribution = json.loads((saved/'attribution.json').read_text())\n                    if (attribution['operation'] != operation or attribution['source_revision'] != source.source_revision\n                            or attribution['source_sha256'] != source.source_sha256):\n                        raise StoreFailure('integrity', 'reuse_attribution_mismatch')\n                    if operation['kind'] == 'group':\n                        self.verify_group(saved, operation['start'], operation['end'], checkpoint)\n                    elif (json.loads((saved/'compatibility.json').read_text()) != checkpoint\n                          or not methods_match(json.loads((saved/'method.json').read_text()), source.method, True)):\n                        raise StoreFailure('integrity', 'reuse_method_mismatch')\n            self.observation = {'reused': True}\n            return identity\n        self.observation = {'reused': False}\n        self.scratch.mkdir(parents=True, exist_ok=True)\n        with tempfile.TemporaryDirectory(prefix='pdf-', dir=self.scratch) as tmp:\n            out = Path(tmp)\n            result = out/'result'\n            request = {'pdf': str(source.pdf), 'model_cache': str(source.model_cache),\n                'out': str(result), 'scan': source.scan, 'expected_method': source.method,\n                'checkpoint_compatibility': checkpoint}\n            kind = operation['kind']\n            if kind == 'group':\n                await self.child('pdf_processing.parse', {**request, 'mode': 'capture',\n                    'start': operation['start'], 'end': operation['end'], 'checkpoint_only': True}, out)\n                self.verify_group(result, operation['start'], operation['end'], checkpoint)\n            elif kind == 'assembly':\n                merged = out/'merged'\n                (merged/'checkpoints').mkdir(parents=True)\n                manifest = None\n                for i, group_id in enumerate(operation['groups']):\n                    group = out/'inputs'/str(i)\n                    await asyncio.to_thread(self.materialize, group_id, group)\n                    current = json.loads((group/'complete.json').read_text())\n                    numbers = [json.loads((group/'checkpoints'/p['file']).read_text())['page_no'] for p in current['pages']]\n                    self.verify_group(group, min(numbers), max(numbers), checkpoint)\n                    if manifest is None:\n                        manifest = {**current, 'pages': [], 'confidence': {**current['confidence'], 'pages': {}}}\n                        (merged/'method.json').write_bytes((group/'method.json').read_bytes())\n                        if checkpoint is not None:\n                            (merged/'compatibility.json').write_text(json.dumps(checkpoint))\n                    manifest['confidence']['pages'].update(current['confidence']['pages'])\n                    for path in (group/'checkpoints').iterdir():\n                        target = merged/'checkpoints'/path.name\n                        if target.exists(): raise ValueError('Duplicate checkpoint page')\n                        raw = path.read_bytes()\n                        if path.suffix == '.json' and current['method_sha256'] != manifest['method_sha256']:\n                            # Each original was verified above. Normalize only the transient\n                            # merge envelope; immutable originals retain full environment hashes.\n                            page = json.loads(raw)\n                            page['method_sha256'] = manifest['method_sha256']\n                            raw = json.dumps(page, sort_keys=True).encode()\n                        target.write_bytes(raw)\n                    manifest['pages'] += [{**entry, 'sha256': digest((merged/'checkpoints'/entry['file']).read_bytes())}\n                                          for entry in current['pages']]\n                (merged/'complete.json').write_text(json.dumps(manifest))\n                self.verify_group(merged, operation['start'], operation['end'], checkpoint)\n                await self.child('pdf_processing.parse', {**request, 'mode': 'restore',\n                    'checkpoint': str(merged), 'start': operation['start'], 'end': operation['end']}, out)\n                try:\n                    document = json.loads((result/'document.json').read_text())\n                    if sorted(int(n) for n in document['pages']) != list(range(operation['start'], operation['end']+1)):\n                        raise ValueError()\n                except (ValueError, KeyError, TypeError, OSError):\n                    raise StoreFailure('integrity', 'assembly_coverage_invalid') from None\n            elif kind == 'ocr':\n                parsed = out/'parsed'\n                await asyncio.to_thread(self.materialize, operation['parsed'], parsed)\n                await self.child('pdf_processing.ocr', {'parsed': str(parsed/'document.json'),\n                    'pdf': str(source.pdf), 'out': str(result), 'component': operation['component']}, out)\n            else:\n                raise ValueError('Unsupported operation kind')\n            files = {str(p.relative_to(result)): p.read_bytes() for p in result.rglob('*') if p.is_file()}\n            files['attribution.json'] = json.dumps({'source_revision': source.source_revision,\n                'source_sha256': source.source_sha256, 'method': source.method,\n                'producer': producer, 'operation': operation}, sort_keys=True).encode()\n            publication = asyncio.create_task(asyncio.to_thread(self.store.publish, identity, files))\n            while not publication.done():\n                self.heartbeat({'operation': identity, 'stage': 'publication'})\n                await asyncio.wait({publication}, timeout=1)\n            await publication\n            return identity\n",
        "object_store.py": "\"\"\"Immutable attempt artifacts, authoritative registrations and bounded inventory.\n\nCallers own domain coverage checks, bucket/prefix configuration and retention.\n\"\"\"\nimport hashlib\nimport json\nimport uuid\nimport time\nimport threading\n\n\ndef digest(data):\n    return hashlib.sha256(data).hexdigest()\n\n\nclass StoreFailure(RuntimeError):\n    \"\"\"Sanitized failure categories shared by storage and processing callers.\"\"\"\n    def __init__(self, category, code):\n        super().__init__(code)\n        self.category, self.code = category, code\n\n\ndef storage_failure(error):\n    code = getattr(error, 'response', {}).get('Error', {}).get('Code', '')\n    if code in ('AccessDenied', 'InvalidAccessKeyId', 'SignatureDoesNotMatch', '403'):\n        return StoreFailure('configuration', 'storage_access_denied')\n    if code in ('NoSuchBucket', 'InvalidBucketName', 'AuthorizationHeaderMalformed',\n                'PermanentRedirect', 'InvalidEndpoint', 'NotImplemented', '501'):\n        return StoreFailure('configuration', 'storage_configuration')\n    return StoreFailure('storage', 'storage_unavailable')\n\n\ndef valid_name(name):\n    return (isinstance(name, str) and bool(name) and not name.startswith('/')\n            and all(part not in ('', '.', '..') for part in name.split('/')))\n\n\nclass Store:\n    def __init__(self, client, bucket, prefix):\n        self.client, self.bucket = client, bucket\n        self.prefix = prefix.rstrip('/') + '/'\n        self.lock = threading.Lock()\n        self.io = {'get_bytes': 0, 'put_bytes': 0, 'get_seconds': 0.0, 'put_seconds': 0.0}\n\n    def get(self, key):\n        try:\n            start = time.perf_counter()\n            body = self.client.get_object(Bucket=self.bucket, Key=key)['Body']\n            try:\n                data = body.read()\n            finally:\n                body.close()\n            with self.lock:\n                self.io['get_bytes'] += len(data)\n                self.io['get_seconds'] += time.perf_counter() - start\n            return data\n        except Exception as error:\n            if getattr(error, 'response', {}).get('Error', {}).get('Code') in ('NoSuchKey', '404'):\n                return None\n            raise storage_failure(error) from None\n\n    def put_once(self, key, data):\n        try:\n            start = time.perf_counter()\n            self.client.put_object(Bucket=self.bucket, Key=key, Body=data, IfNoneMatch='*')\n            with self.lock:\n                self.io['put_bytes'] += len(data)\n                self.io['put_seconds'] += time.perf_counter() - start\n            return True\n        except Exception as error:\n            if getattr(error, 'response', {}).get('Error', {}).get('Code') in ('PreconditionFailed', '412'):\n                return False\n            raise storage_failure(error) from None\n\n    def registry_key(self, operation):\n        return self.prefix + 'registered/' + digest(operation.encode()) + '.json'\n\n    def resolve(self, operation):\n        raw = self.get(self.registry_key(operation))\n        if raw is None:\n            return None\n        try:\n            manifest = json.loads(raw)\n            if manifest['version'] != 1 or manifest['operation'] != operation or not manifest['files']:\n                raise ValueError()\n            names, keys, attempts = set(), set(), set()\n            for item in manifest['files']:\n                name, key = item['name'], item['key']\n                if (not valid_name(name) or name in names or key in keys\n                        or not key.startswith(self.prefix+'attempts/')\n                        or type(item['bytes']) is not int or item['bytes'] < 0\n                        or len(item['sha256']) != 64\n                        or any(c not in '0123456789abcdef' for c in item['sha256'])):\n                    raise ValueError()\n                suffix = key[len(self.prefix+'attempts/'):]\n                attempt, separator, artifact = suffix.partition('/')\n                if not attempt or not separator or artifact != name:\n                    raise ValueError()\n                names.add(name); keys.add(key); attempts.add(attempt)\n            if len(attempts) != 1:\n                raise ValueError()\n        except (ValueError, TypeError, KeyError, AttributeError):\n            raise StoreFailure('integrity', 'committed_manifest_invalid') from None\n        for item in manifest['files']:\n            self.read_artifact(item)\n        return manifest\n\n    def read_artifact(self, item):\n        \"\"\"Validate every read, including a second read after resolution.\"\"\"\n        data = self.get(item['key'])\n        if data is None:\n            raise StoreFailure('integrity', 'committed_payload_missing')\n        if len(data) != item['bytes'] or digest(data) != item['sha256']:\n            raise StoreFailure('integrity', 'committed_payload_corrupt')\n        return data\n\n    def publish(self, operation, files, after_upload=None, after_register=None):\n        \"\"\"Publish validated outputs; a concurrent loser returns the verified winner.\n\n        Callers validate page coverage before publication. Hooks exist for the real\n        fault harness, never become operation identity, and are not commit signals.\n        Unknown write outcomes reconcile by authoritative read, not overwrite.\n        \"\"\"\n        existing = self.resolve(operation)\n        if existing is not None:\n            return existing\n        if not files or any(not valid_name(n) or not isinstance(d, bytes) for n,d in files.items()):\n            raise ValueError('Invalid publication files')\n        attempt = self.prefix + 'attempts/' + str(uuid.uuid4()) + '/'\n        entries = []\n        for name, data in sorted(files.items()):\n            key = attempt + name\n            try:\n                self.put_once(key, data)\n            except StoreFailure as error:\n                if error.category != 'storage':\n                    raise\n                # May have succeeded remotely before the connection failed.\n                if self.get(key) != data:\n                    raise error\n            if self.get(key) != data:\n                raise StoreFailure('integrity', 'uploaded_payload_corrupt')\n            entries.append({'name': name, 'key': key, 'sha256': digest(data), 'bytes': len(data)})\n            if after_upload:\n                after_upload(key)\n        manifest = {'version': 1, 'operation': operation, 'files': entries}\n        try:\n            self.put_once(self.registry_key(operation), json.dumps(manifest, sort_keys=True).encode())\n        except StoreFailure as error:\n            if error.category != 'storage':\n                raise\n            accepted = self.resolve(operation)\n            if accepted is None:\n                raise error\n        if after_register:\n            after_register()\n        accepted = self.resolve(operation)\n        if accepted is None:\n            raise StoreFailure('storage', 'registration_not_visible')\n        def content(value):\n            return sorted((i['name'], i['sha256'], i['bytes']) for i in value['files'])\n        if content(accepted) != content(manifest):\n            diagnostic = {'version': 1, 'operation': operation, 'winner': accepted,\n                          'loser': manifest, 'observed_at_unix': time.time()}\n            self.put_once(self.prefix+'diagnostics/'+uuid.uuid4().hex+'.json',\n                          json.dumps(diagnostic, sort_keys=True).encode())\n        return accepted\n\n    def inventory(self, max_objects=10000, capacity_bytes=None):\n        \"\"\"Bounded observation, not a snapshot or retention/GC authorization.\n\n        With a truncated listing no orphan classification is safe. A complete\n        listing still requires quiescence before counts are compared exactly.\n        Capacity is an operator supplied logical prefix budget, not disk capacity.\n        \"\"\"\n        if type(max_objects) is not int or max_objects <= 0:\n            raise ValueError('max_objects must be positive')\n        if capacity_bytes is not None and (type(capacity_bytes) is not int or capacity_bytes <= 0):\n            raise ValueError('capacity_bytes must be positive')\n        objects, token, complete = [], None, False\n        while len(objects) < max_objects:\n            args = dict(Bucket=self.bucket, Prefix=self.prefix, MaxKeys=min(1000,max_objects-len(objects)))\n            if token:\n                args['ContinuationToken'] = token\n            try:\n                page = self.client.list_objects_v2(**args)\n            except Exception as error:\n                raise storage_failure(error) from None\n            objects.extend(page.get('Contents', []))\n            if not page.get('IsTruncated'):\n                complete = True\n                break\n            token = page['NextContinuationToken']\n        registrations = [o for o in objects if o['Key'].startswith(self.prefix+'registered/')]\n        referenced, invalid = set(), []\n        for item in registrations:\n            try:\n                raw = self.get(item['Key'])\n                manifest = json.loads(raw) if raw is not None else None\n                if manifest is None or self.registry_key(manifest['operation']) != item['Key']:\n                    raise StoreFailure('integrity','committed_manifest_invalid')\n                verified = self.resolve(manifest['operation'])\n                if verified is None:\n                    raise StoreFailure('integrity','registration_disappeared')\n                referenced.update(i['key'] for i in verified['files'])\n            except (ValueError, TypeError, KeyError, StoreFailure) as error:\n                if isinstance(error, StoreFailure) and error.category != 'integrity':\n                    raise\n                invalid.append({'key':item['Key'], 'code':getattr(error,'code','committed_manifest_invalid')})\n        attempts = [o for o in objects if o['Key'].startswith(self.prefix+'attempts/')]\n        safe_to_classify = complete and not invalid\n        orphan = [o for o in attempts if o['Key'] not in referenced] if safe_to_classify else []\n        size = sum(o['Size'] for o in objects)\n        return {'observed_at_unix':time.time(), 'complete':complete, 'snapshot':False,\n                'listed_objects':len(objects), 'stored_bytes_lower_bound':size,\n                'registration_count':len(registrations), 'invalid_registrations':invalid,\n                'registered_artifact_count':len(referenced),\n                'orphan_classification_complete':safe_to_classify,\n                'orphan_objects':orphan if safe_to_classify else None,\n                'orphan_bytes':sum(o['Size'] for o in orphan) if safe_to_classify else None,\n                'capacity_bytes':capacity_bytes,\n                'capacity_exceeded':(True if size > capacity_bytes else False if complete else None) if capacity_bytes is not None else None,\n                'versions_included':False, 'retention_action':'none'}\n\n\nif __name__ == '__main__':\n    import argparse\n    import os\n    import boto3\n\n    parser = argparse.ArgumentParser(description='Read-only bounded checkpoint inventory; never performs GC')\n    parser.add_argument('--max-objects', type=int, default=10000)\n    parser.add_argument('--capacity-bytes', type=int, required=True)\n    args = parser.parse_args()\n    store = Store(boto3.client('s3', endpoint_url=os.environ['OBJECT_ENDPOINT']),\n                  os.environ['OBJECT_BUCKET'], os.environ['OBJECT_PREFIX'])\n    report = store.inventory(args.max_objects, args.capacity_bytes)\n    print(json.dumps(report, indent=2, default=str))\n    if report['invalid_registrations'] or report['capacity_exceeded']:\n        raise SystemExit(2)\n    if not report['complete']:\n        raise SystemExit(3)\n",
        "ocr.py": "\"\"\"Fresh-process OCR for an explicitly selected Docling picture component.\"\"\"\nimport base64\nimport hashlib\nimport importlib.metadata\nimport io\nimport json\nfrom pathlib import Path\nimport sys\nimport time\n\n\ndef execute(request):\n    import pypdfium2 as pdfium\n    from PIL import Image\n    from rapidocr import RapidOCR\n    from rapidocr.utils.output import RapidOCROutput\n    import rapidocr\n\n    assert rapidocr.__file__ is not None\n    parsed, source, out = (Path(request[k]) for k in ('parsed', 'pdf', 'out'))\n    out.mkdir(parents=True, exist_ok=True)\n    sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()\n    try:\n        doc = json.loads(parsed.read_text())\n        item = next(p for p in doc['pictures'] if p['self_ref'] == request['component'])\n        if len(item['prov']) != 1:\n            raise ValueError('This extraction seam requires single-page picture provenance')\n        prov = item['prov'][0]\n        with pdfium.PdfDocument(source) as pdf:\n            page = pdf[prov['page_no'] - 1]\n            try:\n                b = prov['bbox']\n                w, h = page.get_size()\n                scale = request.get('scale', 3)\n                if w*h*scale*scale > request.get('max_render_pixels', 20_000_000):\n                    raise ValueError('component_render_pixel_limit')\n                if page.get_rotation() != 0 or (not request.get('allow_cropbox', False) and tuple(page.get_bbox()) != (0, 0, w, h)):\n                    raise ValueError('unsupported_rotated_or_cropped_page')\n                if b['coord_origin'] == 'BOTTOMLEFT':\n                    box = (b['l'], h-b['t'], b['r'], h-b['b'])\n                elif b['coord_origin'] == 'TOPLEFT':\n                    box = (b['l'], b['t'], b['r'], b['b'])\n                else:\n                    raise ValueError('unsupported_coordinate_origin')\n                assert 0 <= box[0] < box[2] <= w and 0 <= box[1] < box[3] <= h\n                def pixels(value):\n                    return Image.open(io.BytesIO(base64.b64decode(value['image']['uri'].split(',')[1])))\n                page_pixels = pixels(doc['pages'][str(prov['page_no'])])\n                original_crop = pixels(item)\n                assert page_pixels.size == (round(w), round(h))\n                # PDFium accepts fractional scale; its unannotated default infers int.\n                rendered = page.render(scale=1.5)  # pyright: ignore[reportArgumentType]\n                assert rendered.to_pil().resize(page_pixels.size).convert('RGB').tobytes() == page_pixels.convert('RGB').tobytes()\n                rendered.close()\n                assert page_pixels.crop(box).tobytes() == original_crop.tobytes()\n                crop = page.render(scale=scale).to_pil().crop(tuple(x*scale for x in box))\n            finally:\n                page.close()\n    except (ValueError, AssertionError, KeyError, StopIteration, IndexError):\n        (out/'failure.json').write_text(json.dumps({'category': 'integrity', 'code': 'invalid_component_crop'}))\n        raise\n    crop.save(out/'figure.png')\n    t = time.perf_counter()\n    result = RapidOCR()(crop)\n    if not isinstance(result, RapidOCROutput):\n        raise TypeError(\"Expected complete OCR output\")\n    report = {\n        'component': item['self_ref'], 'parsed_result_sha256': sha(parsed),\n        'source_sha256': sha(source), 'provenance': prov, 'render_scale': scale,\n        'pixel_dimensions': crop.size, 'crop_sha256': sha(out/'figure.png'),\n        'cached_component_pixels_match_coordinates': True,\n        'producer': {'engine': 'RapidOCR', 'version': importlib.metadata.version('rapidocr'),\n                     'backend': 'onnxruntime ' + importlib.metadata.version('onnxruntime'),\n                     'model_sha256': {p.name: sha(p) for p in (Path(rapidocr.__file__).parent/'models').glob('*.onnx')}},\n        'seconds_including_engine_load': time.perf_counter()-t,\n        'texts': list(result.txts) if result.txts is not None else [],\n        'scores': [float(x) for x in result.scores] if result.scores is not None else [],\n        'boxes': result.boxes.tolist() if result.boxes is not None else [],\n    }\n    (out/'ocr.json').write_text(json.dumps(report, indent=2))\n\nif __name__ == '__main__':\n    execute(json.load(sys.stdin))\n",
        "parse.py": "\"\"\"Fresh-process Docling extraction; checkpoint format remains prototype-internal.\n\nDerived from the pinned experiment. No source, store or method is selected at import.\nFresh execution installs guards once. The private warm protocol rebinds request-local\nstate around one sequential capture converter. Assembly runs fresh after the idle\nwarm parser has been reaped so the two model-heavy processes do not overlap.\n\"\"\"\nimport collections\nimport hashlib\nimport importlib.metadata\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport platform\nimport resource\nimport sys\nimport threading\nimport time\n\nfrom dataclasses import dataclass\nfrom .execution import ChildFailure\nfrom .compatibility import methods_match, dependencies\n\n@dataclass(frozen=True)\nclass ParseRequest:\n    mode: str\n    pdf: Path\n    out: Path\n    model_cache: Path\n    checkpoint: Path | None = None\n    scan: bool = False\n    start: int = 1\n    end: int = 9223372036854775807\n    checkpoint_only: bool = False\n    expected_method: dict | None = None\n    checkpoint_compatibility: dict | None = None\n\n    @classmethod\n    def from_json(cls, value):\n        value = dict(value)\n        for key in ('pdf', 'out', 'model_cache', 'checkpoint'):\n            if value.get(key) is not None: value[key] = Path(value[key])\n        return cls(**value)\n\n\ndef execute(request: ParseRequest, receive=None, notify=lambda kind, **data: None):\n    if receive is not None and (request.mode != 'capture' or not request.checkpoint_only or request.scan):\n        raise ChildFailure('method', 'unsupported_warm_profile')\n    if request.mode not in ('baseline', 'capture', 'restore', 'warmup'):\n        raise ValueError('Unsupported execution mode')\n    if request.out.exists() and any(request.out.iterdir()):\n        raise ValueError('Output directory must be fresh')\n    if request.mode == 'restore' and request.checkpoint is None:\n        raise ValueError('Restore requires checkpoint')\n    from .continuation import METHOD, ContinuationPredictor\n    actual_continuation = None\n    continuation = (request.expected_method or {}).get('continuation')\n    if continuation is not None:\n        actual_continuation = {\n            'version': METHOD,\n            'sha256': hashlib.sha256(Path(__file__).with_name('continuation.py').read_bytes()).hexdigest(),\n        }\n        if continuation != actual_continuation:\n            raise ChildFailure('method', 'unsupported_continuation_method')\n\n    os.environ['HF_HOME'] = str(request.model_cache)\n    os.environ.setdefault('OMP_NUM_THREADS', '4')\n    started = time.perf_counter()\n    events = []\n    lock = threading.Lock()\n    from PIL import Image\n    from docling.datamodel import base_models as bm\n    from docling.datamodel.document import ConversionResult\n    from docling.datamodel.pipeline_options import ThreadedPdfPipelineOptions, RapidOcrOptions\n    from docling.datamodel.accelerator_options import AcceleratorOptions, AcceleratorDevice\n    from docling.document_converter import DocumentConverter, PdfFormatOption\n    from docling.pipeline.standard_pdf_pipeline import StandardPdfPipeline\n    from docling.models.stages.reading_order.readingorder_model import ReadingOrderModel, ReadingOrderOptions\n    from docling_core.types.doc.base import Size\n    \n    TYPES = {c.__name__: c for c in (bm.TextElement, bm.Table, bm.FigureElement, bm.ContainerElement)}\n    def sha(path):\n        return hashlib.sha256(Path(path).read_bytes()).hexdigest()\n    \n    \n    def write(path, data):\n        path.parent.mkdir(parents=True, exist_ok=True)\n        raw = json.dumps(data, indent=2, sort_keys=True, allow_nan=False).encode()\n        tmp = path.with_suffix(path.suffix + \".incomplete\")\n        with tmp.open(\"wb\") as f:\n            f.write(raw)\n            f.flush()\n            os.fsync(f.fileno())\n        os.replace(tmp, path)\n        fd = os.open(path.parent, os.O_RDONLY)\n        try:\n            os.fsync(fd)\n        finally:\n            os.close(fd)\n    \n    \n    def event(stage, pages, elapsed, **extra):\n        value = dict(pid=os.getpid(), stage=stage, pages=pages, seconds=elapsed, **extra)\n        with lock:\n            events.append(value)\n            with (request.out / \"events.jsonl\").open(\"a\") as f:\n                f.write(json.dumps(value) + \"\\n\")\n                f.flush()\n        if stage != \"model_initialization\":\n            notify(\"progress\", stage=stage, pages=pages)\n        print(json.dumps(value), flush=True)\n    \n    \n    def instrument(forbid=False):\n        # Class-level wrappers count stage input pages/batches and fail closed on replay.\n        from docling.models.stages.page_preprocessing.page_preprocessing_model import PagePreprocessingModel\n        from docling.models.stages.layout.layout_model import LayoutModel\n        from docling.models.stages.table_structure.table_structure_model import TableStructureModel\n        from docling.models.stages.ocr.rapid_ocr_model import RapidOcrModel\n        from docling.models.stages.page_assemble.page_assemble_model import PageAssembleModel\n        if request.mode == \"baseline\":\n            assemble = StandardPdfPipeline._assemble_document\n            def timed_assembly(self, conv_res):\n                t = time.perf_counter()\n                result = assemble(self, conv_res)\n                event(\"document_assembly\", [], time.perf_counter() - t)\n                return result\n            StandardPdfPipeline._assemble_document = timed_assembly\n        for cls in (PagePreprocessingModel, LayoutModel, TableStructureModel, RapidOcrModel, PageAssembleModel):\n            original = cls.__call__\n            def wrapped(self, conv_res, page_batch, _original=original, _name=cls.__name__):\n                pages = list(page_batch)\n                if forbid:\n                    raise AssertionError(f\"Repeated page stage: {_name}\")\n                t = time.perf_counter()\n                event(\"stage_enter\", [p.page_no for p in pages], 0, native_stage=_name)\n                try:\n                    yield from _original(self, conv_res, iter(pages))\n                finally:\n                    event(_name, [p.page_no for p in pages], time.perf_counter() - t)\n            cls.__call__ = wrapped\n    \n    \n    def options(scan=False):\n        return ThreadedPdfPipelineOptions(\n            do_ocr=scan,\n            ocr_options=RapidOcrOptions(backend=\"onnxruntime\", force_full_page_ocr=scan),\n            do_table_structure=True,\n            generate_page_images=True, generate_picture_images=True,\n            images_scale=1.0,\n            accelerator_options=AcceleratorOptions(device=AcceleratorDevice.CPU, num_threads=4),\n        )\n    \n    \n    def confidence_json(value, restore=False):\n        if isinstance(value, dict):\n            return {k: confidence_json(v, restore) for k, v in value.items()}\n        if restore and value is None:\n            return float(\"nan\")\n        return None if isinstance(value, float) and math.isnan(value) else value\n    \n    \n    def pack_assembled(unit):\n        # Explicit tags prevent Pydantic's overlapping union from turning figures into text.\n        return {key: [{\"type\": type(e).__name__, \"value\": e.model_dump(mode=\"json\")}\n                      for e in getattr(unit, key)] for key in (\"elements\", \"headers\", \"body\")}\n    \n    \n    def unpack_assembled(data):\n        return bm.AssembledUnit(**{k: [TYPES[e[\"type\"]].model_validate(e[\"value\"]) for e in v]\n                                  for k, v in data.items()})\n    \n    \n    class SelectedPipeline(StandardPdfPipeline):\n        def _init_models(self):\n            super()._init_models()\n            if continuation is not None:\n                self.reading_order_model.ro_model = ContinuationPredictor()\n\n    class CapturePipeline(SelectedPipeline):\n        def _release_page_resources(self, item):\n            page = item.payload\n            if page is not None and page.assembled is not None:\n                t = time.perf_counter()\n                image_path = request.out / \"checkpoints\" / f\"page-{page.page_no:04}.png\"\n                image_path.parent.mkdir(parents=True, exist_ok=True)\n                assert page.image is not None and page.size is not None\n                page.image.save(image_path)\n                with image_path.open(\"rb\") as f:\n                    os.fsync(f.fileno())\n                data = {\n                    \"format\": \"PROTOTYPE-page-v1\", \"source_sha256\": sha(request.pdf),\n                    \"method_sha256\": sha(request.out / \"method.json\"),\n                    \"page_no\": page.page_no, \"size\": page.size.model_dump(mode=\"json\"),\n                    \"coordinate_contract\": \"Docling bboxes retain coord_origin; page units are PDF points\",\n                    \"assembled\": pack_assembled(page.assembled),\n                    \"visual\": {\"file\": image_path.name, \"sha256\": sha(image_path), \"scale\": 1.0},\n                }\n                write(image_path.with_suffix(\".json\"), data)\n                event(\"checkpoint_commit\", [page.page_no], time.perf_counter() - t)\n            super()._release_page_resources(item)\n    \n        def _assemble_document(self, conv_res):\n            assert conv_res.status == bm.ConversionStatus.SUCCESS, conv_res.errors\n            checkpoints = sorted((request.out / \"checkpoints\").glob(\"page-*.json\"))\n            assert len(checkpoints) == len(conv_res.pages)\n            write(request.out / \"complete.json\", {\n                \"format\": \"PROTOTYPE-document-v1\", \"source_sha256\": sha(request.pdf),\n                \"method_sha256\": sha(request.out / \"method.json\"),\n                \"pages\": [{\"file\": p.name, \"sha256\": sha(p)} for p in checkpoints],\n                \"confidence\": confidence_json(conv_res.confidence.model_dump(mode=\"json\")),\n                \"errors\": [e.model_dump(mode=\"json\") for e in conv_res.errors],\n                \"status\": conv_res.status.value,\n            })\n            if request.checkpoint_only:\n                return conv_res\n            t = time.perf_counter()\n            result = super()._assemble_document(conv_res)\n            event(\"document_assembly\", [], time.perf_counter() - t)\n            return result\n    \n    \n    class RestorePipeline(StandardPdfPipeline):\n        def _init_models(self):\n            # Only assembly is constructed; no page inference models or OCR engines exist.\n            self.reading_order_model = ReadingOrderModel(options=ReadingOrderOptions())\n            if continuation is not None:\n                self.reading_order_model.ro_model = ContinuationPredictor()\n            self.keep_images = True\n            self.keep_backend = False\n    \n        def _build_document(self, conv_res):\n            t = time.perf_counter()\n            saved = request.checkpoint\n            assert saved is not None\n            manifest = json.loads((saved / \"complete.json\").read_text())\n            assert manifest[\"format\"] == \"PROTOTYPE-document-v1\"\n            assert manifest[\"source_sha256\"] == sha(request.pdf)\n            assert manifest[\"method_sha256\"] == sha(saved / \"method.json\")\n            saved_method = json.loads((saved / \"method.json\").read_text())\n            compatible = methods_match(saved_method, method())\n            if request.checkpoint_compatibility is not None:\n                compatible = (json.loads((saved / \"compatibility.json\").read_text()) == request.checkpoint_compatibility\n                              and methods_match(saved_method, method(), True))\n            if not compatible:\n                raise ChildFailure(\"method\", \"worker_method_mismatch\")\n            pages = []\n            for entry in manifest[\"pages\"]:\n                path = saved / \"checkpoints\" / entry[\"file\"]\n                assert sha(path) == entry[\"sha256\"]\n                data = json.loads(path.read_text())\n                assert data[\"format\"] == \"PROTOTYPE-page-v1\"\n                assert data[\"source_sha256\"] == manifest[\"source_sha256\"]\n                assert data[\"method_sha256\"] == manifest[\"method_sha256\"]\n                picture = path.parent / data[\"visual\"][\"file\"]\n                assert sha(picture) == data[\"visual\"][\"sha256\"]\n                page = bm.Page(page_no=data[\"page_no\"], size=Size.model_validate(data[\"size\"]),\n                               assembled=unpack_assembled(data[\"assembled\"]))\n                assert pack_assembled(page.assembled) == data[\"assembled\"]\n                page._image_cache = {1.0: Image.open(picture).copy()}\n                page._default_image_scale = 1.0\n                pages.append(page)\n            assert [p.page_no for p in pages] == self._get_expected_page_nos(conv_res)\n            conv_res.pages = pages\n            conv_res.confidence = type(conv_res.confidence).model_validate(confidence_json(manifest[\"confidence\"], restore=True))\n            conv_res.errors = [bm.ErrorItem.model_validate(e) for e in manifest[\"errors\"]]\n            conv_res.status = bm.ConversionStatus(manifest[\"status\"])\n            self._page_sizes_by_no = {p.page_no: p.size for p in pages}\n            event(\"checkpoint_load\", [p.page_no for p in pages], time.perf_counter() - t)\n            return conv_res\n    \n        def _assemble_document(self, conv_res):\n            t = time.perf_counter()\n            result = super()._assemble_document(conv_res)\n            event(\"document_assembly\", [], time.perf_counter() - t)\n            return result\n    \n    \n    def method():\n        packages = {d.metadata[\"Name\"]: d.version for d in importlib.metadata.distributions()}\n        models = {str(p.relative_to(request.model_cache)): sha(p) for p in sorted((request.model_cache).glob(\"hub/models--*/snapshots/**/*\")) if p.is_file()}\n        import rapidocr\n        models.update({\"rapidocr/\" + p.name: sha(p) for p in (Path(rapidocr.__file__).parent / \"models\").glob(\"*.onnx\")})\n        return {**({\"continuation\": actual_continuation} if continuation is not None else {}),\n                \"format\": \"PROTOTYPE-page-v1\", \"python\": platform.python_version(),\n                \"platform\": platform.platform(), \"packages\": packages, \"model_artifacts\": models,\n                \"options\": options(request.scan).model_dump(mode=\"json\", serialize_as_any=True),\n                \"option_types\": {k: type(getattr(options(request.scan), k)).__name__ for k in (\"ocr_options\", \"layout_options\", \"table_structure_options\")},\n                \"backend\": \"PdfFormatOption default pinned by packages\"}\n    \n    request.out.mkdir(parents=True, exist_ok=True)\n    instrument(request.mode == \"restore\")\n    pipeline = {\"baseline\": SelectedPipeline, \"warmup\": SelectedPipeline,\n                \"capture\": CapturePipeline, \"restore\": RestorePipeline}[request.mode]\n    converter = DocumentConverter(format_options={bm.InputFormat.PDF: PdfFormatOption(\n        pipeline_cls=pipeline, pipeline_options=options(request.scan))})\n    t = time.perf_counter()\n    converter.initialize_pipeline(bm.InputFormat.PDF)\n    event(\"model_initialization\", [], time.perf_counter() - t)\n    current_method = method()\n    producer = {p.name: sha(p) for p in Path(__file__).parent.glob('*.py')}\n    actual_checkpoint = dependencies('group', {'method': current_method}, producer)\n    original_scan, original_cache = request.scan, request.model_cache\n    while True:\n        if receive is not None:\n            if request.mode != 'capture' or not request.checkpoint_only or request.scan or request.scan != original_scan or request.model_cache != original_cache:\n                raise ChildFailure('method', 'unsupported_warm_profile')\n        request.out.mkdir(parents=True, exist_ok=True)\n        if request.expected_method is not None:\n            if not methods_match(current_method, request.expected_method, request.checkpoint_compatibility is not None):\n                raise ChildFailure(\"method\", \"worker_method_mismatch\")\n        if request.checkpoint_compatibility is not None and request.checkpoint_compatibility != actual_checkpoint:\n            raise ChildFailure(\"method\", \"checkpoint_producer_mismatch\")\n        notify(\"ready\", method=current_method)\n        write(request.out / \"method.json\", current_method)\n        if request.checkpoint_compatibility is not None:\n            write(request.out / \"compatibility.json\", request.checkpoint_compatibility)\n        if request.mode == \"warmup\":\n            return\n        t = time.perf_counter()\n        result = converter.convert(request.pdf, page_range=(request.start, request.end))\n        elapsed = time.perf_counter() - t\n        assert result.status == bm.ConversionStatus.SUCCESS, result.errors\n        result.document.save_as_json(request.out / \"document.json\")\n        (request.out / \"document.md\").write_text(result.document.export_to_markdown())\n        counts = collections.Counter()\n        seconds = collections.Counter()\n        for e in events:\n            counts[e[\"stage\"]] += len(e[\"pages\"])\n            seconds[e[\"stage\"]] += e[\"seconds\"]\n        report = {\"pid\": os.getpid(), \"mode\": request.mode, \"wall_seconds\": time.perf_counter()-started,\n                  \"convert_seconds\": elapsed, \"peak_rss_bytes\": resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,\n                  \"rss_units\": \"bytes\" if sys.platform == \"darwin\" else \"KiB\", \"page_stage_inputs\": dict(counts),\n                  \"stage_seconds_sum_not_wall\": dict(seconds), \"source_sha256\": sha(request.pdf),\n                  \"document_sha256\": sha(request.out / \"document.json\"),\n                  \"labels\": dict(collections.Counter(str(getattr(item, \"label\")) for item, _ in result.document.iterate_items() if hasattr(item, \"label\"))),\n                  \"errors\": [e.model_dump(mode=\"json\") for e in result.errors]}\n        write(request.out / \"metrics.json\", report)\n        print(json.dumps(report, indent=2))\n        notify('done', memory={'peak_rss': report['peak_rss_bytes'], 'units': report['rss_units']})\n        if receive is None:\n            return\n        request = receive()\n        if request is None:\n            return\n        if request.out.exists() and any(request.out.iterdir()):\n            raise ChildFailure('integrity', 'output_directory_not_fresh')\n        events.clear()\n        started = time.perf_counter()\n\n\nif __name__ == \"__main__\":\n    request = ParseRequest.from_json(json.load(sys.stdin))\n    try:\n        execute(request)\n    except Exception as error:\n        if isinstance(error, ChildFailure):\n            category, code = error.category, error.code\n        elif isinstance(error, AssertionError) and request.mode == 'restore':\n            category, code = 'integrity', 'checkpoint_validation_failed'\n        else:\n            category, code = 'parser', 'parser_execution_failed'\n        request.out.mkdir(parents=True, exist_ok=True)\n        (request.out/'failure.json').write_text(json.dumps({'version': 1, 'category': category, 'code': code}))\n        raise SystemExit(1)\n",
        "preflight.py": "\"\"\"Bounded fresh-child PDF inspection; no inference/model imports.\"\"\"\nimport json\nimport math\nfrom pathlib import Path\nimport sys\n\n\ndef inspect(request):\n    import pypdfium2 as pdfium\n    try:\n        document = pdfium.PdfDocument(request['pdf'])\n    except pdfium.PdfiumError as error:\n        return {'error': 'password_required' if error.err_code == 4 else 'invalid_pdf'}\n    try:\n        count = len(document)\n        if not 0 < count <= request['max_pages']:\n            return {'error': 'page_limit'}\n        sizes = []\n        for index in range(count):\n            page = document[index]\n            try:\n                width, height = page.get_size()\n                # Include the selected parser's scale and enforce each page before render.\n                pixels = math.ceil(width * request['render_scale']) * math.ceil(height * request['render_scale'])\n                if not all(math.isfinite(v) and v > 0 for v in (width, height)) or pixels > request['max_page_pixels']:\n                    return {'error': 'pixel_limit'}\n                sizes.append({'page': index+1, 'width': width, 'height': height, 'pixels': pixels})\n            finally:\n                page.close()\n        return {'pages': count, 'page_sizes': sizes}\n    except Exception:\n        return {'error': 'invalid_pdf'}\n    finally:\n        document.close()\n\n\nif __name__ == '__main__':\n    request = json.load(sys.stdin)\n    Path(request['out']).write_text(json.dumps(inspect(request)))\n",
        "processing.py": "\"\"\"Versioned request -> registered internal parsed result.\n\nThe object-store adapter is the only persistence implementation. Profiles are\noperator-published immutable files, not arbitrary options supplied by callers.\n\"\"\"\nimport asyncio\nfrom datetime import datetime, timezone\nimport json\nfrom pathlib import Path\nimport tempfile\nimport time\nfrom typing import NoReturn\n\nfrom temporalio import activity\nfrom temporalio.exceptions import ApplicationError\n\nfrom .compatibility import CONTRACT, dependencies\nfrom .execution import ChildFailure, Execution, SourceRequest\nfrom .object_store import digest, StoreFailure, storage_failure\n\n\ndef encoded(value):\n    return json.dumps(value, sort_keys=True, separators=(',', ':')).encode()\n\n\ndef observed():\n    return datetime.now(timezone.utc).isoformat()\n\n\ndef reject(code, category='input') -> NoReturn:\n    raise ApplicationError(code, {'category': category, 'code': code},\n                           type=category, non_retryable=category in ('input', 'integrity', 'method', 'configuration'))\n\n\nclass Processing:\n    def __init__(self, store, scratch, model_cache, profile, limits=None, child_runner=None):\n        self.store, self.scratch = store, Path(scratch)\n        self.child_runner = child_runner\n        self.model_cache, self.profile = Path(model_cache), profile\n        self.limits = limits or {'max_bytes': 100*1024*1024, 'max_pages': 100,\n            'max_page_pixels': 20_000_000, 'preflight_seconds': 30, 'child_seconds': 540}\n        if any(type(v) is not int or v <= 0 for v in self.limits.values()):\n            raise ValueError('All provisional limits must be positive integers')\n        if profile['id'] != 'native-v1' or profile['method']['options']['do_ocr'] is not False:\n            raise ValueError('T02 only supports the pinned native-v1 profile without parsing OCR')\n        if type(profile.get('group_pages', 5)) is not int or profile.get('group_pages', 5) <= 0:\n            raise ValueError('group_pages must be a positive integer')\n        ocr = profile.get('picture_ocr', {'render_scale': 3})\n        if set(ocr) != {'render_scale'} or type(ocr['render_scale']) not in (int, float) or not 0 < ocr['render_scale'] <= 6:\n            raise ValueError('Unsupported picture OCR recipe')\n        from .relationships import POLICY, validate_policy\n        evidence = profile.get('content_evidence', {'version': 'typed-source-evidence-v1'})\n        if evidence['version'] == POLICY:\n            if set(evidence) != {'version', 'reviews', 'relationships'}:\n                raise ValueError('invalid_relationship_evidence_policy')\n            validate_policy(evidence['relationships'])\n        elif evidence['version'] != 'typed-source-evidence-v1':\n            raise ValueError('unsupported_evidence_policy')\n        self.producer = {p.name: digest(p.read_bytes()) for p in Path(__file__).parent.glob('*.py')}\n        self.scratch.mkdir(parents=True, exist_ok=True)\n\n    def read_source(self, request, path):\n        ref = request['artifact']\n        if not ref['key'].startswith(self.store.prefix+'sources/') or ref['version_id'] == 'null':\n            reject('invalid_source_reference')\n        started = time.monotonic()\n        try:\n            response = self.store.client.get_object(Bucket=self.store.bucket,\n                Key=ref['key'], VersionId=ref['version_id'])\n            body = response['Body']\n            try:\n                if response['ContentLength'] > self.limits['max_bytes']:\n                    reject('byte_limit')\n                data = body.read(self.limits['max_bytes']+1)\n            finally:\n                body.close()\n        except ApplicationError:\n            raise\n        except Exception as error:\n            code = getattr(error, 'response', {}).get('Error', {}).get('Code')\n            if code in ('NoSuchKey', 'NoSuchVersion', '404'):\n                reject('source_missing')\n            raise storage_failure(error) from None\n        if len(data) > self.limits['max_bytes']:\n            reject('byte_limit')\n        if digest(data) != ref['sha256']:\n            reject('digest_mismatch')\n        path.write_bytes(data)\n        with self.store.lock:\n            self.store.io['get_bytes'] += len(data)\n            self.store.io['get_seconds'] += time.monotonic()-started\n        return len(data)\n\n    def load_plan(self, identity):\n        registration = self.store.resolve(identity)\n        if registration is None:\n            reject('plan_missing', 'integrity')\n        files = [item for item in registration['files'] if item['name'] == 'plan.json']\n        if len(files) != 1:\n            reject('plan_invalid', 'integrity')\n        plan = json.loads(self.store.read_artifact(files[0]))\n        if plan['profile'] != self.profile or plan['producer'] != self.producer or plan['limits'] != self.limits:\n            reject('worker_method_mismatch', 'method')\n        return plan\n\n    def validate_request(self, request):\n        try:\n            if request['version'] not in (1, 2, 3) or request['profile'] != self.profile['id']:\n                reject('invalid_request')\n            if request['version'] == 2 and request.get('completion') != 'required_picture_ocr_v1':\n                reject('invalid_completion_target')\n            if request['version'] == 3 and request.get('completion') != 'required_evidence_v1':\n                reject('invalid_completion_target')\n            from .relationships import POLICY\n            if self.profile.get('content_evidence', {}).get('version') == POLICY:\n                if request['version'] != 3:\n                    reject('relationships_require_evidence_completion')\n                coverage = self.profile['content_evidence']['relationships']['coverage']\n                if coverage['mode'] == 'selected_regions' and coverage['source_sha256'] != request['artifact']['sha256']:\n                    reject('relationship_coverage_source_mismatch')\n            for key in ('request_id', 'source_revision'):\n                if not isinstance(request[key], str) or not 0 < len(request[key]) <= 256:\n                    reject('invalid_request')\n            ref = request['artifact']\n            if not all(isinstance(ref[k], str) and ref[k] for k in ('key', 'version_id', 'sha256', 'name')):\n                reject('invalid_request')\n            if ref['version_id'] == 'null' or not ref['key'].startswith(self.store.prefix+'sources/'):\n                reject('invalid_source_reference')\n            if len(ref['sha256']) != 64 or any(c not in '0123456789abcdef' for c in ref['sha256']):\n                reject('invalid_request')\n            if Path(ref['name']).name != ref['name'] or not ref['name'].lower().endswith('.pdf'):\n                reject('invalid_request')\n            if len(encoded(request)) > 8192:\n                reject('invalid_request')\n        except (KeyError, TypeError, AttributeError):\n            reject('invalid_request')\n\n    async def prepare(self, request):\n        self.validate_request(request)\n        identity = 'pdf-plan-v1:' + digest(encoded(request['request_id']))\n        prior = await asyncio.to_thread(self.store.resolve, identity)\n        if prior:\n            plan = await asyncio.to_thread(self.load_plan, identity)\n            if plan['request'] != request:\n                reject('request_identity_conflict')\n            return {'plan': identity, 'pages': plan['pages'], 'groups': plan['groups'], 'observed_at': observed()}\n        with tempfile.TemporaryDirectory(prefix='preflight-', dir=self.scratch) as tmp:\n            root = Path(tmp)\n            pdf = root/request['artifact']['name']\n            size = await asyncio.to_thread(self.read_source, request, pdf)\n            dummy = SourceRequest(pdf, request['source_revision'], request['artifact']['sha256'],\n                                  self.profile['method'], self.model_cache)\n            execution = Execution(dummy, self.store, root, activity.heartbeat, self.limits['preflight_seconds'])\n            await execution.child('pdf_processing.preflight', {'pdf': str(pdf), 'out': str(root/'inspection.json'),\n                'max_pages': self.limits['max_pages'], 'max_page_pixels': self.limits['max_page_pixels'],\n                'render_scale': 1}, root)\n            inspection = json.loads((root/'inspection.json').read_text())\n            if 'error' in inspection:\n                reject(inspection['error'])\n            pages = inspection['pages']\n            plan = {'version': 1, 'request': request, 'profile': self.profile,\n                'producer_contract': CONTRACT, 'checkpoint_format': 'PROTOTYPE-page-v1',\n                'pages': pages, 'page_sizes': inspection['page_sizes'], 'source_bytes': size,\n                'groups': [[n, min(n+self.profile.get('group_pages', 5)-1, pages)]\n                           for n in range(1, pages+1, self.profile.get('group_pages', 5))],\n                'limits': self.limits, 'producer': self.producer, 'created_at': observed()}\n            await asyncio.to_thread(self.store.publish, identity, {'plan.json': encoded(plan)})\n            accepted = await asyncio.to_thread(self.load_plan, identity)\n            if accepted['request'] != request:\n                reject('request_identity_conflict')\n            return {'plan': identity, 'pages': accepted['pages'], 'groups': accepted['groups'], 'observed_at': observed()}\n\n    def operation_contract(self, plan, operation):\n        request = plan['request']\n        return {**operation, 'contract': CONTRACT,\n            'dependencies': {'source': request['artifact'], 'source_revision': request['source_revision'],\n                'group_plan': plan['groups'],\n                'stage': dependencies(operation['kind'], plan['profile'], plan['producer']),\n                'checkpoint': dependencies('group', plan['profile'], plan['producer'])}}\n\n    async def execute(self, value):\n        started = time.monotonic()\n        before = dict(self.store.io)\n        plan = await asyncio.to_thread(self.load_plan, value['plan'])\n        operation = value['operation']\n        if operation['kind'] == 'group':\n            if [operation['start'], operation['end']] not in plan['groups']:\n                reject('operation_outside_plan', 'integrity')\n        elif operation['kind'] == 'assembly':\n            if operation['start'] != 1 or operation['end'] != plan['pages'] or len(operation['groups']) != len(plan['groups']):\n                reject('operation_outside_plan', 'integrity')\n            expected = [digest(json.dumps(self.operation_contract(plan,\n                {'kind': 'group', 'start': start, 'end': end}), sort_keys=True).encode())\n                for start, end in plan['groups']]\n            if operation['groups'] != expected:\n                reject('group_plan_mismatch', 'integrity')\n        else:\n            reject('unsupported_stage')\n        with tempfile.TemporaryDirectory(prefix='activity-', dir=self.scratch) as tmp:\n            root = Path(tmp)\n            request = plan['request']\n            pdf = root/request['artifact']['name']\n            await asyncio.to_thread(self.read_source, request, pdf)\n            source = SourceRequest(pdf, request['source_revision'], request['artifact']['sha256'],\n                                   plan['profile']['method'], self.model_cache)\n            execution = Execution(source, self.store, root, activity.heartbeat, plan['limits']['child_seconds'], child_runner=self.child_runner)\n            contract = self.operation_contract(plan, operation)\n            identity = await execution.produce(contract)\n            result = {'operation': identity, 'stage': operation['kind'], 'reused': execution.observation['reused'],\n                'observed_at': observed()}\n            if 'parser' in execution.observation:\n                result['parser'] = execution.observation['parser']\n            if operation['kind'] == 'assembly':\n                # Full reconstruction is not enrichment completion or canonical acceptance.\n                delivered = root/'delivered'\n                await asyncio.to_thread(execution.materialize, identity, delivered)\n                document = json.loads((delivered/'document.json').read_text())\n                if sorted(int(n) for n in document['pages']) != list(range(1,plan['pages']+1)):\n                    reject('incomplete_page_coverage', 'integrity')\n                manifest = {'version': 1, 'status': 'parsed_ready', 'processing_complete': False,\n                    'canonical_accepted': False, 'plan': value['plan'], 'source': request,\n                    'profile': digest(encoded(plan['profile'])), 'pages': plan['pages'],\n                    'page_groups': operation['groups'], 'assembly': identity,\n                    'evidence_contract': 'Each group registration includes hashed page JSON and page image; assembly includes Docling document JSON and Markdown.',\n                    'created_at': observed()}\n                result_id = 'pdf-parsed-v2:'+digest(encoded({'assembly': identity, 'plan': value['plan']}))\n                await asyncio.to_thread(self.store.publish, result_id, {'parsed-result.json': encoded(manifest)})\n                result['parsed_result'] = result_id\n            result.update(seconds=time.monotonic()-started, observed_at=observed(),\n                          storage={key: self.store.io[key]-before[key] for key in before})\n            return result\n\n    @activity.defn(name='pdf_processing_step_v1')\n    async def run(self, value):\n        async def beat():\n            while True:\n                activity.heartbeat({'stage': value['stage'], 'durable_completion': False})\n                await asyncio.sleep(2)\n        heartbeat = asyncio.create_task(beat())\n        try:\n            if value['stage'] == 'prepare':\n                return await self.prepare(value['request'])\n            if value['stage'] in ('select', 'component_ocr', 'finalize'):\n                from .enrichment import Enrichment\n                return await Enrichment(self).run(value)\n            return await self.execute(value)\n        except ApplicationError:\n            raise\n        except StoreFailure as error:\n            reject(error.code, error.category)\n        except ChildFailure as error:\n            reject(error.code, error.category)\n        except AssertionError:\n            reject('artifact_or_method_validation_failed', 'integrity')\n        except TimeoutError:\n            raise ApplicationError('child_deadline', {'category': 'parser', 'code': 'child_deadline'}, type='parser')\n        except Exception as error:\n            code = 'storage_unavailable' if hasattr(error, 'response') or type(error).__module__.startswith('botocore') else 'execution_failed'\n            category = 'storage' if code == 'storage_unavailable' else 'parser'\n            raise ApplicationError(code, {'category': category, 'code': code}, type=category) from None\n        finally:\n            heartbeat.cancel()\n            await asyncio.gather(heartbeat, return_exceptions=True)\n",
        "processing_workflow.py": "\"\"\"Deterministic internal parsing orchestration; never imports Docling or storage.\"\"\"\nfrom datetime import timedelta\n\nfrom temporalio import workflow\nfrom temporalio.common import RetryPolicy\nfrom temporalio.exceptions import ActivityError, ApplicationError\n\n\n@workflow.defn\nclass PDFProcessing:\n    def __init__(self):\n        self.summary = {'version': 1, 'status': 'preparing', 'registered_pages': 0,\n                        'processing_complete': False, 'canonical_accepted': False,\n                        'steps': [], 'error': None}\n\n    @workflow.query\n    def progress(self) -> dict:\n        return self.summary\n\n    @workflow.run\n    async def run(self, submission: dict) -> dict:\n        self.summary['observed_at'] = workflow.now().isoformat()\n        request = submission.get('request', {})\n        if not isinstance(request, dict) or request.get('version') not in (1, 2, 3):\n            self.summary.update(status='failed', error={'category': 'input', 'code': 'invalid_request'})\n            return self.summary\n        queue = submission.get('activity_queue')\n        if not isinstance(queue, str) or not queue:\n            self.summary.update(status='failed', error={'category': 'input', 'code': 'invalid_activity_queue'})\n            return self.summary\n\n        async def call(value):\n            return await self.call(value, submission)\n\n        try:\n            prepared = await call({'stage': 'prepare', 'request': request})\n            self.summary.update({'plan': prepared['plan'], 'pages': prepared['pages'], 'status': 'parsing',\n                                 'observed_at': prepared['observed_at']})\n            groups = []\n            for start, end in prepared['groups']:\n                result = await call({'stage': 'execute', 'plan': prepared['plan'],\n                                    'operation': {'kind': 'group', 'start': start, 'end': end}})\n                groups.append(result['operation'])\n                self.summary['steps'].append(result)\n                self.summary['registered_pages'] += end-start+1\n                self.summary['observed_at'] = result['observed_at']\n            self.summary['status'] = 'assembling'\n            result = await call({'stage': 'execute', 'plan': prepared['plan'],\n                'operation': {'kind': 'assembly', 'start': 1, 'end': prepared['pages'], 'groups': groups}})\n            self.summary['steps'].append(result)\n            self.summary.update({'status': 'parsed_ready', 'parsed_result': result['parsed_result'],\n                                 'observed_at': result['observed_at']})\n            if request['version'] == 1:\n                return self.summary\n            self.summary['status'] = 'selecting'\n            selection = await call({'stage': 'select', 'plan': prepared['plan'],\n                                    'parsed_result': result['parsed_result']})\n            self.summary.update(selection=selection['operation'], selected_components=len(selection['selected']),\n                                registered_components=0, status='enriching')\n            outcomes = []\n            # One scheduled component at a time: bounded history and in-flight work.\n            for component in selection['selected']:\n                outcome = await call({'stage': 'component_ocr', 'plan': prepared['plan'],\n                    'selection': selection['operation'], 'component': component})\n                outcomes.append(outcome['operation'])\n                self.summary['steps'].append(outcome)\n                self.summary.update(registered_components=len(outcomes), observed_at=outcome['observed_at'])\n            self.summary['status'] = 'finalizing'\n            final = await call({'stage': 'finalize', 'plan': prepared['plan'],\n                'selection': selection['operation'], 'outcomes': outcomes})\n            self.summary.update(status='complete', processing_complete=True,\n                                processing_result=final['operation'], observed_at=final['observed_at'])\n        except ActivityError as error:\n            cause = error.cause\n            details = cause.details if isinstance(cause, ApplicationError) else []\n            failure = details[0] if details else {'category': 'infrastructure', 'code': 'activity_budget_exhausted'}\n            self.summary.update({'status': 'failed', 'error': failure,\n                                 'observed_at': workflow.now().isoformat()})\n        return self.summary\n\n    async def call(self, value, submission):\n        return await workflow.execute_activity('pdf_processing_step_v1', value, task_queue=submission['activity_queue'],\n            start_to_close_timeout=timedelta(minutes=12),\n            schedule_to_close_timeout=timedelta(minutes=40),\n            heartbeat_timeout=timedelta(seconds=15),\n            retry_policy=RetryPolicy(initial_interval=timedelta(seconds=2),\n                maximum_interval=timedelta(seconds=10), maximum_attempts=3))\n",
        "relationship_method.py": "\"\"\"Evidence-seam candidate: local function-block/caption associations.\n\nNo oracle, page numbers, source hashes, item IDs, or algorithm names are inputs.\nDiscovery coverage is intentionally unknown outside the emitted candidates.\n\"\"\"\nimport hashlib\nimport json\nimport re\nfrom pathlib import Path\nfrom .evidence import top_left\nimport unicodedata\n\nMETHOD = 'local-function-block-v1'\nHEADER = re.compile(r'function\\s+[\\w-]+\\s*\\(.*?\\)\\s*returns\\s+.*?(?:failure/cutoff|failure)')\nCAPTION = re.compile(r'Figure\\s+\\d+(?:\\.\\d+)*\\b')\n\n\ndef digest(value):\n    return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()\n\n\ndef segments(doc):\n    result = []\n    for item in doc['texts']:\n        for prov in item.get('prov', []):\n            start, end = prov['charspan']\n            valid = type(start) is int and type(end) is int and 0 <= start < end <= len(item['text'])\n            b = prov['bbox']\n            h = doc['pages'][str(prov['page_no'])]['size']['height']\n            box = top_left(b, doc['pages'][str(prov['page_no'])]['size']['width'], h, allow_zero_width=True)\n            result.append({'ref': item['self_ref'], 'page': prov['page_no'], 'range': [start, end],\n                           'box': box, 'text': item['text'][start:end] if valid else '', 'actual_type': item['label'], 'valid_range': valid})\n    return result\n\n\ndef member(segment, role, order):\n    return {k: v for k, v in segment.items() if k != 'text'} | {\n        'role': role, 'order': order, 'text_sha256': hashlib.sha256(segment['text'].encode()).hexdigest()}\n\n\ndef header_parts(header, parts):\n    \"\"\"Bounded neighboring fragments; raw offsets survive concatenation.\"\"\"\n    joined = header['text']\n    selected = [header]\n    match = HEADER.match(joined)\n    if not match and joined.startswith('function'):\n        neighbors = [s for s in parts if s is not header and s['page'] == header['page']\n                     and abs(s['box'][1]-header['box'][1]) <= 2\n                     and s['box'][0] >= header['box'][0]]\n        for part in sorted(neighbors, key=lambda s: s['box'][0])[:8]:\n            selected.append(part)\n            joined += part['text']\n            match = HEADER.match(joined)\n            if match:\n                break\n    if not match:\n        return [], []\n    remaining = match.end()\n    headers, tails = [], []\n    for part in selected:\n        take = min(remaining, len(part['text']))\n        headers.append(dict(part, text=part['text'][:take], range=[part['range'][0], part['range'][0]+take]))\n        if take < len(part['text']):\n            tails.append(dict(part, text=part['text'][take:], range=[part['range'][0]+take, part['range'][1]]))\n        remaining -= take\n    return headers, tails\n\n\ndef row_order(parts):\n    rows = []\n    for part in sorted(parts, key=lambda s: s['box'][1]):\n        if not rows or part['box'][1]-rows[-1][0]['box'][1] > 2:\n            rows.append([part])\n        else:\n            rows[-1].append(part)\n    return [s for row in rows for s in sorted(row, key=lambda s: s['box'][0])]\n\n\ndef derive(doc, source_sha256):\n    all_parts = segments(doc)\n    invalid = [member(s, 'invalid_source_range', None) for s in all_parts if not s['valid_range']]\n    parts = [s for s in all_parts if s['valid_range']]\n    relations = []\n    for header in parts:\n        headers, tails = header_parts(header, parts)\n        if not headers:\n            continue\n        page = header['page']\n        size = doc['pages'][str(page)]['size']\n        captions = [s for s in parts if s['page'] == page and CAPTION.match(s['text'])\n                    and 0 < s['box'][1]-header['box'][3] < .3*size['height']\n                    and abs(s['box'][0]-header['box'][0]) < .08*size['width']]\n        captions.sort(key=lambda s: s['box'][1])\n        relation = {'disposition': 'unresolved', 'reason': 'missing_or_ambiguous_caption',\n                    'members': [member(s, 'header', i) for i, s in enumerate(headers)]}\n        if captions and (len(captions) == 1 or captions[0]['box'][1] != captions[1]['box'][1]):\n            caption = captions[0]\n            body, symbols = list(tails), []\n            header_refs = {(s['ref'], s['page'], tuple(s['box'])) for s in headers}\n            for s in parts:\n                if s['page'] != page or s is caption or (s['ref'], s['page'], tuple(s['box'])) in header_refs:\n                    continue\n                if (header['box'][1] <= s['box'][1] and s['box'][3] < caption['box'][1]\n                        and s['box'][0] >= header['box'][0]-2\n                        and s['box'][2] <= max(header['box'][2], caption['box'][2])+.12*size['width']):\n                    if s['text'] and all(unicodedata.category(c).startswith('M') for c in s['text']):\n                        symbols.append(s)\n                    else:\n                        body.append(s)\n            caption_parts = [caption]\n            # A split caption may have several provenance fragments or same-line items.\n            for part in row_order(parts):\n                if part is caption or part['page'] != page or CAPTION.match(part['text']):\n                    continue\n                if (part['ref'] == caption['ref'] and part['range'][0] >= caption['range'][1]) or (\n                        abs(part['box'][1]-caption['box'][1]) <= 2 and part['box'][0] >= caption['box'][2]-2):\n                    caption_parts.append(part)\n            relation['members'] += [member(s, 'body', len(headers)+i) for i, s in enumerate(row_order(body))]\n            relation['members'] += [member(s, 'caption', len(headers)+len(body)+i) for i, s in enumerate(row_order(caption_parts))]\n            relation['symbol_uncertainty'] = [member(s, 'unplaced_combining_mark', None) for s in symbols]\n            relation['reason'] = 'local_function_block_and_numbered_caption' if body else 'missing_body'\n            relation['disposition'] = 'candidate' if body else 'unresolved'\n        relations.append(relation)\n    return {'method': METHOD, 'method_sha256': hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),\n            'source_sha256': source_sha256, 'document_sha256': digest(doc),\n            'coverage': 'local_function_headers_only; whole_document_unknown',\n            'assertion_origin': 'method_derived_not_source_review', 'relationships': relations,\n            'unresolved_input_regions': invalid, 'canonical_accepted': False}\n",
        "relationships.py": "\"\"\"Versioned, bounded method assertions over unchanged parsed text.\n\nCoverage declarations are operator input, never inferred from emitted successes.\nNo source oracle, algorithm identity, or expected edge participates in discovery.\n\"\"\"\nimport copy\nimport hashlib\nimport math\n\nMETHOD = 'local-function-block-v1'\nPOLICY = 'typed-source-relationships-v2'\nREPRESENTATION = 'source-reviewed-representation-v1'\n\n\ndef validate_policy(policy):\n    if set(policy) not in ({'method', 'coverage', 'unresolved'},\n                           {'method', 'coverage', 'unresolved', 'representation'}) or policy['method'] != METHOD:\n        raise ValueError('unsupported_relationship_method')\n    if policy['unresolved'] not in ('reject', 'allow_unknown'):\n        raise ValueError('unsupported_relationship_disposition')\n    coverage = policy['coverage']\n    if 'representation' in policy:\n        review = policy['representation']\n        if (set(review) != {'version', 'reviews'} or review['version'] != REPRESENTATION\n                or not isinstance(review['reviews'], list)):\n            raise ValueError('unsupported_representation_policy')\n        if coverage.get('mode') != 'selected_regions' or policy['unresolved'] != 'reject':\n            raise ValueError('reviewed_representation_requires_structure')\n    if coverage == {'mode': 'unknown'}:\n        if policy['unresolved'] != 'allow_unknown':\n            raise ValueError('unknown_coverage_prohibited')\n        return\n    if set(coverage) != {'mode', 'source_sha256', 'regions'} or coverage['mode'] != 'selected_regions':\n        raise ValueError('unsupported_relationship_coverage')\n    sha = coverage['source_sha256']\n    if not isinstance(sha, str) or len(sha) != 64 or any(c not in '0123456789abcdef' for c in sha):\n        raise ValueError('invalid_coverage_source')\n    regions = coverage['regions']\n    if not isinstance(regions, list) or not regions:\n        raise ValueError('missing_required_coverage')\n    ids = set()\n    for region in regions:\n        if set(region) != {'id', 'page', 'box', 'required_count'}:\n            raise ValueError('invalid_coverage_region')\n        if not isinstance(region['id'], str) or not region['id'] or region['id'] in ids:\n            raise ValueError('duplicate_coverage_id')\n        ids.add(region['id'])\n        if type(region['page']) is not int or region['page'] < 1:\n            raise ValueError('invalid_coverage_page')\n        box = region['box']\n        if (not isinstance(box, list) or len(box) != 4 or\n                any(type(x) not in (int, float) or not math.isfinite(x) for x in box) or\n                not (0 <= box[0] < box[2] and 0 <= box[1] < box[3])):\n            raise ValueError('invalid_coverage_box')\n        if type(region['required_count']) is not int or region['required_count'] < 1:\n            raise ValueError('invalid_required_count')\n    for i, left in enumerate(regions):\n        for right in regions[i+1:]:\n            a, b = left['box'], right['box']\n            if left['page'] == right['page'] and max(a[0], b[0]) < min(a[2], b[2]) and max(a[1], b[1]) < min(a[3], b[3]):\n                raise ValueError('overlapping_coverage_regions')\n    if 'representation' in policy:\n        validate_representation_policy(policy)\n\n\ndef validate_representation_policy(policy):\n    \"\"\"Closed, opt-in review contract; unreviewed content never inherits an allowance.\"\"\"\n    import unicodedata\n    try:\n        reviews = policy['representation']['reviews']\n        regions = {r['id']: r for r in policy['coverage']['regions']}\n        selections = [r['selection'] for r in reviews]\n        if len(selections) != len(set(selections)) or set(selections) != set(regions):\n            raise ValueError('incomplete_representation_reviews')\n        ids = set()\n        for review in reviews:\n            if set(review) != {'id', 'selection', 'page', 'source_sha256', 'reviewer', 'reason', 'streams', 'isolated_symbols'}:\n                raise ValueError('unsupported_representation_review')\n            if any(not isinstance(review[k], str) or not review[k] for k in ('id', 'reviewer', 'reason')) or review['id'] in ids:\n                raise ValueError('invalid_representation_review_identity')\n            ids.add(review['id'])\n            region = regions[review['selection']]\n            if (review['source_sha256'] != policy['coverage']['source_sha256']\n                    or type(review['page']) is not int or review['page'] != region['page']\n                    or region['required_count'] != 1):\n                raise ValueError('representation_review_attribution_mismatch')\n            if set(review['streams']) != {'header_body', 'caption'}:\n                raise ValueError('incomplete_representation_streams')\n            for name, stream in review['streams'].items():\n                if set(stream) != {'source_compacted_sha256', 'extracted_compacted_sha256', 'differences'}:\n                    raise ValueError('unsupported_representation_stream')\n                for key in ('source_compacted_sha256', 'extracted_compacted_sha256'):\n                    sha = stream[key]\n                    if not isinstance(sha, str) or len(sha) != 64 or any(c not in '0123456789abcdef' for c in sha):\n                        raise ValueError('invalid_representation_digest')\n                if not isinstance(stream['differences'], list):\n                    raise ValueError('invalid_representation_differences')\n                for difference in stream['differences']:\n                    pairs = {'minus_hyphen': ('−', '-'), 'combining_control': ('\\x07', ''), 'caption_control': ('\\x02', '')}\n                    if (set(difference) != {'kind', 'source_range', 'extracted_range', 'source', 'extracted', 'disposition'}\n                            or difference['kind'] not in pairs\n                            or (difference['source'], difference['extracted']) != pairs[difference['kind']]\n                            or (difference['kind'] == 'caption_control') != (name == 'caption')):\n                        raise ValueError('unsupported_representation_difference')\n                    if difference['disposition'] not in ('retain_uninterpreted', 'release_gate'):\n                        raise ValueError('unsupported_representation_disposition')\n                    for key in ('source_range', 'extracted_range'):\n                        bounds = difference[key]\n                        if (not isinstance(bounds, list) or len(bounds) != 2\n                                or any(type(n) is not int for n in bounds) or not 0 <= bounds[0] <= bounds[1]):\n                            raise ValueError('invalid_representation_comparison_range')\n            if not isinstance(review['isolated_symbols'], list):\n                raise ValueError('invalid_isolated_symbol_reviews')\n            for symbol in review['isolated_symbols']:\n                if (set(symbol) != {'text', 'disposition'} or not isinstance(symbol['text'], str) or not symbol['text']\n                        or not all(unicodedata.category(c).startswith('M') for c in symbol['text'])\n                        or symbol['disposition'] not in ('retain_uninterpreted', 'release_gate')):\n                    raise ValueError('unsupported_isolated_symbol_review')\n    except (KeyError, TypeError, IndexError) as error:\n        raise ValueError('invalid_representation_policy') from error\n\n\ndef inside(member, region):\n    a, b = member['box'], region['box']\n    return member['page'] == region['page'] and b[0] <= a[0] <= a[2] <= b[2] and b[1] <= a[1] <= a[3] <= b[3]\n\n\ndef build(document, source, parsed_result, assembly, policy):\n    from .relationship_method import derive, digest\n    validate_policy(policy)\n    declared = policy['coverage']\n    if declared['mode'] == 'selected_regions' and declared['source_sha256'] != source['artifact']['sha256']:\n        raise ValueError('relationship_coverage_source_mismatch')\n    candidates = derive(document, source['artifact']['sha256'])\n    resolved, unresolved, selections = [], [], []\n    regions = declared.get('regions', [])\n    for region in regions:\n        size = document['pages'][str(region['page'])]['size']\n        if region['box'][2] > size['width'] or region['box'][3] > size['height']:\n            raise ValueError('coverage_region_outside_page')\n        found = [r for r in candidates['relationships'] if inside(r['members'][0], region)]\n        selections.append({'id': region['id'], 'required_count': region['required_count'],\n                           'candidate_count': len(found)})\n        if len(found) != region['required_count']:\n            unresolved.append({'selection': region['id'], 'reason': 'required_count_mismatch', 'region': region})\n        for relation in found:\n            record = {**copy.deepcopy(relation), 'selection': region['id'], 'kind': 'algorithm', 'method': METHOD}\n            record['id'] = digest({'selection': region['id'], 'members': relation['members']})\n            if (relation['disposition'] != 'candidate' or (relation.get('symbol_uncertainty') and 'representation' not in policy) or\n                    not all(inside(m, region) for m in relation['members'])):\n                record['disposition'] = 'unresolved'\n                record['reason'] = ('symbol_disposition_not_supported' if relation.get('symbol_uncertainty')\n                                    else 'incomplete_or_outside_selected_region')\n                unresolved.append(record)\n            else:\n                if 'representation' in policy:\n                    member_stream(record['members'], document)\n                    record['representation'] = reviewed_representation(record, document, region, policy)\n                record['disposition'] = 'resolved'\n                resolved.append(record)\n    if declared['mode'] == 'unknown':\n        unresolved.append({'reason': 'discovery_coverage_unknown', 'evidence': 'content_evidence_pages'})\n    invalid = [m for m in candidates['unresolved_input_regions'] if any(inside(m, r) for r in regions)]\n    if invalid:\n        unresolved.append({'reason': 'invalid_source_ranges', 'members': invalid})\n    return {'version': 1, 'policy': POLICY, 'method': METHOD, 'source': source,\n            'parsed_result': parsed_result, 'assembly': assembly, 'document_sha256': digest(document),\n            'coverage': {'declaration': declared, 'selections': selections, 'outside_selection': 'unknown'},\n            'candidates': candidates, 'resolved': resolved, 'unresolved': unresolved,\n            'source_review': {'status': 'not_performed'}, 'quality_accepted': False, 'canonical_accepted': False}\n\n\ndef member_stream(members, document):\n    \"\"\"Compare exact ordered coverage while permitting adjacent range fragmentation.\"\"\"\n    from .relationship_method import segments\n    parts = segments(document)\n    items = {item['self_ref']: item for item in document['texts']}\n    stream = []\n    ranks = {'header': 0, 'body': 1, 'caption': 2}\n    previous = -1\n    seen = set()\n    for i, member in enumerate(members):\n        if type(member.get('order')) is not int or member['order'] != i:\n            raise ValueError('invalid_relationship_order')\n        role = member.get('role')\n        if role not in ranks or ranks[role] < previous:\n            raise ValueError('invalid_relationship_role')\n        previous = ranks[role]\n        start, end = member['range']\n        item = items[member['ref']]\n        if type(start) is not int or type(end) is not int or not 0 <= start < end <= len(item['text']):\n            raise ValueError('invalid_relationship_range')\n        if member['text_sha256'] != hashlib.sha256(item['text'][start:end].encode()).hexdigest():\n            raise ValueError('relationship_text_mismatch')\n        if not any(p['ref'] == member['ref'] and p['page'] == member['page'] and p['box'] == member['box']\n                   and p['actual_type'] == member['actual_type'] and p['valid_range']\n                   and p['range'][0] <= start < end <= p['range'][1] for p in parts):\n            raise ValueError('relationship_region_mismatch')\n        for offset in range(start, end):\n            key = (member['ref'], offset)\n            if key in seen:\n                raise ValueError('duplicate_relationship_membership')\n            seen.add(key)\n            stream.append((member['ref'], member['page'], offset, role, tuple(member['box']), member['actual_type']))\n    if {m['role'] for m in members} != set(ranks):\n        raise ValueError('missing_relationship_role')\n    return stream\n\n\ndef validate(report, document, source, parsed_result, assembly, policy):\n    \"\"\"Publication barrier: fresh independent discovery plus frozen required coverage.\n\n    This validates method consistency, not source quality. Independent source\n    oracles belong to qualification, not to this runtime validator.\n    \"\"\"\n    from .relationship_method import digest\n    expected = build(document, source, parsed_result, assembly, policy)\n    try:\n        if set(report) != set(expected):\n            raise ValueError('relationship_fields_mismatch')\n        for field in expected:\n            if field != 'resolved' and digest(report[field]) != digest(expected[field]):\n                raise ValueError('relationship_mismatch_' + field)\n        if len(report['resolved']) != len(expected['resolved']):\n            raise ValueError('incomplete_required_relationships')\n        for actual, required in zip(report['resolved'], expected['resolved']):\n            # JSON fingerprints distinguish true/1 and 1.0/1 in symbol evidence\n            # and comparison coordinates; Python container equality does not.\n            if digest({k: v for k, v in actual.items() if k != 'members'}) != digest({k: v for k, v in required.items() if k != 'members'}):\n                raise ValueError('relationship_result_mismatch')\n            if member_stream(actual['members'], document) != member_stream(required['members'], document):\n                raise ValueError('relationship_membership_mismatch')\n        if report['unresolved'] and policy['unresolved'] == 'reject':\n            raise ValueError('required_relationship_unresolved')\n        for relation in report['resolved']:\n            representation = relation.get('representation')\n            if representation:\n                observations = representation['isolated_symbols'] + [\n                    d for stream in representation['streams'].values() for d in stream['differences']]\n                if any(o['disposition'] != 'retain_uninterpreted' for o in observations):\n                    raise ValueError('representation_release_gate')\n    except (KeyError, TypeError, IndexError) as error:\n        raise ValueError('invalid_relationship_output') from error\n\n\ndef reviewed_representation(relation, document, region, policy):\n    \"\"\"Apply an operator's source review after discovery, never as an answer table.\n\n    Compacted sequences are only a comparison coordinate system. Every emitted\n    extraction range indexes unchanged raw text; absent characters have no range.\n    \"\"\"\n    reviews = policy['representation']['reviews']\n    # validate_policy has already checked review identity, attribution and shape.\n    review = next(r for r in reviews if r['selection'] == region['id'])\n    items = {item['self_ref']: item for item in document['texts']}\n    evidence = {'page': region['page'], 'box': region['box'], 'scope': 'selected_source_region',\n                'coordinate_space': 'page-local TOPLEFT PDF points'}\n    streams = {}\n    for name, roles in [('header_body', ('header', 'body')), ('caption', ('caption',))]:\n        members = [m for m in relation['members'] if m['role'] in roles]\n        characters = [(c, m, offset) for m in members for offset in range(*m['range'])\n                      if not (c := items[m['ref']]['text'][offset]).isspace()]\n        text = ''.join(c for c, _, _ in characters)\n        reviewed = review['streams'][name]\n        if hashlib.sha256(text.encode()).hexdigest() != reviewed['extracted_compacted_sha256']:\n            raise ValueError('unreviewed_representation_content')\n        differences = []\n        reconstructed, source_end, extracted_end = '', 0, 0\n        for difference in reviewed['differences']:\n            start, end = difference['extracted_range']\n            left, right = difference['source_range']\n            if (any(type(n) is not int for n in (start, end, left, right))\n                    or not extracted_end <= start <= end <= len(text)\n                    or left != source_end + start - extracted_end\n                    or right != left + len(difference['source'])\n                    or text[start:end] != difference['extracted']):\n                raise ValueError('invalid_representation_comparison_range')\n            reconstructed += text[extracted_end:start] + difference['source']\n            source_end, extracted_end = right, end\n            raw = []\n            for _, member, offset in characters[start:end]:\n                # Keep raw provenance, not an invented glyph position.\n                raw.append({**member, 'range': [offset, offset+1],\n                            'text_sha256': hashlib.sha256(items[member['ref']]['text'][offset].encode()).hexdigest()})\n            differences.append({**copy.deepcopy(difference), 'raw_extracted_ranges': raw,\n                                'evidence': evidence})\n        reconstructed += text[extracted_end:]\n        if hashlib.sha256(reconstructed.encode()).hexdigest() != reviewed['source_compacted_sha256']:\n            raise ValueError('unreviewed_representation_difference')\n        streams[name] = {**copy.deepcopy(reviewed), 'differences': differences,\n                         'comparison_coordinates': 'whitespace-compacted Unicode code points; not raw item ranges',\n                         'source_native_equal': not differences}\n    symbols = relation.get('symbol_uncertainty', [])\n    if len(symbols) != len(review['isolated_symbols']):\n        raise ValueError('unreviewed_isolated_symbols')\n    isolated = []\n    size = document['pages'][str(region['page'])]['size']\n    for member, annotation in zip(symbols, review['isolated_symbols']):\n        text = items[member['ref']]['text'][slice(*member['range'])]\n        if text != annotation['text'] or not inside(member, region):\n            raise ValueError('isolated_symbol_review_mismatch')\n        isolated.append({**copy.deepcopy(annotation), 'member': copy.deepcopy(member),\n                         'position_in_body': None, 'evidence': {**evidence, 'scope': 'full_page_context',\n                            'box': [0, 0, size['width'], size['height']]}})\n    return {'version': REPRESENTATION, 'review_id': review['id'], 'reviewer': review['reviewer'],\n            'reason': review['reason'], 'assertion_origin': 'profile_source_review_not_discovery',\n            'streams': streams, 'isolated_symbols': isolated, 'evidence': evidence,\n            'source_native_equal': all(s['source_native_equal'] for s in streams.values()) and not isolated,\n            'semantic_equivalence': 'not_claimed', 'raw_extraction_modified': False}\n",
        "rollout_workflow.py": "\"\"\"Explicit-queue Workflow type; legacy PDFProcessing histories keep their type.\"\"\"\nfrom datetime import timedelta\nfrom temporalio import workflow\nfrom temporalio.common import RetryPolicy\nfrom .processing_workflow import PDFProcessing\nfrom .routing import validate, stage_for\n\n\n@workflow.defn\nclass PDFRolloutProcessing(PDFProcessing):\n    @workflow.run\n    async def run(self, submission: dict) -> dict:\n        try:\n            route = validate(submission['routing'])\n            if not isinstance(submission.get('request'), dict):\n                raise ValueError('invalid_routing')\n            if (workflow.info().task_queue != route['queues']['workflow'] or\n                    submission['request'].get('routing_id') != route['id']):\n                raise ValueError('invalid_routing')\n        except (KeyError, TypeError, ValueError):\n            self.summary.update(status='failed', error={'category':'configuration', 'code':'invalid_routing'})\n            return self.summary\n        self.summary['routing_id'] = route['id']\n        return await super().run({**submission, 'activity_queue': route['queues']['prepare']})\n\n    async def call(self, value, submission):\n        route = submission['routing']\n        return await workflow.execute_activity('pdf_processing_routed_step_v1',\n            {**value, 'routing_id': route['id']}, task_queue=route['queues'][stage_for(value)],\n            start_to_close_timeout=timedelta(minutes=12),\n            schedule_to_close_timeout=timedelta(minutes=40),\n            heartbeat_timeout=timedelta(seconds=15),\n            retry_policy=RetryPolicy(initial_interval=timedelta(seconds=2),\n                maximum_interval=timedelta(seconds=10), maximum_attempts=3))\n",
        "routed_activity.py": "\"\"\"Guard a stage worker with its retained release and exact execution inventory.\"\"\"\nimport asyncio\nfrom temporalio import activity\nfrom .processing import reject\nfrom .routing import validate, release_binding, stage_for, STAGES\nfrom .object_store import StoreFailure\n\n\n\nclass RoutedActivity:\n    def __init__(self, processing, route, stage, queue, image):\n        self.processing = processing\n        self.route = validate(route)\n        self.stage = stage\n        if (release_binding(processing.profile, processing.producer, processing.limits,\n                processing.store.bucket, processing.store.prefix) != route['binding'] or stage not in STAGES or\n                queue != route['queues'][stage] or image != route['images'][stage]):\n            raise ValueError('worker_routing_mismatch')\n\n    @activity.defn(name='pdf_processing_routed_step_v1')\n    async def run(self, value):\n        try:\n            stage = stage_for(value)\n        except (KeyError, TypeError, ValueError):\n            reject('invalid_routing_stage', 'method')\n        if (value.get('routing_id') != self.route['id'] or\n                activity.info().task_queue != self.route['queues'][self.stage] or\n                stage != self.stage):\n            reject('worker_routing_mismatch', 'method')\n        if value['stage'] == 'prepare':\n            request = value['request']\n        else:\n            try:\n                plan = await asyncio.to_thread(self.processing.load_plan, value['plan'])\n            except StoreFailure as error:\n                reject(error.code, error.category)\n            request = plan['request']\n        if request.get('routing_id') != self.route['id']:\n            reject('request_routing_conflict', 'method')\n        result = await self.processing.run(value)\n        return {**result, 'routing_id': self.route['id'], 'worker_stage': self.stage,\n            'attempt': activity.info().attempt,\n            'task_queue': activity.info().task_queue}\n",
        "routing.py": "\"\"\"Frozen explicit queues for independently deployed processing stages.\n\nThis pure module is safe in the deterministic Workflow sandbox. Queue names are\ncontent-addressed by the complete release binding; a release is never retargeted.\n\"\"\"\nimport hashlib\nimport json\nimport re\n\nSTAGES = ('prepare', 'group', 'assembly', 'select', 'component_ocr', 'finalize')\nCONTRACT = 'pdf-explicit-routing-v1'\n\n\ndef fingerprint(value):\n    return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()\n\n\ndef release_binding(profile, producer, limits, bucket, prefix):\n    return {'profile': fingerprint(profile), 'producer': fingerprint(producer),\n        'limits': fingerprint(limits), 'models': fingerprint(profile['method']['model_artifacts']),\n        'store': {'bucket': bucket, 'prefix': prefix}}\n\n\ndef release(binding, images, prefix):\n    \"\"\"Build a maintainer manifest after images/profile/models have been retained.\"\"\"\n    value = {'contract': CONTRACT, 'binding': binding, 'images': images, 'prefix': prefix}\n    identity = fingerprint(value)\n    value['id'] = identity\n    value['queues'] = {stage: f'{prefix}-{stage}-{identity}' for stage in ('workflow', *STAGES)}\n    validate(value)\n    return value\n\n\ndef validate(route):\n    try:\n        if set(route) != {'contract', 'binding', 'images', 'prefix', 'id', 'queues'}:\n            raise ValueError()\n        if route['contract'] != CONTRACT or not re.fullmatch(r'[a-z0-9-]{1,80}', route['prefix']):\n            raise ValueError()\n        binding = route['binding']\n        if set(binding) != {'profile', 'producer', 'limits', 'models', 'store'}:\n            raise ValueError()\n        if any(not re.fullmatch('[0-9a-f]{64}', binding[k]) for k in ('profile','producer','limits','models')):\n            raise ValueError()\n        if set(binding['store']) != {'bucket', 'prefix'} or not all(binding['store'].values()):\n            raise ValueError()\n        stages = ('workflow', *STAGES)\n        if set(route['images']) != set(stages) or any(not re.fullmatch(r'.+@sha256:[0-9a-f]{64}', v) for v in route['images'].values()):\n            raise ValueError()\n        identity = fingerprint({k: route[k] for k in ('contract','binding','images','prefix')})\n        if route['id'] != identity or route['queues'] != {s: f'{route[\"prefix\"]}-{s}-{identity}' for s in stages}:\n            raise ValueError()\n    except (KeyError, TypeError, AttributeError):\n        raise ValueError('invalid_routing') from None\n    except ValueError:\n        raise ValueError('invalid_routing') from None\n    return route\n\n\ndef stage_for(value):\n    stage = value['operation']['kind'] if value['stage'] == 'execute' else value['stage']\n    if stage not in STAGES:\n        raise ValueError('invalid_routing_stage')\n    return stage\n\n\ndef submission(request, release_id, retained):\n    \"\"\"Internal admission: select an explicitly retained release; never resolve latest.\"\"\"\n    route = retained.get(release_id)\n    if route is None:\n        raise ValueError('routing_unavailable')\n    validate(route)\n    if route['id'] != release_id:\n        raise ValueError('invalid_routing')\n    if request.get('routing_id', route['id']) != route['id']:\n        raise ValueError('request_routing_conflict')\n    return {'request': {**request, 'routing_id': route['id']},\n            'routing': json.loads(json.dumps(route))}\n",
        "supervision.py": "\"\"\"One sequential, correlated native parser process; memory never owns progress.\"\"\"\nimport asyncio\nfrom contextlib import asynccontextmanager\nfrom datetime import datetime, timezone\nimport json\nimport os\nfrom pathlib import Path\nimport signal\nimport sys\nimport time\nimport uuid\n\nfrom .execution import ChildFailure\n\n\ndef now():\n    return datetime.now(timezone.utc).isoformat()\n\n\nclass WarmParser:\n    def __init__(self, *, startup_seconds=120, no_progress_seconds=180,\n                 terminate_seconds=5, reap_seconds=5, max_requests=100, command=None):\n        if any(v <= 0 for v in (startup_seconds, no_progress_seconds, terminate_seconds, reap_seconds, max_requests)):\n            raise ValueError('Parser budgets must be positive; provisional pending T09 calibration')\n        self.startup_seconds, self.no_progress_seconds = startup_seconds, no_progress_seconds\n        self.terminate_seconds, self.reap_seconds = terminate_seconds, reap_seconds\n        self.max_requests = max_requests\n        self.command = command or [sys.executable, '-m', 'pdf_processing.warm_child']\n        self.process = None\n        self.lock = asyncio.Lock()\n        self.closed = False\n        self.count = 0\n        self.observation = {'ready': False, 'restarts': 0, 'recycles': 0, 'handoffs': 0,\n                            'last_local_progress': None, 'termination_reason': None}\n\n    async def stop(self, reason):\n        p = self.process\n        self.observation.update(ready=False, termination_reason=reason, forced_kill=False, observed_at=now())\n        if p is None:\n            return\n        if p.returncode is None:\n            try:\n                os.killpg(p.pid, signal.SIGCONT)\n                os.killpg(p.pid, signal.SIGTERM)\n            except ProcessLookupError:\n                pass\n            try:\n                await asyncio.wait_for(p.wait(), self.terminate_seconds)\n            except TimeoutError:\n                self.observation['forced_kill'] = True\n                try:\n                    os.killpg(p.pid, signal.SIGKILL)\n                except ProcessLookupError:\n                    pass\n                try:\n                    await asyncio.wait_for(p.wait(), self.reap_seconds)\n                except TimeoutError:\n                    self.closed = True\n                    self.observation['reap_failed'] = True\n                    raise\n        if p.returncode is None:\n            raise RuntimeError('owned parser was not reaped')\n        self.observation['exit_code'] = p.returncode\n        self.process = None\n        self.count = 0\n\n    async def close(self, reason='worker_shutdown'):\n        self.closed = True\n        async with self.lock:\n            await self.stop(reason)\n\n    def fail_closed(self, reason):\n        \"\"\"Prevent parser reuse after another child cannot be reaped.\"\"\"\n        self.closed = True\n        self.observation.update(ready=False, termination_reason=reason,\n                                reap_failed=True, observed_at=now())\n\n    @asynccontextmanager\n    async def fresh_child_handoff(self):\n        \"\"\"Own parser capacity while one memory-heavy fresh child runs.\n\n        The same lock covers ``run``. A handoff requested during capture waits\n        for that request to finish. The lock remains held until the caller's\n        fresh child has exited, so another queue cannot rebuild the warm parser\n        concurrently. Caller cancellation during the initial reap waits for\n        owned-process cleanup before it is propagated.\n        \"\"\"\n        async with self.lock:\n            if self.closed:\n                raise ChildFailure('infrastructure', 'worker_draining')\n            if self.process is not None:\n                self.observation['handoffs'] += 1\n                cleanup = asyncio.create_task(self.stop('fresh_child_handoff'))\n                try:\n                    await asyncio.shield(cleanup)\n                except asyncio.CancelledError:\n                    # Process ownership outlives the cancelled caller. Do not\n                    # let scratch teardown race an unreaped warm parser.\n                    await cleanup\n                    raise\n            yield dict(self.observation)\n\n    async def run(self, request, out, heartbeat, hard_seconds):\n        async with self.lock:\n            if self.closed:\n                raise ChildFailure('infrastructure', 'worker_draining')\n            if self.process is None:\n                self.process = await asyncio.create_subprocess_exec(*self.command,\n                    stdin=asyncio.subprocess.PIPE, stdout=asyncio.subprocess.PIPE,\n                    stderr=asyncio.subprocess.STDOUT, start_new_session=True, limit=1024*1024)\n                self.observation['restarts'] += 1\n            p = self.process\n            assert p.stdin is not None and p.stdout is not None\n            correlation = uuid.uuid4().hex\n            self.observation.update(ready=False, pid=p.pid, request_id=correlation,\n                                    observed_at=now(), forced_kill=False)\n            started = last = time.monotonic()\n            reader = None\n            try:\n                p.stdin.write((json.dumps({'version':1, 'request_id':correlation, 'request':request})+'\\n').encode())\n                await p.stdin.drain()\n                with (Path(out)/'process.log').open('ab') as log:\n                    reader = asyncio.create_task(p.stdout.readline())\n                    while True:\n                        elapsed = time.monotonic()-started\n                        if elapsed > hard_seconds:\n                            raise ChildFailure('parser', 'child_hard_deadline')\n                        if not self.observation['ready'] and elapsed > self.startup_seconds:\n                            raise ChildFailure('parser', 'child_startup_deadline')\n                        if self.observation['ready'] and time.monotonic()-last > self.no_progress_seconds:\n                            raise ChildFailure('parser', 'child_no_progress')\n                        heartbeat({'parser': dict(self.observation), 'durable_completion':False})\n                        done, _ = await asyncio.wait({reader}, timeout=.2)\n                        if not done:\n                            continue\n                        raw = reader.result()\n                        if not raw:\n                            await p.wait()\n                            code = 'child_killed_or_oom' if p.returncode == -9 else 'child_crashed'\n                            raise ChildFailure('parser', code)\n                        log.write(raw); log.flush()\n                        reader = asyncio.create_task(p.stdout.readline())\n                        try:\n                            row = json.loads(raw)\n                        except (ValueError, UnicodeDecodeError):\n                            continue\n                        if not isinstance(row, dict) or row.get('protocol') != 'pdf-warm-v1':\n                            continue\n                        if row.get('request_id') != correlation:\n                            raise ChildFailure('integrity', 'child_correlation_mismatch')\n                        kind = row.get('kind')\n                        if kind == 'failure':\n                            raise ChildFailure(row['category'], row['code'])\n                        if kind == 'ready':\n                            from .compatibility import methods_match\n                            if not methods_match(row.get('method'), request['expected_method'], request.get('checkpoint_compatibility') is not None):\n                                raise ChildFailure('method', 'worker_method_mismatch')\n                            self.observation['ready'] = True\n                        elif kind == 'progress':\n                            if not self.observation['ready']:\n                                raise ChildFailure('integrity', 'progress_before_readiness')\n                            self.observation['stage'] = row.get('stage')\n                        elif kind == 'done':\n                            if not self.observation['ready']:\n                                raise ChildFailure('integrity', 'completion_before_readiness')\n                            self.observation.update(memory=row.get('memory'), completed_at=now())\n                            self.count += 1\n                            if self.count >= self.max_requests:\n                                self.observation['recycles'] += 1\n                                await self.stop('request_recycle')\n                            return dict(self.observation)\n                        else:\n                            raise ChildFailure('integrity', 'invalid_child_protocol')\n                        last = time.monotonic()\n                        self.observation['last_local_progress'] = now()\n            except BaseException as error:\n                await self.stop(error.code if isinstance(error, ChildFailure) else 'attempt_cancelled' if isinstance(error, asyncio.CancelledError) else 'child_transport_failure')\n                raise\n            finally:\n                if reader is not None:\n                    reader.cancel()\n                    await asyncio.gather(reader, return_exceptions=True)\n",
        "temporal.py": "\"\"\"Small real-service harness for the extracted operation seam.\n\nThe caller supplies source/method and page groups; T02 owns policy and admission.\n\"\"\"\nimport asyncio\nfrom datetime import timedelta\nfrom pathlib import Path\n\nfrom temporalio import activity, workflow\nfrom temporalio.client import Client\nfrom temporalio.common import RetryPolicy\nfrom temporalio.worker import Worker\nfrom .execution import Execution, SourceRequest\n\n\nclass Activities:\n    def __init__(self, store, scratch):\n        self.store, self.scratch = store, scratch\n\n    @activity.defn(name='pdf_operation')\n    async def produce(self, request):\n        source = dict(request['source'])\n        for key in ('pdf', 'model_cache'): source[key] = Path(source[key])\n        execution = Execution(SourceRequest(**source), self.store, self.scratch, activity.heartbeat)\n        return await execution.produce(request['operation'])\n\n\n@workflow.defn(sandboxed=False)\nclass PDFExecution:\n    @workflow.run\n    async def run(self, request):\n        async def call(operation):\n            return await workflow.execute_activity('pdf_operation',\n                {'source': request['source'], 'operation': operation},\n                start_to_close_timeout=timedelta(minutes=10),\n                heartbeat_timeout=timedelta(seconds=15),\n                retry_policy=RetryPolicy(maximum_attempts=4))\n        groups = []\n        for start, end in request['groups']:\n            groups.append(await call({'kind': 'group', 'start': start, 'end': end}))\n        parsed = await call({'kind': 'assembly', 'groups': groups,\n            'start': request['groups'][0][0], 'end': request['groups'][-1][1]})\n        ocr = []\n        for component in request['components']:\n            ocr.append(await call({'kind': 'ocr', 'parsed': parsed, 'component': component}))\n        return {'groups': groups, 'parsed': parsed, 'ocr': ocr}\n\n\nasync def serve(client: Client, task_queue, store, scratch):\n    activities = Activities(store, Path(scratch))\n    async with Worker(client, task_queue=task_queue, workflows=[PDFExecution],\n                      activities=[activities.produce], max_concurrent_activities=1):\n        await asyncio.Event().wait()\n",
        "warm_child.py": "\"\"\"Private newline protocol for one native converter; any failure exits the child.\"\"\"\nimport json\nimport sys\nfrom .execution import ChildFailure\nfrom .parse import ParseRequest, execute\n\n\ndef main():\n    correlation = None\n    def receive():\n        nonlocal correlation\n        line = sys.stdin.readline()\n        if not line:\n            return None\n        envelope = json.loads(line)\n        if envelope.get('version') != 1 or not isinstance(envelope.get('request_id'), str):\n            raise ChildFailure('integrity', 'invalid_child_request')\n        correlation = envelope['request_id']\n        return ParseRequest.from_json(envelope['request'])\n    def notify(kind, **data):\n        print(json.dumps({'protocol':'pdf-warm-v1', 'request_id':correlation,\n                          'kind':kind, **data}), flush=True)\n    try:\n        request = receive()\n        if request is not None:\n            execute(request, receive, notify)\n    except Exception as error:\n        category, code = (error.category, error.code) if isinstance(error, ChildFailure) else ('parser', 'parser_execution_failed')\n        notify('failure', category=category, code=code)\n        raise SystemExit(1)\n\nif __name__ == '__main__':\n    main()\n"
