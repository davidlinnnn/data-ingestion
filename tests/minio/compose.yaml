# Local stand-in for the S3-compatible object store (#57 undecided), for tests marked `minio`.
# Runs outside the Codex sandbox:
#   docker compose -f tests/minio/compose.yaml up -d --wait
#   env KP_S3_ENDPOINT=http://127.0.0.1:9100 KP_S3_BUCKET=kp-dev \
#       AWS_ACCESS_KEY_ID=kpdev AWS_SECRET_ACCESS_KEY=kpdev-secret .venv/bin/pytest -m minio
# Dev-only credentials; nothing here is a secret.
name: kp-minio
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: kpdev
      MINIO_ROOT_PASSWORD: kpdev-secret
    ports: ["127.0.0.1:9100:9000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      retries: 30
  bucket:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 kpdev kpdev-secret && mc mb -p local/kp-dev"]
