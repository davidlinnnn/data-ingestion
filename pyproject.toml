[project]
name = "kp-processing"
version = "0.1.0"
description = "Knowledge Platform processing workers: the paper-pdf Processing Profile"
requires-python = "==3.12.*"
dependencies = [
    "temporalio==1.34.0",
    "docling-slim[convert-core,format-pdf,models-local,feat-ocr-rapidocr-onnx]==2.132.0",
    "docling-core==2.99.0",
    "rapidocr==3.9.2",
    "pypdfium2>=5,<6",
    "onnxruntime",
    "torch",
    "torchvision",
    "httpx",
    "boto3",
    "prometheus-client",
    "pyyaml",
]

[project.scripts]
kp-processing = "kp_processing.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyright",
    "ruff",
    "pypdf>=6.21.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.11"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "s3: needs the S3 stand-in from tests/s3/compose.yaml (runs outside the Codex sandbox)",
    "network: needs a local network listener (runs outside the Codex sandbox)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
force-exclude = true  # also when docs/ is passed on the command line

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src", "tests", "tools"]
venvPath = "."
venv = ".venv"
